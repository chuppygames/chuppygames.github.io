<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つみつみタワー｜Chuppy Games Day 005</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    color: #e8e4f0;
    background: #141a2e;
    overflow: hidden; position: relative; user-select: none;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(ellipse at 50% 8%, #2c3556 0%, #141a2e 60%);
  }

  .app {
    position: relative; z-index: 3;
    width: 100%; max-width: 380px;
    background: #1d2540;
    border-radius: 26px;
    padding: 16px 14px 14px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.55);
  }

  h1 { font-size: 25px; text-align: center; letter-spacing: 3px; color: #ffd166; }
  .sub { text-align: center; font-size: 11px; color: #7b83a8; margin: 3px 0 11px; }

  .hud { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .hud div { flex: 1; text-align: center; background: #26304f; border-radius: 13px; padding: 6px 0 4px; }
  .hud span { display: block; font-size: 10px; color: #7b83a8; }
  .hud b { font-size: 20px; font-variant-numeric: tabular-nums; }
  #mute {
    width: 42px; height: 42px; border: none; border-radius: 13px;
    background: #26304f; color: #ffd166; font-size: 17px; cursor: pointer; font-family: inherit;
  }

  .stage {
    position: relative; height: 380px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(180deg, #0f1526 0%, #1b2440 55%, #2a3357 100%);
    cursor: pointer;
  }
  .star { position: absolute; background: #fff; border-radius: 50%; opacity: .8; }
  @keyframes tw { 0%,100%{opacity:.25} 50%{opacity:.9} }
  .moon {
    position: absolute; top: 26px; right: 28px;
    width: 46px; height: 46px; border-radius: 50%;
    background: #ffeeb8; box-shadow: 0 0 26px rgba(255,238,184,.45);
  }
  .moon::after {
    content: ""; position: absolute; top: -4px; right: -8px;
    width: 40px; height: 40px; border-radius: 50%; background: #1b2440;
  }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background: #3a4470;
  }

  #tower { position: absolute; left: 0; right: 0; bottom: 26px; transition: transform .18s ease-out; }
  .blk { position: absolute; border-radius: 5px; }
  .cur { position: absolute; border-radius: 5px; }
  .chip { position: absolute; border-radius: 5px; animation: chipFall .9s cubic-bezier(.4,0,.8,1) forwards; }
  @keyframes chipFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(300px) rotate(var(--rot)); opacity: 0; }
  }
  .fall { position: absolute; border-radius: 5px; animation: bigFall 1.2s cubic-bezier(.4,0,.8,1) forwards; }
  @keyframes bigFall {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--fx), 420px) rotate(var(--rot)); opacity: 0; }
  }

  .pop { position: absolute; font-size: 17px; font-weight: bold; color: #ffd166; pointer-events: none; }
  .pop.go { animation: popUp .8s ease-out forwards; }
  @keyframes popUp {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    25%  { transform: translateY(-6px) scale(1.15); opacity: 1; }
    100% { transform: translateY(-34px) scale(1); opacity: 0; }
  }

  .overlay {
    position: absolute; inset: 0; z-index: 12;
    background: rgba(20,26,46,0.93);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 20px;
  }
  .overlay.off { display: none; }
  .overlay .t { font-size: 22px; color: #ffd166; }
  .overlay .d { font-size: 13px; color: #9aa2c4; line-height: 1.95; }
  .overlay .big { font-size: 46px; color: #ffd166; }

  button.btn {
    background: #ffd166; color: #1d2540; border: none;
    border-radius: 999px; box-shadow: 0 4px 0 #d9ac47;
    cursor: pointer; font-family: inherit; font-weight: bold;
    font-size: 17px; padding: 13px 34px 11px;
  }
  button.btn:active { transform: translateY(4px); box-shadow: 0 0 0 #d9ac47; }

  .legend { margin-top: 10px; font-size: 10.5px; color: #7b83a8; text-align: center; line-height: 1.9; }

  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 90; }
  .bit { position: absolute; bottom: -24px; animation: bitUp 1.5s cubic-bezier(.15,.6,.35,1) forwards; }
  @keyframes bitUp {
    0%   { transform: translate(0,0) rotate(0deg) scale(.6); opacity: 0; }
    18%  { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--tr)) scale(1.1); opacity: 0; }
  }
  .drop { position: absolute; top: -50px; animation: dropDown linear forwards; }
  @keyframes dropDown {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(112vh) rotate(460deg); opacity: .85; }
  }

  #glow { position: fixed; inset: 0; z-index: 93; pointer-events: none; opacity: 0;
          background: radial-gradient(circle at 50% 45%, rgba(255,231,160,.9) 0%, rgba(255,209,102,.55) 38%, rgba(255,209,102,0) 74%); }
  #glow.go { animation: glowOut .95s ease-out forwards; }
  @keyframes glowOut { 0%{opacity:0} 22%{opacity:1} 100%{opacity:0} }

  .sway { animation: swayA .45s ease-in-out 2; }
  @keyframes swayA { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-1.6deg)} 75%{transform:rotate(1.6deg)} }

  #toast {
    position: fixed; left: 50%; top: 14%; transform: translateX(-50%);
    z-index: 94; display: none;
    background: #ffd166; color: #1d2540; border-radius: 999px;
    padding: 11px 26px; font-size: 18px; font-weight: bold;
    box-shadow: 0 4px 0 #d9ac47, 0 12px 24px rgba(0,0,0,.5);
  }
  #toast.show { display: block; animation: toastIn 1.4s ease-out forwards; }
  @keyframes toastIn {
    0%   { transform: translateX(-50%) scale(.4); opacity: 0; }
    18%  { transform: translateX(-50%) scale(1.08); opacity: 1; }
    30%,80% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-26px) scale(.95); opacity: 0; }
  }
</style>
</head>
<body>

<div class="app">
  <h1>つみつみタワー</h1>
  <p class="sub">タップ か スペースキーで つむ</p>

  <div class="hud">
    <div><span>だんすう</span><b id="lv">0</b></div>
    <div><span>さいこう</span><b id="best">0</b></div>
    <div><span>ぴったり</span><b id="combo">0</b></div>
    <button id="mute" title="おと">🔊</button>
  </div>

  <div class="stage" id="stage">
    <div class="moon"></div>
    <div class="ground"></div>
    <div id="tower"></div>
    <div id="pops"></div>

    <div class="overlay" id="ov">
      <div class="t" id="ovT">つみつみタワー</div>
      <div class="d" id="ovD">よこに うごく ブロックを<br>タップで つみあげよう。<br>ずれた ぶんは けずれて おちるよ</div>
      <button class="btn" id="btn">はじめる</button>
    </div>
  </div>

  <p class="legend">
    ぴったり つめたら はばが すこし もどる<br>
    のっからなかったら タワーは くずれる
  </p>
</div>

<div id="fx"></div>
<div id="glow"></div>
<div id="toast"></div>

<script>
/* ===== おと(ファイルなし・波形を合成) ===== */
const Snd = (function () {
  let ctx = null, on = true, bgmTimer = null, step = 0;

  function init() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, dur, type, vol, when) {
    if (!ctx || !on) return;
    const t = when || ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol) {
    if (!ctx || !on) return;
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    src.connect(g); g.connect(ctx.destination);
    src.start();
  }

  const SCALE = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3];
  const BASS  = [65.4, 87.3, 98.0, 82.4];

  function startBgm() {
    stopBgm();
    if (!ctx) return;
    step = 0;
    bgmTimer = setInterval(() => {
      if (!on) return;
      const t = ctx.currentTime;
      if (step % 4 === 0) tone(BASS[(step / 4) % 4], 0.42, 'triangle', 0.055, t);
      if (step % 2 === 0) tone(SCALE[(step / 2) % 8], 0.18, 'sine', 0.032, t);
      step++;
    }, 240);
  }
  function stopBgm() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

  return {
    init: init,
    toggle: function () { on = !on; if (!on) stopBgm(); else startBgm(); return on; },
    isOn: function () { return on; },
    bgm: startBgm,
    stopBgm: stopBgm,
    place: function (combo) { tone(330 + Math.min(combo, 8) * 42, 0.13, 'square', 0.07); },
    perfect: function (combo) {
      const b = 523 + Math.min(combo, 8) * 55;
      tone(b, 0.1, 'square', 0.07);
      tone(b * 1.5, 0.16, 'sine', 0.05, ctx ? ctx.currentTime + 0.06 : 0);
    },
    trim: function () { noise(0.16, 0.09); },
    collapse: function () {
      noise(0.55, 0.16);
      if (!ctx) return;
      const t = ctx.currentTime;
      [220, 165, 130, 98].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.06, t + i * 0.09));
    },
    fanfare: function () {
      if (!ctx) return;
      const t = ctx.currentTime;
      [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'square', 0.06, t + i * 0.1));
    }
  };
})();

/* ===== 演出 ===== */
const fx = document.getElementById('fx');
const glow = document.getElementById('glow');
const toast = document.getElementById('toast');
const app = document.querySelector('.app');

function bits(n) {
  const set = ['🧱','⭐️','✨','🔩'];
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div');
    b.className = 'bit';
    b.textContent = set[Math.floor(Math.random() * set.length)];
    const L = i % 2 === 0, dir = L ? 1 : -1;
    b.style.left = L ? '8%' : 'auto';
    b.style.right = L ? 'auto' : '8%';
    b.style.fontSize = (14 + Math.random() * 18) + 'px';
    b.style.setProperty('--tx', (dir * (70 + Math.random() * 240)) + 'px');
    b.style.setProperty('--ty', (-(230 + Math.random() * 300)) + 'px');
    b.style.setProperty('--tr', (Math.random() * 460 - 230) + 'deg');
    b.style.animationDelay = (Math.random() * 0.28) + 's';
    fx.appendChild(b);
    setTimeout(() => b.remove(), 2100);
  }
}
function rain(n) {
  const set = ['⭐️','✨','🧱'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.textContent = set[Math.floor(Math.random() * set.length)];
    d.style.left = (Math.random() * 100) + '%';
    d.style.fontSize = (16 + Math.random() * 20) + 'px';
    d.style.animationDelay = (Math.random() * 0.8) + 's';
    d.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    fx.appendChild(d);
    setTimeout(() => d.remove(), 5000);
  }
}
function sway(el) {
  el.classList.remove('sway'); void el.offsetWidth; el.classList.add('sway');
  setTimeout(() => el.classList.remove('sway'), 1000);
}
function miniCelebrate(text) {
  bits(20); rain(26); sway(app);
  toast.textContent = text;
  toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1400);
}
function bigCelebrate(text) {
  glow.classList.remove('go'); void glow.offsetWidth; glow.classList.add('go');
  bits(38); rain(62); sway(app);
  Snd.fanfare();
  toast.textContent = text;
  toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1700);
}

/* ===== ゲーム ===== */
const BH = 21, START_W = 168, PERFECT = 4;
const MINI_LV = 8, BIG_LV = 18;

const stage = document.getElementById('stage');
const tower = document.getElementById('tower');
const pops  = document.getElementById('pops');
const ov    = document.getElementById('ov');
const btn   = document.getElementById('btn');

let W = 360, running = false, blocks = [], cur = null, raf = null, last = 0;
let level = 0, combo = 0, best = 0, miniDone = false, bigDone = false;

function measure() { W = stage.clientWidth; }
measure();
window.addEventListener('resize', measure);

function hue(i) { return 'hsl(' + ((i * 13 + 28) % 360) + ' 62% 62%)'; }

function addBlockEl(b, i) {
  const d = document.createElement('div');
  d.className = 'blk';
  d.style.cssText = 'left:' + b.x + 'px;bottom:' + (i * BH) + 'px;width:' + b.w + 'px;height:' + (BH - 2) + 'px;background:' + hue(i) + ';box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)';
  tower.appendChild(d);
  b.el = d;
}

function newCur() {
  const prev = blocks[blocks.length - 1];
  const d = document.createElement('div');
  d.className = 'cur';
  const y = blocks.length * BH;
  d.style.cssText = 'left:0px;bottom:' + y + 'px;width:' + prev.w + 'px;height:' + (BH - 2) + 'px;background:' + hue(blocks.length) + ';box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)';
  tower.appendChild(d);
  cur = { el: d, x: 0, w: prev.w, dir: 1, sp: 100 + Math.min(360, blocks.length * 9) };
  if (Math.random() < 0.5) { cur.x = W - cur.w; cur.dir = -1; }
}

function addPop(x, y, txt) {
  const p = document.createElement('div');
  p.className = 'pop';
  p.textContent = txt;
  p.style.left = (x - 16) + 'px';
  p.style.bottom = (y + 26) + 'px';
  pops.appendChild(p);
  void p.offsetWidth; p.classList.add('go');
  setTimeout(() => p.remove(), 850);
}

function chip(x, w, y, color, dir) {
  const c = document.createElement('div');
  c.className = 'chip';
  c.style.cssText = 'left:' + x + 'px;bottom:' + y + 'px;width:' + w + 'px;height:' + (BH - 2) + 'px;background:' + color + ';--rot:' + (dir * 90) + 'deg';
  tower.appendChild(c);
  setTimeout(() => c.remove(), 950);
}

function drop() {
  if (!running || !cur) return;
  const prev = blocks[blocks.length - 1];
  const s = Math.max(cur.x, prev.x);
  const e = Math.min(cur.x + cur.w, prev.x + prev.w);
  const ow = e - s;
  const y = blocks.length * BH;

  if (ow <= 0) { collapse(); return; }

  const off = Math.abs(cur.x - prev.x);
  let nx = s, nw = ow;

  if (off <= PERFECT) {
    nx = prev.x;
    nw = Math.min(START_W, prev.w + 5);
    combo++;
    Snd.perfect(combo);
    addPop(nx + nw / 2, y, 'ぴったり！');
  } else {
    combo = 0;
    Snd.place(0);
    Snd.trim();
    if (cur.x < s) chip(cur.x, s - cur.x, y, hue(blocks.length), -1);
    if (cur.x + cur.w > e) chip(e, (cur.x + cur.w) - e, y, hue(blocks.length), 1);
  }

  cur.el.remove();
  const nb = { x: nx, w: nw };
  addBlockEl(nb, blocks.length);
  blocks.push(nb);

  level = blocks.length - 1;
  best = Math.max(best, level);
  document.getElementById('lv').textContent    = level;
  document.getElementById('best').textContent  = best;
  document.getElementById('combo').textContent = combo;

  const visible = 9;
  tower.style.transform = 'translateY(' + Math.max(0, (blocks.length - visible) * BH) + 'px)';

  if (!miniDone && level >= MINI_LV) { miniDone = true; miniCelebrate(MINI_LV + 'だん とうたつ！'); }
  if (!bigDone  && level >= BIG_LV)  { bigDone  = true; bigCelebrate(BIG_LV + 'だん！ すごい'); }

  newCur();
}

function collapse() {
  running = false;
  cancelAnimationFrame(raf);
  Snd.collapse();
  Snd.stopBgm();
  if (cur) { cur.el.remove(); cur = null; }

  blocks.forEach((b, i) => {
    if (!b.el) return;
    const f = document.createElement('div');
    f.className = 'fall';
    f.style.cssText = 'left:' + b.x + 'px;bottom:' + (i * BH) + 'px;width:' + b.w + 'px;height:' + (BH - 2) + 'px;background:' + hue(i) + ';--fx:' + ((Math.random() * 2 - 1) * 130).toFixed(0) + 'px;--rot:' + ((Math.random() * 2 - 1) * 300).toFixed(0) + 'deg';
    tower.appendChild(f);
    b.el.remove();
  });

  stage.style.animation = 'swayA .4s';
  setTimeout(() => { stage.style.animation = ''; }, 420);

  setTimeout(() => {
    document.getElementById('ovT').textContent = 'くずれた…';
    document.getElementById('ovD').innerHTML =
      '<div style="font-size:44px;color:#ffd166;margin:4px 0">' + level + 'だん</div>' +
      (level >= 18 ? 'とんでもない たかさ！' :
       level >= 12 ? 'かなり つめたね' :
       level >= 6  ? 'いい ちょうし' : 'もういちど やってみる?');
    btn.textContent = 'もう一度';
    ov.classList.remove('off');
  }, 700);
}

function loop(t) {
  if (!running) return;
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (cur) {
    cur.x += cur.dir * cur.sp * dt;
    if (cur.x <= 0) { cur.x = 0; cur.dir = 1; }
    if (cur.x + cur.w >= W) { cur.x = W - cur.w; cur.dir = -1; }
    cur.el.style.left = cur.x + 'px';
  }
  raf = requestAnimationFrame(loop);
}

function start() {
  measure();
  Snd.init(); Snd.bgm();
  tower.innerHTML = ''; pops.innerHTML = '';
  tower.style.transform = 'translateY(0)';
  blocks = []; level = 0; combo = 0; miniDone = false; bigDone = false;
  document.getElementById('lv').textContent = 0;
  document.getElementById('combo').textContent = 0;

  const base = { x: (W - START_W) / 2, w: START_W };
  addBlockEl(base, 0);
  blocks.push(base);

  ov.classList.add('off');
  running = true;
  newCur();
  last = performance.now();
  raf = requestAnimationFrame(loop);
}

btn.addEventListener('click', e => { e.stopPropagation(); start(); });
stage.addEventListener('pointerdown', () => { if (running) drop(); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); running ? drop() : start(); }
});
document.getElementById('mute').addEventListener('click', e => {
  e.stopPropagation();
  Snd.init();
  document.getElementById('mute').textContent = Snd.toggle() ? '🔊' : '🔇';
});

/* 星 */
for (let i = 0; i < 26; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = 1 + Math.random() * 2.2;
  s.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 62) + '%;animation:tw ' + (2 + Math.random() * 3).toFixed(1) + 's ease-in-out infinite;animation-delay:' + (-Math.random() * 4).toFixed(1) + 's';
  stage.insertBefore(s, stage.firstChild);
}
</script>
</body>
</html>
