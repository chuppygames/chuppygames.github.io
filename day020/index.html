<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>よぞらの スライドパズル｜Chuppy Games Day 020</title>
<style>
  :root{
    --base:#150c30;
    --base2:#0c0722;
    --deep:#07030f;
    --ink:#f4efff;
    --dim:rgba(244,239,255,.55);
    --line:rgba(200,190,255,.18);
    --accent:#ffd76a;
    --accent2:#ffe9a8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    background:var(--deep); color:var(--ink);
    padding:22px 16px; overflow:hidden; position:relative;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 8% 12%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 22% 30%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.8px 1.8px at 38% 8%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.2px 1.2px at 61% 22%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 78% 14%, rgba(255,215,106,.7), transparent),
      radial-gradient(1.1px 1.1px at 90% 34%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.4px 1.4px at 12% 62%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.1px 1.1px at 32% 78%, rgba(255,215,106,.55), transparent),
      radial-gradient(1.6px 1.6px at 55% 68%, rgba(255,255,255,.65), transparent),
      radial-gradient(1.2px 1.2px at 70% 86%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.4px 1.4px at 92% 70%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.1px 1.1px at 5% 90%, rgba(255,255,255,.45), transparent);
    background-repeat:no-repeat;
  }
  .app{ position:relative; z-index:2; width:100%; max-width:400px; text-align:center; }
  h1{ font-size:20px; letter-spacing:.04em; font-weight:800; color:var(--ink); text-shadow:0 0 18px rgba(255,215,106,.45); margin-bottom:4px; }
  .sub{ font-size:11.5px; color:var(--dim); margin-bottom:16px; letter-spacing:.02em; }

  .hud{ display:flex; justify-content:center; gap:8px; margin-bottom:14px; }
  .pill{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px; letter-spacing:.06em; color:var(--ink);
    background:rgba(244,239,255,.07); border:1px solid var(--line); border-radius:999px; padding:5px 14px; }
  .pill b{ color:var(--accent); font-weight:700; margin-left:4px; }

  .boardWrap{ position:relative; width:min(82vw,320px); margin:0 auto; }
  .board{
    position:relative; width:100%; aspect-ratio:1;
    background:var(--base2); border-radius:16px; border:1.5px solid var(--line);
    box-shadow:0 16px 44px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.03);
    padding:6px;
  }
  .slot{ position:absolute; border-radius:9px; background:rgba(255,255,255,.025); border:1.5px dashed rgba(255,255,255,.1); }
  .tile{
    position:absolute; border-radius:9px; background-size:300% 300%;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
    transition:left .16s cubic-bezier(.2,.8,.3,1), top .16s cubic-bezier(.2,.8,.3,1), box-shadow .25s, filter .15s;
    cursor:pointer;
  }
  .tile.correct{ box-shadow:0 0 0 2px var(--accent), 0 4px 16px rgba(255,215,106,.55); }
  .tile:active{ filter:brightness(1.1); }
  .board.locked .tile{ cursor:default; }

  .controls{ display:flex; justify-content:center; gap:10px; margin-top:16px; }
  button.btn{
    font-family:inherit; font-weight:700; font-size:12.5px; letter-spacing:.04em;
    background:rgba(244,239,255,.08); color:var(--ink); border:1.5px solid var(--line);
    border-radius:999px; padding:9px 18px; cursor:pointer; transition:transform .08s, background .15s;
  }
  button.btn:active{ transform:scale(.94); background:rgba(244,239,255,.17); }
  button.btn.snd{ padding:9px 13px; font-size:15px; line-height:1; }

  /* ===== 演出エンジン ===== */
  #fx{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:90; }
  .spk{ position:absolute; top:0; left:0; animation:spkgo 1.1s cubic-bezier(.12,.65,.35,1) forwards; }
  @keyframes spkgo{
    0%{ transform:translate(0,0) rotate(0deg) scale(.6); opacity:1; }
    65%{ opacity:1; }
    100%{ transform:translate(var(--tx),var(--ty)) rotate(400deg) scale(1); opacity:0; }
  }
  .drf{ position:absolute; top:-24px; animation:drffall linear forwards; }
  @keyframes drffall{ to{ transform:translateY(112vh) rotate(300deg); } }

  #flash{ position:fixed; inset:0; z-index:93; background:#fff6e0; opacity:0; pointer-events:none; }
  #flash.go{ animation:flashOut .5s ease-out forwards; }
  @keyframes flashOut{ 0%{ opacity:.65; } 100%{ opacity:0; } }

  .wiggle{ animation:wig .4s ease-in-out 2; }
  @keyframes wig{ 0%,100%{ transform:rotate(0deg); } 25%{ transform:rotate(-1.6deg); } 75%{ transform:rotate(1.6deg); } }

  #toast{
    position:fixed; left:50%; top:16%; transform:translateX(-50%);
    z-index:94; display:none;
    background:var(--accent); color:#2b1d06;
    border-radius:999px; padding:8px 20px; font-size:14px; font-weight:800;
    box-shadow:0 8px 22px rgba(255,215,106,.4);
  }
  #toast.show{ display:block; animation:toastIn 1.1s ease-out forwards; }
  @keyframes toastIn{
    0%{ transform:translateX(-50%) scale(.4); opacity:0; }
    18%{ transform:translateX(-50%) scale(1.08); opacity:1; }
    30%,78%{ transform:translateX(-50%) scale(1); opacity:1; }
    100%{ transform:translateX(-50%) translateY(-20px) scale(.92); opacity:0; }
  }

  #banner{ position:fixed; inset:0; z-index:95; display:none; align-items:center; justify-content:center; padding:20px; }
  #banner.show{ display:flex; }
  .bnr{
    background:var(--base); border:2px solid var(--accent); border-radius:22px;
    padding:26px 30px 22px; text-align:center; max-width:320px;
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(255,215,106,.25);
    animation:burstIn .5s cubic-bezier(.2,1.8,.4,1);
  }
  @keyframes burstIn{ 0%{ transform:scale(.35) rotate(-6deg); opacity:0; } 100%{ transform:scale(1) rotate(0deg); opacity:1; } }
  .bnr .big{ font-size:26px; font-weight:800; color:var(--accent); text-shadow:0 0 18px rgba(255,215,106,.6); letter-spacing:.04em; }
  .bnr .small{ font-size:13px; font-weight:700; margin-top:8px; color:var(--ink); opacity:.85; }
  .bnr button{ margin-top:16px; }

  @media(prefers-reduced-motion:reduce){
    .tile{ transition:left .01s, top .01s; }
  }
</style>
</head>
<body>

<div class="app">
  <h1>よぞらの スライドパズル</h1>
  <p class="sub">あいてる ますの となりを タップ</p>
  <div class="hud">
    <span class="pill">てすう<b id="moveCount">0</b></span>
    <span class="pill">じかん<b id="timeDisp">0:00</b></span>
  </div>
  <div class="boardWrap">
    <div class="board" id="board"></div>
  </div>
  <div class="controls">
    <button class="btn" id="btnReset">さいしょから</button>
    <button class="btn snd" id="btnSound">🔇</button>
  </div>
</div>

<div id="fx"></div>
<div id="flash"></div>
<div id="toast"></div>
<div id="banner">
  <div class="bnr">
    <div class="big" id="bnrBig">そろった！</div>
    <div class="small" id="bnrSmall"></div>
    <button class="btn" id="bnrAgain">もういちど あそぶ</button>
  </div>
</div>

<script>
/* ================= 演出エンジン ================= */
const fx = document.getElementById('fx');
const flash = document.getElementById('flash');
const toast = document.getElementById('toast');
const banner = document.getElementById('banner');
const app = document.querySelector('.app');
const SPARK_PARTS = ['⭐️','✨','🌟','💫'];

function sparkBurst(n, originXpct, originYpct){
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'spk';
    s.textContent = SPARK_PARTS[Math.floor(Math.random()*SPARK_PARTS.length)];
    s.style.left = originXpct + '%';
    s.style.top = originYpct + '%';
    s.style.fontSize = (12 + Math.random()*16) + 'px';
    const ang = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*160;
    s.style.setProperty('--tx', (Math.cos(ang)*dist) + 'px');
    s.style.setProperty('--ty', (Math.sin(ang)*dist - 30) + 'px');
    s.style.animationDelay = (Math.random()*0.2) + 's';
    fx.appendChild(s);
    setTimeout(()=>s.remove(), 1500);
  }
}
function driftRain(n){
  for(let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className = 'drf';
    d.textContent = SPARK_PARTS[Math.floor(Math.random()*SPARK_PARTS.length)];
    d.style.left = (Math.random()*100) + '%';
    d.style.fontSize = (14 + Math.random()*18) + 'px';
    d.style.animationDelay = (Math.random()*0.6) + 's';
    d.style.animationDuration = (1.6 + Math.random()*1.1) + 's';
    fx.appendChild(d);
    setTimeout(()=>d.remove(), 3600);
  }
}
function doFlash(){ flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }
function shake(el){ el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); setTimeout(()=>el.classList.remove('wiggle'), 900); }
function miniCelebrate(text, xpct, ypct){
  sparkBurst(20, xpct, ypct);
  shake(app);
  toast.textContent = text;
  toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1200);
}
function grandCelebrate(bigText, smallText){
  for(let i=0;i<4;i++){
    setTimeout(()=>{
      driftRain(14);
      sparkBurst(10, 20+Math.random()*60, 30+Math.random()*40);
      if(i%2===0) doFlash();
      shake(app);
    }, i*500);
  }
  document.getElementById('bnrBig').textContent = bigText;
  document.getElementById('bnrSmall').textContent = smallText || '';
  banner.classList.add('show');
}
function hideBanner(){ banner.classList.remove('show'); }

/* ================= 音 (Web Audio) ================= */
let audioCtx=null, sfxGain=null, bgmGain=null, bgmTimer=null, soundOn=false;
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    sfxGain = audioCtx.createGain(); sfxGain.gain.value = soundOn ? 0.7 : 0; sfxGain.connect(audioCtx.destination);
    bgmGain = audioCtx.createGain(); bgmGain.gain.value = soundOn ? 0.26 : 0; bgmGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type, dur, dest, delay, peak){
  ensureAudio();
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  osc.type = type; osc.frequency.value = freq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g); g.connect(dest);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function playMoveSfx(){ if(!soundOn) return; playTone(300,'triangle',0.08,sfxGain,0,0.35); }
function playCorrectSfx(){ if(!soundOn) return; playTone(784,'sine',0.12,sfxGain,0,0.45); playTone(1046,'sine',0.14,sfxGain,0.07,0.4); }
function playWinSfx(){
  if(!soundOn) return;
  const notes=[523.25,659.25,783.99,1046.5];
  notes.forEach((f,i)=>playTone(f,'triangle',0.32,sfxGain,i*0.12,0.55));
  for(let i=0;i<5;i++){ playTone(1400+Math.random()*700,'sine',0.18,sfxGain,0.5+i*0.18,0.22); }
}
const BGM_NOTES = [523.25,587.33,659.25,783.99,880.00,1046.50];
function bgmTick(){
  if(!soundOn) return;
  const f = BGM_NOTES[Math.floor(Math.random()*BGM_NOTES.length)];
  playTone(f, 'sine', 1.1, bgmGain, 0, 0.3);
  bgmTimer = setTimeout(bgmTick, 900 + Math.random()*700);
}
function startBgm(){ if(bgmTimer) return; ensureAudio(); bgmTick(); }
function stopBgm(){ if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer=null; } }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ stopBgm(); if(audioCtx) audioCtx.suspend(); } else if(soundOn){ ensureAudio(); startBgm(); } });
window.addEventListener('pagehide', ()=>{ stopBgm(); if(audioCtx) audioCtx.suspend(); });
window.addEventListener('blur', ()=>{ stopBgm(); if(audioCtx) audioCtx.suspend(); });

document.getElementById('btnSound').addEventListener('click', ()=>{
  ensureAudio();
  soundOn = !soundOn;
  sfxGain.gain.value = soundOn ? 0.7 : 0;
  bgmGain.gain.value = soundOn ? 0.26 : 0;
  document.getElementById('btnSound').textContent = soundOn ? '🔊' : '🔇';
  if(soundOn) startBgm(); else stopBgm();
});

/* ================= よぞら絵(1枚をタイルに割る) ================= */
const SKY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2a1758"/>
<stop offset="0.55" stop-color="#170d3a"/>
<stop offset="1" stop-color="#0a0620"/>
</linearGradient>
<radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#ffe9a8" stop-opacity="0.5"/>
<stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
</radialGradient>
<mask id="moonMask">
<rect width="300" height="300" fill="black"/>
<circle cx="205" cy="95" r="40" fill="white"/>
<circle cx="221" cy="82" r="35" fill="black"/>
</mask>
</defs>
<rect width="300" height="300" fill="url(#sky)"/>
<circle cx="205" cy="95" r="66" fill="url(#moonGlow)"/>
<g fill="#ffffff">
<circle cx="20" cy="25" r="1.5" opacity="0.85"/>
<circle cx="55" cy="15" r="1" opacity="0.5"/>
<circle cx="80" cy="60" r="1.2" opacity="0.6"/>
<circle cx="130" cy="20" r="1" opacity="0.5"/>
<circle cx="165" cy="55" r="1.4" opacity="0.7"/>
<circle cx="112" cy="80" r="0.9" opacity="0.4"/>
<circle cx="270" cy="25" r="1" opacity="0.55"/>
<circle cx="250" cy="16" r="0.8" opacity="0.4"/>
<circle cx="25" cy="130" r="1.3" opacity="0.6"/>
<circle cx="60" cy="170" r="1" opacity="0.5"/>
<circle cx="85" cy="112" r="1.1" opacity="0.55"/>
<circle cx="170" cy="120" r="1" opacity="0.5"/>
<circle cx="230" cy="140" r="1.1" opacity="0.55"/>
<circle cx="272" cy="175" r="1.3" opacity="0.65"/>
<circle cx="252" cy="112" r="0.9" opacity="0.45"/>
<circle cx="10" cy="205" r="1.1" opacity="0.5"/>
<circle cx="90" cy="285" r="1" opacity="0.45"/>
<circle cx="180" cy="270" r="1.2" opacity="0.55"/>
<circle cx="185" cy="205" r="0.9" opacity="0.4"/>
</g>
<g fill="#ffd76a">
<circle cx="140" cy="150" r="1.3" opacity="0.7"/>
<circle cx="115" cy="182" r="1.1" opacity="0.6"/>
<circle cx="32" cy="78" r="1" opacity="0.6"/>
</g>
<g stroke="#ffd76a" stroke-width="0.9" opacity="0.4" fill="none">
<path d="M30 260 L70 230 L115 255 L160 225"/>
</g>
<g fill="#ffd76a">
<circle cx="30" cy="260" r="2.1"/>
<circle cx="70" cy="230" r="2.1"/>
<circle cx="115" cy="255" r="2.1"/>
<circle cx="160" cy="225" r="2.1"/>
</g>
<path d="M15 55 L78 82" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
<circle cx="15" cy="55" r="1.8" fill="#ffffff" opacity="0.8"/>
<circle cx="205" cy="95" r="40" fill="#ffeec2" mask="url(#moonMask)"/>
</svg>`;
const SKY_URL = 'data:image/svg+xml,' + encodeURIComponent(SKY_SVG);

/* ================= パズル本体 ================= */
const boardEl = document.getElementById('board');
const moveCountEl = document.getElementById('moveCount');
const timeDispEl = document.getElementById('timeDisp');

let board = [];     // slot(0-8) -> tileId(0-8, 8=blank)
let tileSlot = [];   // tileId(0-8) -> slot(0-8)
let tileEls = [];    // tileId(0-7) -> DOM element
let cell = 0;
let moveCount = 0;
let started = false;
let locked = false;
let startTime = 0;
let timerHandle = null;

function neighborsOf(slot){
  const r = Math.floor(slot/3), c = slot%3;
  const res = [];
  if(r>0) res.push(slot-3);
  if(r<2) res.push(slot+3);
  if(c>0) res.push(slot-1);
  if(c<2) res.push(slot+1);
  return res;
}
function isSolved(){
  for(let t=0;t<8;t++){ if(tileSlot[t]!==t) return false; }
  return true;
}
function buildTiles(){
  boardEl.innerHTML = '';
  tileEls = [];
  const slotEl = document.createElement('div');
  slotEl.className = 'slot';
  slotEl.id = 'blankSlot';
  boardEl.appendChild(slotEl);
  for(let t=0;t<8;t++){
    const r = Math.floor(t/3), c = t%3;
    const el = document.createElement('div');
    el.className = 'tile';
    el.style.backgroundImage = `url("${SKY_URL}")`;
    el.style.backgroundPosition = (c*50) + '% ' + (r*50) + '%';
    el.addEventListener('pointerdown', ()=>attemptMove(t));
    boardEl.appendChild(el);
    tileEls.push(el);
  }
}
function measureCell(){
  const inner = boardEl.clientWidth - 12; // padding 6px x2
  cell = inner/3;
}
function renderPositions(animate){
  measureCell();
  for(let t=0;t<8;t++){
    const slot = tileSlot[t];
    const r = Math.floor(slot/3), c = slot%3;
    const el = tileEls[t];
    if(!animate) el.style.transition = 'none';
    el.style.width = cell + 'px';
    el.style.height = cell + 'px';
    el.style.left = (c*cell) + 'px';
    el.style.top = (r*cell) + 'px';
    if(!animate){ void el.offsetWidth; el.style.transition = ''; }
    el.classList.toggle('correct', slot === t);
  }
  const bslot = tileSlot[8];
  const br = Math.floor(bslot/3), bc = bslot%3;
  const bEl = document.getElementById('blankSlot');
  bEl.style.width = cell + 'px';
  bEl.style.height = cell + 'px';
  bEl.style.left = (bc*cell) + 'px';
  bEl.style.top = (br*cell) + 'px';
}
function attemptMove(tileId){
  if(locked) return;
  const slot = tileSlot[tileId];
  const blankSlot = tileSlot[8];
  if(!neighborsOf(slot).includes(blankSlot)) return;
  board[blankSlot] = tileId; board[slot] = 8;
  tileSlot[tileId] = blankSlot; tileSlot[8] = slot;
  moveCount++;
  moveCountEl.textContent = moveCount;
  renderPositions(true);
  playMoveSfx();
  if(!started){ started = true; startTimer(); }
  if(blankSlot === tileId){
    const cx = ((blankSlot%3)+0.5)/3*100;
    const cy = (Math.floor(blankSlot/3)+0.5)/3*100;
    sparkBurst(16, cx, cy);
    playCorrectSfx();
  }
  if(isSolved()) onWin();
}
function startTimer(){
  startTime = Date.now();
  timerHandle = setInterval(()=>{
    const el = Math.floor((Date.now()-startTime)/1000);
    const m = Math.floor(el/60), s = el%60;
    timeDispEl.textContent = m + ':' + (s<10?'0':'') + s;
  }, 250);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function onWin(){
  stopTimer();
  locked = true;
  boardEl.classList.add('locked');
  const finalMoves = moveCount;
  const finalSec = Math.floor((Date.now()-startTime)/1000);
  grandCelebrate('そろった！', finalMoves + 'て ・ ' + finalSec + 'びょう');
}
function shuffle(){
  board = [0,1,2,3,4,5,6,7,8];
  tileSlot = [0,1,2,3,4,5,6,7,8];
  let blank = 8, forbidden = -1;
  const steps = 80 + Math.floor(Math.random()*40);
  for(let i=0;i<steps;i++){
    const cands = neighborsOf(blank).filter(s=>s!==forbidden);
    const use = cands.length ? cands : neighborsOf(blank);
    const pick = use[Math.floor(Math.random()*use.length)];
    const t = board[pick];
    board[blank] = t; board[pick] = 8;
    tileSlot[t] = blank; tileSlot[8] = pick;
    forbidden = blank;
    blank = pick;
  }
  if(isSolved()){
    const opts = neighborsOf(blank);
    const pick = opts[Math.floor(Math.random()*opts.length)];
    const t = board[pick];
    board[blank] = t; board[pick] = 8;
    tileSlot[t] = blank; tileSlot[8] = pick;
    blank = pick;
  }
  moveCount = 0; started = false; locked = false;
  moveCountEl.textContent = 0;
  timeDispEl.textContent = '0:00';
  boardEl.classList.remove('locked');
  hideBanner();
  stopTimer();
  renderPositions(false);
}

document.getElementById('btnReset').addEventListener('click', shuffle);
document.getElementById('bnrAgain').addEventListener('click', shuffle);
window.addEventListener('resize', ()=>renderPositions(false));

buildTiles();
shuffle();
</script>
</body>
</html>
