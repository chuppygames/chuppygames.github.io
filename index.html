<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuppy Games｜毎日ひとつ、AIで小さなゲームを作る</title>
<meta name="description" content="毎日ひとつ、AIで小さなゲームを作っています。ブラウザですぐ遊べます。">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(150deg, #ffe9a8 0%, #ffd0dc 45%, #bfe6ff 100%);
    background-attachment: fixed;
    color: #3d3652;
    padding: 40px 20px 60px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: 34px; color: #ff7aa8; letter-spacing: 1px; margin-bottom: 4px; }
  .romaji { font-size: 11px; letter-spacing: 3px; opacity: 0.4; margin-bottom: 14px; }
  .tag { font-size: 16px; line-height: 1.9; }
  .tag b { color: #ff7aa8; }
  .en { font-size: 11px; opacity: 0.45; margin-top: 8px; letter-spacing: 0.5px; }

  .counter {
    display: inline-block;
    margin-top: 18px;
    background: #fffdf8;
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 999px;
    padding: 8px 24px;
    font-size: 13px;
    box-shadow: 0 8px 20px rgba(150,110,140,0.15);
  }
  .counter b { color: #ff7aa8; font-size: 17px; }

  .grid { display: grid; gap: 14px; }
  a.card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fffdf8;
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 18px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 10px 24px rgba(150,110,140,0.16);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  a.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 32px rgba(150,110,140,0.26);
  }
  .icon {
    font-size: 34px;
    width: 58px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    background: #fff5e6;
    border-radius: 14px;
    flex-shrink: 0;
  }
  .meta { flex: 1; min-width: 0; }
  .day { font-size: 11px; letter-spacing: 1.5px; color: #ff7aa8; font-weight: bold; }
  .title { font-size: 18px; font-weight: bold; margin: 2px 0 4px; }
  .learn { font-size: 12px; opacity: 0.6; line-height: 1.6; }
  .learn span { color: #f0a516; font-weight: bold; }
  .go { font-size: 20px; opacity: 0.3; flex-shrink: 0; }

  footer { text-align: center; margin-top: 36px; font-size: 12px; opacity: 0.6; line-height: 2; }
  footer a { color: #ff7aa8; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>チュッピーゲームズ</h1>
    <p class="romaji">CHUPPY GAMES</p>
    <p class="tag">毎日ひとつ、<b>AIで小さなゲーム</b>を作っています。<br>ブラウザでそのまま遊べます。</p>
    <p class="en">One small game every day, built with AI.</p>
    <div class="counter">DAY <b>002</b></div>
  </header>

  <!-- 新しいゲームは、このすぐ下にコピーして追加していく -->
  <div class="grid">

    <a class="card" href="day002/">
      <div class="icon">🥚</div>
      <div class="meta">
        <div class="day">DAY 002</div>
        <div class="title">たまごわり</div>
        <div class="learn"><span>学んだこと</span>　レアな当たりの確率は、勘で決めず実際に何万回も試して決める</div>
      </div>
      <div class="go">→</div>
    </a>

    <a class="card" href="day001/">
      <div class="icon">✊</div>
      <div class="meta">
        <div class="day">DAY 001</div>
        <div class="title">じゃんけん</div>
        <div class="learn"><span>学んだこと</span>　グー・チョキ・パーの勝敗を、たった1行の計算で判定する方法</div>
      </div>
      <div class="go">→</div>
    </a>

  </div>

  <footer>
    すべて AI で制作 ／ ソースコードは <a href="https://github.com/chuppygames">GitHub</a> で公開<br>
    <a href="https://instagram.com/chuppygames">@chuppygames</a>
  </footer>

</div>
</body>
</html>
