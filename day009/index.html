<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>うちあげ花火｜Chuppy Games Day 009</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

  :root {
    --deep: #0a0526;
    --mid: #180f42;
    --horizon: #2c1a58;
    --cream: #fff6e0;
    --gold: #ffcf4d;
    --gold-light: #ffe28a;
    --gold-dark: #c98a1a;
    --smoke: #9a94a8;
    --ink: #150c30;
  }

  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--deep);
    color: var(--cream);
    padding: 16px;
    overflow: hidden;
    position: relative;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(120px 90px at 78% 12%, rgba(255,242,200,0.35) 0%, rgba(255,242,200,0) 70%),
      radial-gradient(ellipse at 50% 115%, var(--horizon) 0%, var(--mid) 55%, var(--deep) 100%);
    z-index: -2;
  }
  #stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .star {
    position: absolute; border-radius: 50%;
    background: var(--cream);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }

  .app {
    position: relative; z-index: 2;
    width: 100%; max-width: 440px;
    background: linear-gradient(180deg, #140a38 0%, #0f0728 100%);
    border: 5px solid var(--gold-dark);
    border-radius: 26px;
    padding: 18px 18px 20px;
    box-shadow: 10px 10px 0 rgba(0,0,0,0.5), 0 0 30px rgba(255,207,77,0.08) inset;
  }

  h1 {
    font-size: 26px; text-align: center; letter-spacing: 2px;
    color: var(--gold);
    text-shadow: 0 3px 0 rgba(0,0,0,0.5), 0 0 14px rgba(255,207,77,0.5);
    margin-bottom: 2px;
  }
  .sub { text-align: center; font-size: 12px; opacity: 0.75; margin-bottom: 12px; font-weight: bold; color: var(--cream); }

  .hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px 10px;
  }
  .hearts { font-size: 18px; letter-spacing: 3px; }
  .heart { display: inline-block; filter: none; transition: filter .25s, opacity .25s; }
  .heart.lost { filter: grayscale(1) brightness(0.5); opacity: 0.4; }
  .stats { text-align: right; font-size: 12px; font-weight: bold; color: var(--gold-light); line-height: 1.5; }
  .stats b { color: var(--gold); font-size: 16px; }

  .stage {
    position: relative;
    height: 380px;
    border-radius: 18px;
    overflow: hidden;
    background:
      radial-gradient(160px 100px at 82% 10%, rgba(255,246,224,0.12) 0%, rgba(255,246,224,0) 70%),
      linear-gradient(180deg, #1a0f42 0%, #241454 55%, #3a2166 100%);
    border: 3px solid rgba(255,207,77,0.35);
    touch-action: manipulation;
    cursor: pointer;
  }
  .moon {
    position: absolute; top: 8%; right: 10%;
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fffaf0 0%, var(--gold-light) 55%, var(--gold) 100%);
    box-shadow: 0 0 26px rgba(255,230,150,0.55);
  }
  .skyline {
    position: absolute; left: 0; right: 0; bottom: 0; height: 68px;
    background: #0d0824;
    clip-path: polygon(0% 100%, 0% 55%, 8% 40%, 16% 58%, 24% 30%, 32% 55%, 40% 20%, 46% 50%, 54% 35%,
      62% 55%, 70% 25%, 78% 50%, 86% 38%, 94% 58%, 100% 42%, 100% 100%);
  }
  .lantern {
    position: absolute; bottom: 30px; width: 6px; height: 8px; border-radius: 2px;
    background: var(--gold); box-shadow: 0 0 8px 2px rgba(255,207,77,0.8);
    animation: lanternFlicker 1.8s ease-in-out infinite;
  }
  @keyframes lanternFlicker { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

  .targetRing {
    position: absolute; left: 50%; top: 42%; z-index: 5;
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%;
    border: 3px dashed rgba(255,255,255,0.9);
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
    animation: ringPulse 1.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes ringPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }

  .tama {
    position: absolute; left: 50%; top: 42%;
    width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6d8 0%, var(--gold-light) 40%, var(--gold) 70%, var(--gold-dark) 100%);
    box-shadow: 0 0 22px 6px rgba(255,207,77,0.55);
    will-change: transform;
  }
  .tama .fuse {
    position: absolute; left: 50%; top: -10px; width: 4px; height: 10px; margin-left: -2px;
    border-radius: 2px; background: var(--cream);
    animation: fuseSpark 0.5s ease-in-out infinite;
  }
  @keyframes fuseSpark { 0%,100% { opacity: 0.5; transform: scaleY(1); } 50% { opacity: 1; transform: scaleY(1.3); } }

  .tapGlow {
    position: absolute; left: 50%; top: 42%;
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; border: 3px solid var(--gold-light);
    opacity: 0; pointer-events: none; will-change: transform, opacity;
  }

  .tapHint {
    position: absolute; left: 0; right: 0; bottom: 78px; text-align: center;
    font-size: 13px; font-weight: bold; color: var(--cream);
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    animation: hintPulse 1.4s ease-in-out infinite;
    pointer-events: none;
    transition: opacity .4s;
  }
  @keyframes hintPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  .comboFloat {
    position: absolute; left: 50%; top: 20%; transform: translateX(-50%);
    font-size: 15px; font-weight: bold; color: var(--gold-light);
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  button.btn {
    background: var(--gold); color: var(--ink);
    border: 4px solid var(--gold-dark); border-radius: 16px;
    box-shadow: 0 6px 0 #8a5c0f;
    cursor: pointer; font-family: inherit; font-weight: bold; font-size: 16px;
    padding: 12px 20px;
    transition: transform 0.06s, box-shadow 0.06s;
  }
  button.btn:active { transform: translateY(6px); box-shadow: 0 0 0 #8a5c0f; }

  #muteBtn {
    position: absolute; top: 10px; right: 10px; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(20,10,40,0.55); border: 2px solid var(--gold-dark);
    color: var(--gold); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* ===== 演出エンジン ===== */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 90; }
  .spk { position: absolute; border-radius: 50%; will-change: transform, opacity; }

  #flash { position: fixed; inset: 0; z-index: 93; background: var(--gold-light); opacity: 0; pointer-events: none; }
  #flash.go { animation: flashOut 0.5s ease-out forwards; }
  @keyframes flashOut { 0% { opacity: 0.6; } 100% { opacity: 0; } }

  .wiggle { animation: wig 0.4s ease-in-out 2; }
  @keyframes wig {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(-2deg); }
    75% { transform: rotate(2deg); }
  }

  #toast {
    position: fixed; left: 50%; top: 16%; transform: translateX(-50%);
    z-index: 94; display: none;
    background: var(--gold); color: var(--ink);
    border: 4px solid var(--gold-dark); border-radius: 999px;
    padding: 8px 22px; font-size: 18px; font-weight: bold;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.4);
  }
  #toast.show { display: block; animation: toastIn 1.1s ease-out forwards; }
  @keyframes toastIn {
    0%   { transform: translateX(-50%) scale(0.4); opacity: 0; }
    18%  { transform: translateX(-50%) scale(1.1); opacity: 1; }
    30%,80% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-20px) scale(0.9); opacity: 0; }
  }

  #banner { position: fixed; inset: 0; z-index: 95; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #banner.show { display: flex; }
  .bnr {
    background: linear-gradient(180deg, #241454, #180f42);
    border: 6px solid var(--gold); border-radius: 22px;
    padding: 20px 30px; text-align: center;
    box-shadow: 12px 12px 0 rgba(0,0,0,0.5), 0 0 30px rgba(255,207,77,0.3);
    animation: burstIn 0.5s cubic-bezier(.2,1.8,.4,1);
  }
  @keyframes burstIn { 0%{transform:scale(0.3) rotate(-8deg); opacity:0} 100%{transform:scale(1) rotate(-2deg); opacity:1} }
  .bnr .big { font-size: 34px; font-weight: bold; color: var(--gold); text-shadow: 0 0 12px rgba(255,207,77,0.6); line-height: 1.2; }
  .bnr .small { font-size: 13px; font-weight: bold; margin-top: 6px; color: var(--cream); }

  #resultOverlay {
    position: fixed; inset: 0; z-index: 96; display: none;
    align-items: center; justify-content: center;
    background: rgba(6,3,20,0.86);
  }
  #resultOverlay.show { display: flex; }
  .resCard {
    width: 88%; max-width: 380px;
    background: linear-gradient(180deg, #241454, #150c30);
    border: 5px solid var(--gold); border-radius: 22px;
    padding: 26px 22px; text-align: center;
    box-shadow: 10px 10px 0 rgba(0,0,0,0.5);
  }
  .resCard .title { font-size: 30px; font-weight: bold; color: var(--gold); text-shadow: 0 0 14px rgba(255,207,77,0.5); margin-bottom: 12px; }
  .resCard .row { font-size: 15px; margin: 6px 0; color: var(--cream); font-weight: bold; }
  .resCard .row b { color: var(--gold-light); font-size: 20px; }
  .resCard .hint { font-size: 13px; margin: 14px 0 16px; color: var(--gold-light); opacity: 0.9; line-height: 1.5; }
</style>
</head>
<body>

<div id="stars"></div>

<div class="app" id="app">
  <button id="muteBtn">🔊</button>
  <h1>うちあげ花火</h1>
  <p class="sub">たまが 点線の わっかと 同じ大きさに なった しゅんかんに タップ！</p>

  <div class="hud">
    <div class="hearts" id="hearts"></div>
    <div class="stats">スコア <b id="scoreVal">0</b><br>コンボ <b id="comboVal">0</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="moon"></div>
    <div class="skyline" id="skyline"></div>
    <div class="tama" id="tama"><div class="fuse"></div></div>
    <div class="targetRing"></div>
    <div class="tapGlow" id="tapGlow"></div>
    <div class="tapHint" id="tapHint">わっかに 合わせて タップ！</div>
  </div>
</div>

<div id="fx"></div>
<div id="flash"></div>
<div id="toast"></div>
<div id="banner"><div class="bnr"><div class="big" id="bnrBig"></div><div class="small" id="bnrSmall"></div></div></div>

<div id="resultOverlay">
  <div class="resCard">
    <div class="title" id="resTitle">おわり！</div>
    <div class="row">スコア <b id="resScore">0</b></div>
    <div class="row">うちあげ成功 <b id="resSuccess">0</b> 回</div>
    <div class="row">さいだいコンボ <b id="resCombo">0</b></div>
    <div class="hint" id="resHint"></div>
    <button class="btn" id="retryBtn">もういちど あそぶ</button>
  </div>
</div>

<script>
/* ===== 星の生成(白だけでなく淡い色もまぜる) ===== */
(function(){
  const starsEl = document.getElementById('stars');
  const starColors = ['#fff6e0', '#fff6e0', '#fff6e0', '#bfe4ff', '#ffd7ec'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 46; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random() * 2.2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 70) + '%';
    s.style.background = starColors[Math.floor(Math.random() * starColors.length)];
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    frag.appendChild(s);
  }
  starsEl.appendChild(frag);
})();

/* ===== 提灯の生成(色をすこしずつ変える) ===== */
(function(){
  const skyline = document.getElementById('skyline');
  const positions = [10, 27, 45, 63, 80, 92];
  const lanternColors = ['#ffcf4d', '#ff8a6b', '#ffcf4d', '#ff6bcb', '#ffcf4d', '#7fd6ff'];
  positions.forEach((p, i) => {
    const l = document.createElement('div');
    l.className = 'lantern';
    l.style.left = p + '%';
    const c = lanternColors[i % lanternColors.length];
    l.style.background = c;
    l.style.boxShadow = '0 0 8px 2px ' + c;
    l.style.animationDelay = (i * 0.3) + 's';
    skyline.appendChild(l);
  });
})();

/* ===== 演出エンジン ===== */
const fx = document.getElementById('fx');
const flash = document.getElementById('flash');
const toast = document.getElementById('toast');
const banner = document.getElementById('banner');
const app = document.getElementById('app');
const GOLD_COLORS = ['#ffe28a', '#ffcf4d', '#ffb037', '#fff6e0', '#ffdf91'];

/* 花火の色くみ(1発ごとに1くみを選ぶ。中に2〜3色を混ぜて、単色よりきれいに見せる) */
const FIREWORK_PALETTES = [
  ['#ff5f7e', '#ffd93d', '#fff6e0'],   // 紅梅+金
  ['#4fd6ff', '#7b6cff', '#fff6e0'],   // 青紫
  ['#ff6bcb', '#ffb84d', '#fff6e0'],   // 桃+橙
  ['#4fe6a0', '#4fd6ff', '#fff6e0'],   // 翠+水
  ['#ffcf4d', '#ff8a3d', '#fff6e0'],   // 金+橙(定番)
  ['#c88bff', '#ff6bcb', '#fff6e0'],   // 藤+桃
];
function pickPalette() {
  return FIREWORK_PALETTES[Math.floor(Math.random() * FIREWORK_PALETTES.length)];
}

function spawnParticles(cx, cy, n, opts) {
  opts = opts || {};
  const colors = opts.colors || GOLD_COLORS;
  const minSize = opts.minSize || 6, maxSize = opts.maxSize || 13;
  const minR = opts.minR || 60, maxR = opts.maxR || 150;
  const dur = opts.dur || 900;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'spk';
    const size = minSize + Math.random() * (maxSize - minSize);
    const color = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.background = 'radial-gradient(circle at 35% 30%, #ffffff 0%, ' + color + ' 55%, ' + color + ' 100%)';
    el.style.boxShadow = '0 0 ' + (size * 1.1) + 'px ' + color;
    fx.appendChild(el);

    const angle = Math.random() * Math.PI * 2;
    const radius = minR + Math.random() * (maxR - minR);
    const tx = Math.cos(angle) * radius;
    const ty = Math.sin(angle) * radius;
    const rot = (Math.random() - 0.5) * 300;
    const d = dur + Math.random() * 260;

    const anim = el.animate([
      { transform: 'translate(-50%,-50%) translate(0px,0px) scale(1) rotate(0deg)', opacity: 1 },
      { transform: 'translate(-50%,-50%) translate(' + (tx * 0.75) + 'px,' + (ty * 0.75 - 6) + 'px) scale(1.05) rotate(' + (rot * 0.6) + 'deg)', opacity: 1, offset: 0.5 },
      { transform: 'translate(-50%,-50%) translate(' + tx + 'px,' + (ty + 90) + 'px) scale(0.35) rotate(' + rot + 'deg)', opacity: 0 }
    ], { duration: d, easing: 'cubic-bezier(.15,.6,.35,1)', fill: 'forwards' });
    anim.onfinish = () => el.remove();
    setTimeout(() => el.remove(), d + 200);
  }
}

function spawnSmoke(cx, cy, n) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'spk';
    const size = 8 + Math.random() * 10;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.background = 'rgba(154,148,168,0.7)';
    fx.appendChild(el);
    const tx = (Math.random() - 0.5) * 60;
    const ty = -20 - Math.random() * 40;
    const d = 700 + Math.random() * 200;
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) translate(0,0) scale(0.6)', opacity: 0.8 },
      { transform: 'translate(-50%,-50%) translate(' + tx + 'px,' + ty + 'px) scale(1.4)', opacity: 0 }
    ], { duration: d, easing: 'ease-out', fill: 'forwards' });
    anim.onfinish = () => el.remove();
    setTimeout(() => el.remove(), d + 200);
  }
}

function doFlash() {
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
}
function shake(el) {
  el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle');
  setTimeout(() => el.classList.remove('wiggle'), 900);
}
function showToast(text) {
  toast.textContent = text;
  toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1150);
}
function celebrateFinale(bigText, smallText, cx, cy) {
  doFlash(); shake(app);
  document.getElementById('bnrBig').textContent = bigText;
  document.getElementById('bnrSmall').textContent = smallText || '';
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 1700);
  const waves = [0, 500, 1000, 1500];
  const usedPalettes = [];
  waves.forEach((delay, i) => {
    setTimeout(() => {
      const ox = cx + (Math.random() - 0.5) * 80;
      const oy = cy + (Math.random() - 0.5) * 60;
      // 波ごとにちがう色くみを選んで、フィナーレ全体が虹色になるようにする
      let palette = pickPalette();
      let guard = 0;
      while (usedPalettes.includes(palette) && guard < 5) { palette = pickPalette(); guard++; }
      usedPalettes.push(palette);
      spawnParticles(ox, oy, 30, { maxR: 190, minSize: 8, maxSize: 17, dur: 1050, colors: palette });
      if (i % 2 === 0) shake(app);
    }, delay);
  });
}

/* ===== オーディオ ===== */
let actx = null, bgmGain = null, sfxGain = null, bgmTimer = null, muted = false;
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  bgmGain = actx.createGain(); bgmGain.gain.value = 0.22; bgmGain.connect(actx.destination);
  sfxGain = actx.createGain(); sfxGain.gain.value = 0.7; sfxGain.connect(actx.destination);
  startBgm();
}
function tone(freq, dur, type, gainNode, vol, delay) {
  if (!actx) return;
  delay = delay || 0;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, actx.currentTime + delay);
  g.gain.setValueAtTime(0, actx.currentTime + delay);
  g.gain.linearRampToValueAtTime(vol, actx.currentTime + delay + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + delay + dur);
  osc.connect(g); g.connect(gainNode);
  osc.start(actx.currentTime + delay);
  osc.stop(actx.currentTime + delay + dur + 0.05);
}
function noiseBurst(dur, gainNode, vol, delay) {
  if (!actx) return;
  delay = delay || 0;
  const bufferSize = actx.sampleRate * dur;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const src = actx.createBufferSource();
  src.buffer = buffer;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, actx.currentTime + delay);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + delay + dur);
  const filt = actx.createBiquadFilter();
  filt.type = 'highpass'; filt.frequency.value = 1800;
  src.connect(filt); filt.connect(g); g.connect(gainNode);
  src.start(actx.currentTime + delay);
}
function playGoodSfx() {
  if (!actx) return;
  tone(520, 0.12, 'sine', sfxGain, 0.5, 0);
  tone(780, 0.14, 'triangle', sfxGain, 0.35, 0.05);
}
function playPerfectSfx() {
  if (!actx) return;
  tone(660, 0.16, 'sine', sfxGain, 0.55, 0);
  tone(990, 0.18, 'triangle', sfxGain, 0.4, 0.06);
  noiseBurst(0.35, sfxGain, 0.5, 0.1);
}
function playFinaleSfx() {
  if (!actx) return;
  [0, 0.12, 0.24, 0.36].forEach((d, i) => {
    tone(500 + i * 140, 0.3, 'triangle', sfxGain, 0.45, d);
    noiseBurst(0.4, sfxGain, 0.4, d + 0.04);
  });
}
function playMissSfx() {
  if (!actx) return;
  tone(140, 0.28, 'sine', sfxGain, 0.4, 0);
  tone(90, 0.3, 'sine', sfxGain, 0.3, 0.05);
}
function startBgm() {
  if (bgmTimer || !actx) return;
  const notes = [392, 440, 494, 587];
  let i = 0;
  bgmTimer = setInterval(() => {
    if (!actx || actx.state !== 'running') return;
    tone(notes[i % notes.length], 0.35, 'triangle', bgmGain, 0.18, 0);
    i++;
  }, cycleLen);
}
function stopBgm() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}
function suspendAudio() {
  stopBgm();
  if (actx && actx.state === 'running') actx.suspend();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) suspendAudio(); });
window.addEventListener('pagehide', suspendAudio);
window.addEventListener('blur', suspendAudio);

document.getElementById('muteBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (bgmGain) bgmGain.gain.value = muted ? 0 : 0.22;
  if (sfxGain) sfxGain.gain.value = muted ? 0 : 0.7;
});

/* ===== ゲーム本体 ===== */
const PERFECT_WIN = 60;
const GOOD_WIN = 130;
const LIVES = 4;
const SPEEDUP_EVERY = 5;
const SPEEDUP_FACTOR = 0.96;
const MIN_CYCLE = 550;
const FINALE_COMBO = 4;
const MIN_SCALE = 0.55, MAX_SCALE = 1.35;

let cycleLen = 900;
let phaseAnchor = performance.now();
let lives = LIVES;
let combo = 0, maxCombo = 0, score = 0, successCount = 0, finaleCount = 0;
let hitsSinceSpeedup = 0;
let gameOver = false;
let rafId = null;

const tama = document.getElementById('tama');
const stage = document.getElementById('stage');
const heartsEl = document.getElementById('hearts');
const scoreVal = document.getElementById('scoreVal');
const comboVal = document.getElementById('comboVal');
const tapHint = document.getElementById('tapHint');
const tapGlow = document.getElementById('tapGlow');

function popGlow(color, big) {
  tapGlow.style.borderColor = color;
  tapGlow.style.opacity = '0.9';
  tapGlow.getAnimations().forEach(a => a.cancel());
  tapGlow.animate([
    { transform: 'scale(1)', opacity: 0.9 },
    { transform: 'scale(' + (big ? 3.4 : 2.2) + ')', opacity: 0 }
  ], { duration: big ? 480 : 340, easing: 'ease-out' });
}

function renderHearts() {
  let html = '';
  for (let i = 0; i < LIVES; i++) {
    html += '<span class="heart' + (i < lives ? '' : ' lost') + '">❤️</span>';
  }
  heartsEl.innerHTML = html;
}
function renderStats() {
  scoreVal.textContent = score;
  comboVal.textContent = combo;
}

function tamaCenter() {
  const r = tama.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function loop(now) {
  if (gameOver) return;
  let elapsedInCycle = now - phaseAnchor;
  while (elapsedInCycle >= cycleLen) {
    phaseAnchor += cycleLen;
    elapsedInCycle = now - phaseAnchor;
  }
  const phase = elapsedInCycle / cycleLen;
  const scale = MIN_SCALE + (MAX_SCALE - MIN_SCALE) * (1 - Math.cos(2 * Math.PI * phase)) / 2;
  tama.style.transform = 'scale(' + scale.toFixed(3) + ')';
  rafId = requestAnimationFrame(loop);
}
rafId = requestAnimationFrame(loop);

function applySpeedup() {
  cycleLen = Math.max(MIN_CYCLE, cycleLen * SPEEDUP_FACTOR);
  phaseAnchor = performance.now();
}

function handleSuccess(kind) {
  combo++; maxCombo = Math.max(maxCombo, combo);
  successCount++;
  score += kind === 'perfect' ? 3 : 1;
  hitsSinceSpeedup++;
  renderStats();

  const c = tamaCenter();
  if (kind === 'perfect') {
    const outer = pickPalette();
    const inner = pickPalette();
    popGlow('#fff6e0', true);
    spawnParticles(c.x, c.y, 34, { maxR: 170, minSize: 8, maxSize: 15, dur: 950, colors: outer });
    setTimeout(() => spawnParticles(c.x, c.y, 16, { maxR: 100, minSize: 6, maxSize: 10, dur: 700, colors: inner }), 90);
    showToast('パーフェクト！');
    shake(app);
    playPerfectSfx();
  } else {
    const palette = pickPalette();
    popGlow(palette[0], false);
    spawnParticles(c.x, c.y, 22, { maxR: 130, minSize: 6, maxSize: 12, dur: 820, colors: palette });
    showToast('うちあげ せいこう！');
    playGoodSfx();
  }

  if (combo % FINALE_COMBO === 0) {
    finaleCount++;
    playFinaleSfx();
    celebrateFinale('だい うちあげ！！', combo + 'れんぞく せいこう！', c.x, c.y);
  }

  if (hitsSinceSpeedup >= SPEEDUP_EVERY) {
    hitsSinceSpeedup = 0;
    applySpeedup();
  }

  if (tapHint.style.opacity !== '0') {
    tapHint.style.opacity = '0';
  }
}

function handleMiss() {
  combo = 0;
  lives--;
  renderHearts();
  renderStats();
  const c = tamaCenter();
  popGlow('#9a94a8', false);
  spawnSmoke(c.x, c.y, 10);
  showToast('しっぱい…');
  playMissSfx();
  if (tapHint.style.opacity !== '0') {
    tapHint.style.opacity = '0';
  }
  if (lives <= 0) endGame();
}

function onTap(e) {
  if (gameOver) return;
  if (!actx) initAudio();
  else if (actx.state === 'suspended') actx.resume();

  const now = performance.now();
  let elapsedInCycle = (now - phaseAnchor) % cycleLen;
  if (elapsedInCycle < 0) elapsedInCycle += cycleLen;
  const absDelta = Math.min(elapsedInCycle, cycleLen - elapsedInCycle);

  if (absDelta <= PERFECT_WIN) handleSuccess('perfect');
  else if (absDelta <= GOOD_WIN) handleSuccess('good');
  else handleMiss();
}
stage.addEventListener('pointerdown', onTap);

function endGame() {
  gameOver = true;
  cancelAnimationFrame(rafId);
  suspendAudio();
  document.getElementById('resScore').textContent = score;
  document.getElementById('resSuccess').textContent = successCount;
  document.getElementById('resCombo').textContent = maxCombo;
  let title = 'おわり！';
  let hint = 'たまが 点線の わっかと ぴったり 重なった しゅんかんを ねらってみてね。';
  if (finaleCount >= 3) { title = 'だいせいこう！！'; hint = 'かんぺきな タイミングだったね！つぎは もっと はやい リズムに ちょうせん！'; }
  else if (finaleCount >= 1) { title = 'なかなか やるね！'; hint = 'コンボが つづくほど テンポが はやくなるよ。リズムに 乗って！'; }
  document.getElementById('resTitle').textContent = title;
  document.getElementById('resHint').textContent = hint;
  document.getElementById('resultOverlay').classList.add('show');
}

document.getElementById('retryBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  cycleLen = 900;
  phaseAnchor = performance.now();
  lives = LIVES; combo = 0; maxCombo = 0; score = 0; successCount = 0; finaleCount = 0; hitsSinceSpeedup = 0;
  gameOver = false;
  renderHearts(); renderStats();
  tapHint.style.opacity = '1';
  document.getElementById('resultOverlay').classList.remove('show');
  rafId = requestAnimationFrame(loop);
  if (actx && actx.state === 'suspended') { actx.resume(); startBgm(); }
});

renderHearts();
renderStats();
</script>
