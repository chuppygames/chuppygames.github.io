<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジャンケンゲーム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(150deg, #ffe9a8 0%, #ffd0dc 45%, #bfe6ff 100%);
    color: #3d3652;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 460px;
    background: #fffdf8;
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 24px;
    padding: 28px 24px 24px;
    box-shadow: 0 18px 40px rgba(150,110,140,0.22);
  }
  h1 { font-size: 22px; text-align: center; letter-spacing: 2px; margin-bottom: 4px; color: #ff7aa8; }
  .sub { text-align: center; font-size: 12px; opacity: 0.5; margin-bottom: 20px; }

  .score {
    display: flex;
    justify-content: space-around;
    background: #fff5e6;
    border: 1px solid #ffe6c2;
    border-radius: 14px;
    padding: 12px 0;
    margin-bottom: 20px;
  }
  .score div { text-align: center; }
  .score span { display: block; font-size: 11px; opacity: 0.55; margin-bottom: 3px; }
  .score b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .win b { color: #2bb673; }
  .lose b { color: #ef5f7a; }
  .draw b { color: #f0a516; }

  .arena {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px 4px;
  }
  .hand {
    font-size: 64px;
    line-height: 1;
    width: 100px;
    text-align: center;
    transition: transform 0.1s;
  }
  .hand.cpu { transform: scaleX(-1); }
  .shake { animation: shake 0.14s infinite; }
  @keyframes shake {
    0%,100% { transform: translateY(-10px); }
    50%     { transform: translateY(10px); }
  }
  .hand.cpu.shake { animation: shakeR 0.14s infinite; }
  @keyframes shakeR {
    0%,100% { transform: scaleX(-1) translateY(-10px); }
    50%     { transform: scaleX(-1) translateY(10px); }
  }
  .vs { font-size: 14px; opacity: 0.35; letter-spacing: 1px; }
  .label { text-align: center; font-size: 11px; opacity: 0.45; margin-top: 6px; }
  .side { width: 100px; }

  .arena {
    background: #f2f9ff;
    border: 1px solid #ddeeff;
    border-radius: 16px;
    padding: 14px 4px 8px;
  }

  .result {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    height: 40px;
    line-height: 40px;
    margin: 14px 0 4px;
  }
  .result.w { color: #2bb673; }
  .result.l { color: #ef5f7a; }
  .result.d { color: #f0a516; }
  .streak { text-align: center; font-size: 12px; opacity: 0.55; height: 18px; margin-bottom: 14px; }

  .buttons { display: flex; gap: 10px; }
  button.choice {
    flex: 1;
    padding: 16px 0 12px;
    font-size: 34px;
    border: 2px solid #ffe0ea;
    border-radius: 16px;
    background: #fff7fa;
    color: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  button.choice small { display: block; font-size: 11px; opacity: 0.55; margin-top: 4px; }
  button.choice:hover:not(:disabled) { background: #ffeef4; border-color: #ffb3cc; }
  button.choice:active:not(:disabled) { transform: scale(0.95); }
  button.choice:disabled { opacity: 0.45; cursor: default; }

  .reset {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: inherit;
    opacity: 0.4;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  .reset:hover { opacity: 0.75; }
</style>
</head>
<body>
<div class="app">
  <h1>ジャンケンゲーム</h1>
  <p class="sub">キーボードの 1 / 2 / 3 でも遊べます</p>

  <div class="score">
    <div class="win"><span>勝ち</span><b id="sw">0</b></div>
    <div class="draw"><span>あいこ</span><b id="sd">0</b></div>
    <div class="lose"><span>負け</span><b id="sl">0</b></div>
  </div>

  <div class="arena">
    <div class="side">
      <div class="hand" id="you">✊</div>
      <div class="label">あなた</div>
    </div>
    <div class="vs">VS</div>
    <div class="side">
      <div class="hand cpu" id="cpu">✊</div>
      <div class="label">コンピュータ</div>
    </div>
  </div>

  <div class="result" id="result">ジャンケン…</div>
  <div class="streak" id="streak"></div>

  <div class="buttons">
    <button class="choice" data-h="0">✊<small>グー</small></button>
    <button class="choice" data-h="1">✌️<small>チョキ</small></button>
    <button class="choice" data-h="2">🖐<small>パー</small></button>
  </div>

  <button class="reset" id="reset">スコアをリセット</button>
</div>

<script>
  const EMOJI = ['✊', '✌️', '🖐'];
  const NAMES = ['グー', 'チョキ', 'パー'];
  const youEl = document.getElementById('you');
  const cpuEl = document.getElementById('cpu');
  const resultEl = document.getElementById('result');
  const streakEl = document.getElementById('streak');
  const buttons = [...document.querySelectorAll('.choice')];
  let score = { w: 0, d: 0, l: 0 };
  let streak = 0, best = 0;
  let busy = false;

  function render() {
    document.getElementById('sw').textContent = score.w;
    document.getElementById('sd').textContent = score.d;
    document.getElementById('sl').textContent = score.l;
    streakEl.textContent = streak > 1 ? `${streak}連勝中!(最高 ${best}連勝)`
                         : best > 0 ? `最高 ${best}連勝` : '';
  }

  function play(you) {
    if (busy) return;
    busy = true;
    buttons.forEach(b => b.disabled = true);
    resultEl.textContent = 'ジャンケン…';
    resultEl.className = 'result';
    youEl.classList.add('shake');
    cpuEl.classList.add('shake');

    let t = 0;
    const spin = setInterval(() => {
      const r = Math.floor(Math.random() * 3);
      youEl.textContent = EMOJI[r];
      cpuEl.textContent = EMOJI[(r + 1) % 3];
      t++;
    }, 90);

    setTimeout(() => {
      clearInterval(spin);
      youEl.classList.remove('shake');
      cpuEl.classList.remove('shake');
      const cpu = Math.floor(Math.random() * 3);
      youEl.textContent = EMOJI[you];
      cpuEl.textContent = EMOJI[cpu];

      const diff = (you - cpu + 3) % 3;
      if (diff === 0) {
        score.d++;
        resultEl.textContent = 'あいこ!';
        resultEl.className = 'result d';
      } else if (diff === 2) {
        score.w++;
        streak++;
        best = Math.max(best, streak);
        resultEl.textContent = 'あなたの勝ち!';
        resultEl.className = 'result w';
      } else {
        score.l++;
        streak = 0;
        resultEl.textContent = 'あなたの負け…';
        resultEl.className = 'result l';
      }
      render();
      buttons.forEach(b => b.disabled = false);
      busy = false;
    }, 900);
  }

  buttons.forEach(b => b.addEventListener('click', () => play(+b.dataset.h)));
  document.addEventListener('keydown', e => {
    if (['1','2','3'].includes(e.key)) play(+e.key - 1);
  });
  document.getElementById('reset').addEventListener('click', () => {
    score = { w: 0, d: 0, l: 0 };
    streak = 0; best = 0;
    youEl.textContent = cpuEl.textContent = '✊';
    resultEl.textContent = 'ジャンケン…';
    resultEl.className = 'result';
    render();
  });
  render();
</script>
</body>
</html>
