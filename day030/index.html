<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>おりづる ロックオン｜Chuppy Games Day 030</title>
<style>
/* 3色だけ: 和紙・墨・朱 */
:root{ --paper:#ebe7dc; --ink:#1c1a17; --shu:#e23b22; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:var(--ink)}
#stage{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;overflow:hidden;background:var(--paper)}
canvas{display:block;width:100%;height:100%}

/* 上のHUD */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hud .k{font-size:11px;letter-spacing:.2em;opacity:.55}
.hud .v{font-size:26px;font-weight:700;line-height:1.05}
.hud .score .v{color:var(--shu)}
.hud .mid{text-align:center}
.hud .right{text-align:right}
.lives{font-size:20px;letter-spacing:.05em;line-height:1.3}
#snd{pointer-events:auto;margin-top:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  border-radius:99px;font-size:14px;padding:2px 10px;font-family:inherit}

/* 下のロックゲージ */
.gauge{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;justify-content:center;align-items:center;gap:5px;pointer-events:none}
.gauge i{width:15px;height:15px;border:1.5px solid var(--ink);opacity:.35;transform:rotate(45deg);transition:.08s}
.gauge i.on{background:var(--shu);border-color:var(--shu);opacity:1;transform:rotate(45deg) scale(1.15)}
.gauge b{font-size:13px;margin-left:8px;letter-spacing:.1em;min-width:5.5em}

/* 小演出のメッセージ */
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;
  font-size:34px;font-weight:800;color:var(--ink);opacity:0;text-shadow:0 0 12px var(--paper),0 0 4px var(--paper)}
#msg.go{animation:msg .95s ease-out}
#msg em{font-style:normal;color:var(--shu)}
@keyframes msg{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.12)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-24px)}}

/* 大演出: 朱のはんこ */
#banner{position:absolute;left:50%;top:40%;width:250px;margin-left:-125px;padding:18px 0 14px;text-align:center;
  border:6px double var(--shu);color:var(--shu);background:rgba(235,231,220,.88);pointer-events:none;opacity:0}
#banner b{display:block;font-size:52px;line-height:1.05;letter-spacing:.02em}
#banner span{display:block;font-size:17px;margin-top:6px;letter-spacing:.2em;color:var(--ink)}
#banner.go{animation:stamp 2.3s cubic-bezier(.2,.9,.3,1)}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(2.6)}12%{opacity:1;transform:rotate(-8deg) scale(.94)}18%{transform:rotate(-8deg) scale(1.03)}82%{opacity:1;transform:rotate(-8deg) scale(1)}100%{opacity:0;transform:rotate(-8deg) scale(1.05)}}

#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

/* 画面を覆うパネル(はじめ・結果) */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;background:rgba(235,231,220,.94)}
.panel[hidden]{display:none}
.panel .day{font-size:13px;letter-spacing:.35em;opacity:.6}
.panel h1{font-size:44px;line-height:1.15;margin:10px 0 6px;font-weight:800}
.panel h1 em{font-style:normal;color:var(--shu)}
.panel p{font-size:17px;line-height:1.75;margin:12px 0}
.panel .rule{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:10px 4px;margin:16px 0 22px}
.btn{font-family:inherit;font-size:24px;font-weight:800;color:var(--paper);background:var(--ink);border:0;
  border-radius:12px;padding:16px 46px;letter-spacing:.12em;box-shadow:0 5px 0 rgba(28,26,23,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(28,26,23,.35)}
#rTitle{font-size:40px}
#rScore{font-size:64px;font-weight:800;color:var(--shu);line-height:1;margin:6px 0 4px}
.stats{font-size:16px;line-height:1.9;margin:10px 0 6px}
#rHint{font-size:15px;opacity:.85;margin:4px 0 22px;padding:8px 12px;border:1.5px dashed var(--ink);border-radius:8px}
#rHint[hidden]{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="score"><div class="k">とくてん</div><div class="v" id="hScore">0</div></div>
    <div class="mid"><div class="k">のこり</div><div class="v" id="hTime">60</div></div>
    <div class="right"><div class="k">いのち</div><div class="lives" id="hLives"></div><button id="snd" type="button">🔊 おと</button></div>
  </div>

  <div class="gauge" id="gauge"></div>

  <div id="msg"></div>
  <div id="banner"><b>一網打尽</b><span>フルロック</span></div>
  <div id="flash"></div>

  <div class="panel" id="startP">
    <div class="day">CHUPPY GAMES ・ DAY 030</div>
    <h1>おりづる<br><em>ロックオン</em></h1>
    <div class="rule">
      <p>ゆびを <b>おしたまま</b> うごかすと<br>まるい しょうじゅんで ロックオン</p>
      <p><b>はなす</b>と いっせいに はっしゃ！<br>たくさん ためるほど 点が ふえる</p>
    </div>
    <button class="btn" id="startB" type="button">はじめる</button>
  </div>

  <div class="panel" id="resultP" hidden>
    <div class="day" id="rReason"></div>
    <div id="rTitle">おつかれさま</div>
    <div id="rScore">0</div>
    <div class="stats" id="rStats"></div>
    <div id="rHint"></div>
    <button class="btn" id="againB" type="button">もういちど</button>
  </div>
</div>

<script>
// ==ENGINE START==
// 画面に何も描かない「ゲームの中身」。描画と音はこの外でやる。
function makeEngine(W, H, rnd){
  const RET_OFF = 210;   // 自機から照準までの距離
  const RET_R   = 50;    // 照準の半径
  const MAX_LOCK = 10;   // いっぺんにロックできる数
  const LOCK_GAP = 0.07; // ロックとロックの間隔(秒)
  const SHIP_R  = 6;     // 自機の当たり判定
  const TIME    = 60;

  const E = {
    W, H, t:0, T:TIME, score:0, lives:3, inv:0, over:false, endReason:'',
    ship:{x:W/2, y:H-150}, enemies:[], bullets:[], lasers:[], locks:[],
    holding:false, lockCd:0, waveCd:1.2, nextId:1,
    maxVolley:0, smallCount:0, bigCount:0, kills:0, events:[],
    RET_OFF, RET_R, MAX_LOCK, SHIP_R
  };
  const ev = (type, o) => E.events.push(Object.assign({type}, o||{}));
  const diff = () => Math.min(1, E.t / E.T);
  E.reticle = () => ({x:E.ship.x, y:E.ship.y - RET_OFF});

  function add(o){
    E.enemies.push(Object.assign({
      id:E.nextId++, hp:1, r:15, locked:0, age:0, vy:80, amp:0, freq:0, phase:0,
      fire:1.0 + rnd()*3.0, shooter: rnd() < 0.4, dead:false, gone:false, big:false
    }, o, {x0:o.x}));
  }

  function spawnWave(){
    const d = diff(), sp = 1 + d*0.45, k = rnd();
    const m = 40, span = E.W - 2*m;
    if (k < 0.26){                      // よこ一列
      const n = 5, y = -20;
      for (let i=0;i<n;i++) add({x:m+span*i/(n-1), y, vy:72*sp, amp:16, freq:1.6, phase:i});
    } else if (k < 0.46){               // たて一列
      const x = m + rnd()*span;
      for (let i=0;i<5;i++) add({x, y:-20-i*40, vy:100*sp});
    } else if (k < 0.66){               // V字
      const cx = m + 76 + rnd()*(span-152);
      for (let i=-2;i<=2;i++) add({x:cx+i*38, y:-20-Math.abs(i)*34, vy:88*sp});
    } else if (k < 0.84){               // へび
      const cx = E.W*(0.35 + rnd()*0.3);
      for (let i=0;i<6;i++) add({x:cx, y:-20-i*34, vy:92*sp, amp:E.W*0.2, freq:1.3, phase:-i*0.45});
    } else {                             // 大玉 + おとも
      const cx = E.W*(0.28 + rnd()*0.44);
      add({x:cx, y:-40, vy:46*sp, hp:3, r:27, big:true, shooter:true});
      add({x:cx-60, y:-10, vy:60*sp}); add({x:cx+60, y:-10, vy:60*sp});
    }
    E.waveCd = (2.4 - d*1.0) * (0.85 + rnd()*0.3);
  }

  function breakLocks(){
    if (!E.locks.length) return;
    for (const e of E.locks) e.locked = 0;
    ev('lost', {n:E.locks.length});
    E.locks = [];
  }

  function hurt(){
    if (E.inv > 0 || E.over) return;
    E.lives--; E.inv = 1.6;
    ev('hurt', {x:E.ship.x, y:E.ship.y});
    breakLocks(); E.lockCd = 0.8;   // 当たった直後は少しロックできない
    E.bullets = E.bullets.filter(b => Math.hypot(b.x-E.ship.x, b.y-E.ship.y) > 120);
    if (E.lives <= 0) finish('lives');
  }
  function finish(r){
    if (E.over) return;
    E.over = true; E.endReason = r;
    ev('end', {reason:r});
    E.release();   // 時間切れのとき、ためていたロックは最後に全部撃つ
  }

  E.press = () => { if (!E.over) E.holding = true; };
  E.release = () => {
    E.holding = false;
    const n = E.locks.length;
    if (!n) return;
    const s = E.ship;
    E.locks.forEach((e, i) => {
      const side = (i % 2 ? 1 : -1);
      E.lasers.push({
        target:e, age:0, dur:0.30 + i*0.035, mult:n,
        p0:{x:s.x, y:s.y-10},
        p1:{x:s.x + side*(70 + rnd()*90), y:s.y + 20 - rnd()*70},
        x:s.x, y:s.y, tx:e.x, ty:e.y, trail:[]
      });
    });
    E.maxVolley = Math.max(E.maxVolley, n);
    if (n >= MAX_LOCK) E.bigCount++;
    else if (n >= 5) E.smallCount++;
    ev('fire', {n});
    E.locks = [];
  };
  E.moveShip = (dx, dy) => {
    const s = E.ship;
    s.x = Math.max(16, Math.min(E.W-16, s.x + dx));
    s.y = Math.max(RET_OFF + 60, Math.min(E.H-44, s.y + dy));
  };

  E.step = (dt) => {
    const d = diff();
    if (!E.over){
      E.t += dt;
      if (E.t >= E.T){ E.t = E.T; finish('time'); }
      E.inv = Math.max(0, E.inv - dt);
      E.waveCd -= dt;
      if (E.waveCd <= 0 && !E.over) spawnWave();
    }
    const s = E.ship;

    // 敵
    for (const e of E.enemies){
      e.age += dt;
      e.y += e.vy*dt;
      e.x = e.x0 + e.amp*Math.sin(e.freq*e.age + e.phase);
      if (e.y > E.H + 40) e.gone = true;
      if (E.over) continue;
      if (E.t > 3 && e.shooter && !e.locked && e.y > 10 && e.y < s.y - RET_OFF - 30){  // ロックされた敵は撃ってこない
        e.fire -= dt;
        if (e.fire <= 0){
          const a = Math.atan2(s.y - e.y, s.x - e.x), v = 115 + d*60;
          E.bullets.push({x:e.x, y:e.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v});
          if (e.big){
            E.bullets.push({x:e.x, y:e.y, vx:Math.cos(a-0.35)*v, vy:Math.sin(a-0.35)*v});
            E.bullets.push({x:e.x, y:e.y, vx:Math.cos(a+0.35)*v, vy:Math.sin(a+0.35)*v});
          }
          e.fire = (5.0 + rnd()*3.5) * (1 - 0.4*d);
        }
      }
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r*0.8 + SHIP_R) hurt();
    }

    // 敵の弾
    for (const b of E.bullets){
      b.x += b.vx*dt; b.y += b.vy*dt;
      if (b.x < -20 || b.x > E.W+20 || b.y < -20 || b.y > E.H+20) b.gone = true;
      else if (!E.over && Math.hypot(b.x - s.x, b.y - s.y) < 4 + SHIP_R) { b.gone = true; hurt(); }
    }

    // ロックオン
    E.lockCd -= dt;
    if (E.holding && !E.over && E.lockCd <= 0 && E.locks.length < MAX_LOCK){
      const R = E.reticle();
      let best = null, bd = 1e9;
      for (const e of E.enemies){
        if (e.dead || e.gone || e.locked >= e.hp || e.y < 0) continue;
        const dd = Math.hypot(e.x - R.x, e.y - R.y);
        if (dd < RET_R + e.r*0.5 && dd < bd){ bd = dd; best = e; }
      }
      if (best){
        best.locked++; E.locks.push(best); E.lockCd = LOCK_GAP;
        ev('lock', {n:E.locks.length, x:best.x, y:best.y});
      }
    }
    // 画面の外へ逃げた敵のロックは消える
    if (E.locks.some(e => e.gone)){
      const lost = E.locks.filter(e => e.gone).length;
      E.locks = E.locks.filter(e => !e.gone);
      ev('slip', {n:lost});
    }

    // レーザー(追いかけて当たる)
    for (const L of E.lasers){
      L.age += dt;
      const T = L.target;
      if (!T.gone){ L.tx = T.x; L.ty = T.y; }
      const u = Math.min(1, L.age / L.dur), iu = 1 - u;
      L.x = iu*iu*L.p0.x + 2*iu*u*L.p1.x + u*u*L.tx;
      L.y = iu*iu*L.p0.y + 2*iu*u*L.p1.y + u*u*L.ty;
      L.trail.push({x:L.x, y:L.y}); if (L.trail.length > 9) L.trail.shift();
      if (u >= 1 && !L.done){
        L.done = true;
        if (!T.gone && !T.dead){
          T.hp--; T.locked = Math.max(0, T.locked - 1);
          if (T.hp <= 0){
            T.dead = true; E.kills++;
            E.score += 100 * L.mult;
            ev('kill', {x:T.x, y:T.y, big:T.big, mult:L.mult, pts:100*L.mult});
          } else {
            E.score += 20 * L.mult;
            ev('hit', {x:T.x, y:T.y});
          }
        }
      }
    }
    E.lasers   = E.lasers.filter(L => !L.done || L.age < L.dur + 0.12);
    E.enemies  = E.enemies.filter(e => !e.dead && !e.gone);
    E.bullets  = E.bullets.filter(b => !b.gone);
  };
  return E;
}
// ==ENGINE END==

// ================= 画面と入力 =================
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), g = cv.getContext('2d');
const PAPER = '#ebe7dc', INK = '#1c1a17', SHU = '#e23b22';
let W = 390, H = 760, E = null, phase = 'title', last = 0;
let shake = 0, shakeT = 0, scroll = 0, endTimer = 0, bigBusy = 0;
const fx = [];      // 粒(墨のしずく・朱の花びら・輪)
const pops = [];    // +300 などの文字
const clouds = [];

function resize(){
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (E){ E.W = W; E.H = H; E.moveShip(0, 0); }
}
addEventListener('resize', resize);
resize();
for (let i=0;i<9;i++) clouds.push({x:Math.random()*W, y:Math.random()*H, w:80+Math.random()*160, s:18+Math.random()*40, a:.05+Math.random()*.07});

// ゲージの四角を用意
function buildGauge(n){
  $('gauge').innerHTML = '';
  for (let i=0;i<n;i++) $('gauge').appendChild(document.createElement('i'));
  $('gauge').appendChild(document.createElement('b'));
}
buildGauge(10);

let px = 0, py = 0, pid = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  if (phase !== 'play') return;
  pid = e.pointerId; px = e.clientX; py = e.clientY;
  E.press();
});
addEventListener('pointermove', e => {
  if (phase !== 'play' || e.pointerId !== pid) return;
  E.moveShip((e.clientX - px)*1.35, (e.clientY - py)*1.35);
  px = e.clientX; py = e.clientY;
});
function up(e){
  if (e.pointerId !== pid) return;
  pid = null;
  if (phase === 'play') E.release();
}
addEventListener('pointerup', up);
addEventListener('pointercancel', up);

// ================= 音 =================
let ac = null, sfxG = null, bgmG = null, soundOn = true, bgmTimer = null, step = 0, noiseBuf = null;
function initAudio(){
  if (ac) { ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  sfxG = ac.createGain(); sfxG.gain.value = 0.8; sfxG.connect(master);
  bgmG = ac.createGain(); bgmG.gain.value = 0.28; bgmG.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate*0.5, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
}
function tone(freq, type, vol, dur, when=0, to=null, bus=sfxG){
  if (!ac || !soundOn) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  v.gain.setValueAtTime(vol, t);
  v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v); v.connect(bus); o.start(t); o.stop(t + dur + 0.02);
}
function noise(vol, dur, fq, when=0, bus=sfxG){
  if (!ac || !soundOn) return;
  const t = ac.currentTime + when;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fq; f.Q.value = 1.2;
  const v = ac.createGain();
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(v); v.connect(bus); s.start(t); s.stop(t + dur + 0.02);
}
const S = {
  lock: n => tone(700 * Math.pow(1.07, n), 'square', 0.12, 0.06),
  full: () => { tone(1568, 'sine', 0.2, 0.25); tone(2093, 'sine', 0.16, 0.35, 0.06); },
  fire: n => { tone(260, 'sawtooth', 0.14, 0.3, 0, 1400); noise(0.2, 0.18, 3000); },
  kill: () => { noise(0.35, 0.22, 700); tone(180, 'sine', 0.3, 0.2, 0, 50); },
  hit:  () => tone(420, 'triangle', 0.15, 0.08),
  hurt: () => { tone(240, 'square', 0.22, 0.45, 0, 70); noise(0.3, 0.3, 400); },
  lost: () => tone(500, 'triangle', 0.12, 0.25, 0, 250),
  small:() => { tone(988, 'triangle', 0.18, 0.2); tone(1319, 'triangle', 0.18, 0.3, 0.08); },
  big:  () => { [0, 0.5, 1.0].forEach(w => { tone(1320, 'sine', 0.22, 1.4, w); tone(1980, 'sine', 0.12, 1.2, w); noise(0.4, 0.25, 160, w); }); },
};
// BGM: みやこぶし音階(レ・ミ♭・ソ・ラ・シ♭) + 太鼓 + かね  BPM132
const BPM = 132, STEP = 60 / BPM / 4;
const SC = [293.66, 311.13, 392.00, 440.00, 466.16, 587.33, 622.25, 783.99];
const MEL = [5,-1,4,-1, 3,-1,2,3, 4,-1,3,-1, 2,-1,0,-1,  0,-1,2,-1, 3,-1,4,-1, 5,-1,6,5, 4,-1,-1,-1];
const BASS = [146.83, 146.83, 116.54, 130.81];
function bgmTick(){
  if (!ac || !soundOn) return;
  const s = step % 32;
  if (s % 4 === 0) { tone(78, 'sine', 0.55, 0.22, 0, 45, bgmG); }            // 太鼓
  if (s % 8 === 6) { tone(78, 'sine', 0.35, 0.16, 0, 45, bgmG); }
  if (s % 2 === 1) noise(0.06, 0.04, 7400, 0, bgmG);                          // ハイハット
  if (s % 16 === 12) { tone(1244, 'sine', 0.08, 0.6, 0, null, bgmG); }         // かね
  if (MEL[s] >= 0) tone(SC[MEL[s]], 'triangle', 0.16, STEP*1.8, 0, null, bgmG);
  if (s % 8 === 0) tone(BASS[Math.floor(step/32) % 4], 'sine', 0.22, STEP*7, 0, null, bgmG);
  step++;
}
function startBgm(){ stopBgm(); if (ac && soundOn) bgmTimer = setInterval(bgmTick, STEP*1000); }
function stopBgm(){ if (bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }
$('snd').addEventListener('click', () => {
  soundOn = !soundOn;
  $('snd').textContent = soundOn ? '🔊 おと' : '🔇 おと';
  if (soundOn){ initAudio(); if (phase === 'play') startBgm(); } else stopBgm();
});
function pauseAll(){ stopBgm(); if (ac) ac.suspend(); if (E && phase === 'play') E.release(); pid = null; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseAll();
  else if (ac && phase === 'play'){ ac.resume(); startBgm(); }
});
addEventListener('pagehide', pauseAll);
addEventListener('blur', pauseAll);
addEventListener('focus', () => { if (ac && phase === 'play' && !document.hidden){ ac.resume(); startBgm(); } });

// ================= 演出 =================
function restart(el){ el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
function doShake(p, t){ shake = Math.max(shake, p); shakeT = Math.max(shakeT, t); }
function splat(x, y, n, spd, shuRate){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = spd*(0.3 + Math.random());
    fx.push({k: Math.random() < shuRate ? 'petal' : 'drop', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 40,
      r: 2 + Math.random()*4, life: 0.7 + Math.random()*0.7, age:0, rot:Math.random()*6, vr:(Math.random()-.5)*10});
  }
}
function ring(x, y, r1, col, life){ fx.push({k:'ring', x, y, r:6, r1, col, life, age:0}); }
function rain(n){ // 上から花びらと墨が降る
  for (let i=0;i<n;i++) fx.push({k: Math.random()<.6 ? 'petal' : 'drop', x:Math.random()*W, y:-20 - Math.random()*120,
    vx:(Math.random()-.5)*60, vy:160 + Math.random()*200, r:3 + Math.random()*5, life:2.2, age:0, rot:Math.random()*6, vr:(Math.random()-.5)*8, fall:true});
}
function burstUp(n){ // 下から打ち上げ
  for (let i=0;i<n;i++) fx.push({k: Math.random()<.65 ? 'petal' : 'drop', x:W*(.15 + Math.random()*.7), y:H + 10,
    vx:(Math.random()-.5)*220, vy:-(520 + Math.random()*420), r:3 + Math.random()*5, life:1.8, age:0, rot:Math.random()*6, vr:(Math.random()-.5)*10});
}
function say(html){ $('msg').innerHTML = html; restart($('msg')); }

function smallFx(n){
  S.small();
  splat(E.ship.x, E.ship.y - E.RET_OFF, 40, 260, 0.5);
  say(`まとめうち！ <em>×${n}</em>`);
  doShake(5, 0.3);
}
function bigFx(n){
  bigBusy = 2.4;
  S.big();
  const waves = [
    () => { restart($('flash')); restart($('banner')); rain(60); doShake(12, 0.35); },
    () => { burstUp(60); doShake(10, 0.3); },
    () => { restart($('flash')); rain(60); burstUp(30); doShake(12, 0.35); },
    () => { burstUp(70); ring(W/2, H*0.45, W*0.9, SHU, 0.9); },
  ];
  waves.forEach((f, i) => setTimeout(() => { if (phase !== 'title') f(); }, i*500));
}

function handleEvents(){
  for (const ev of E.events){
    switch (ev.type){
      case 'lock':
        S.lock(ev.n);
        ring(ev.x, ev.y, 34, SHU, 0.3);
        if (ev.n === E.MAX_LOCK) { S.full(); say('<em>フルロック</em>'); }
        break;
      case 'fire':
        S.fire(ev.n);
        if (ev.n >= E.MAX_LOCK) bigFx(ev.n);
        else if (ev.n >= 5) smallFx(ev.n);
        break;
      case 'kill':
        S.kill();
        splat(ev.x, ev.y, ev.big ? 30 : 16, ev.big ? 240 : 170, 0.25);
        ring(ev.x, ev.y, ev.big ? 80 : 46, INK, 0.45);
        pops.push({x:ev.x, y:ev.y, txt:'+' + ev.pts, age:0, big: ev.mult >= 5});
        if (ev.big) doShake(6, 0.25);
        break;
      case 'hit':
        S.hit(); splat(ev.x, ev.y, 6, 120, 0.3);
        break;
      case 'hurt':
        S.hurt(); doShake(14, 0.45);
        splat(ev.x, ev.y, 24, 200, 0);
        break;
      case 'lost':
        S.lost(); say('ロック とけた…');
        break;
      case 'end':
        endGame(ev.reason);
        break;
    }
  }
  E.events.length = 0;
}

// ================= 進行 =================
function startGame(){
  initAudio();
  E = makeEngine(W, H, Math.random);
  buildGauge(E.MAX_LOCK);
  fx.length = 0; pops.length = 0; bigBusy = 0;
  phase = 'play';
  $('startP').hidden = true; $('resultP').hidden = true;
  startBgm();
}
function endGame(reason){
  phase = 'ending';
  pid = null;
  endTimer = 1.4;
  stopBgm();
  say(reason === 'time' ? '<em>そこまで！</em>' : 'おちた…');
}
function showResult(){
  phase = 'result';
  const good = E.bigCount > 0;
  $('rReason').textContent = E.endReason === 'time' ? '60びょう いきのこった！' : 'いのちが なくなった';
  $('rTitle').innerHTML = good ? 'お<span style="color:#e23b22">みごと</span>！' : 'おつかれさま';
  $('rScore').textContent = E.score.toLocaleString();
  $('rStats').innerHTML =
    `いちばん ためた ロック:<b>${E.maxVolley}</b> / ${E.MAX_LOCK}<br>` +
    `一網打尽:<b>${E.bigCount}</b>かい ・ まとめうち:<b>${E.smallCount}</b>かい<br>` +
    `うちおとした かず:<b>${E.kills}</b>`;
  const hint = $('rHint');
  if (!good){
    hint.hidden = false;
    hint.textContent = E.maxVolley >= 7
      ? `あと ${E.MAX_LOCK - E.maxVolley}こ！ よこ一列の れつを すべるように なぞると そろいやすい`
      : 'ヒント:すぐ はなさずに、ゆびを おしたまま つぎの むれを まってみよう';
  } else hint.hidden = true;
  $('resultP').hidden = false;
  if (ac && soundOn) tone(good ? 784 : 392, 'triangle', 0.2, 0.6);
}
$('startB').addEventListener('click', startGame);
$('againB').addEventListener('click', startGame);

// ================= 描画 =================
function blobPath(x, y, r, seed, t){
  g.beginPath();
  for (let i=0;i<=20;i++){
    const a = i/20*Math.PI*2;
    const rr = r*(1 + 0.08*Math.sin(a*3 + seed + t*3) + 0.05*Math.sin(a*5 - seed*2 + t*2));
    const X = x + Math.cos(a)*rr, Y = y + Math.sin(a)*rr;
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.closePath();
}
function drawEnemy(e, t){
  g.fillStyle = INK;
  blobPath(e.x, e.y, e.r, e.id, t);
  g.fill();
  if (e.big){ // たれた墨
    g.beginPath(); g.ellipse(e.x - 9, e.y + e.r + 4, 3, 6, 0, 0, 7); g.ellipse(e.x + 8, e.y + e.r + 7, 2.5, 8, 0, 0, 7); g.fill();
  }
  // 目: 自機の方を見る
  const a = Math.atan2(E.ship.y - e.y, E.ship.x - e.x);
  const eyes = e.big ? [[-10,-4,6],[10,-4,6],[0,-15,4.5]] : [[-5,-2,4],[5,-2,4]];
  for (const [ox, oy, er] of eyes){
    g.fillStyle = PAPER; g.beginPath(); g.arc(e.x+ox, e.y+oy, er, 0, 7); g.fill();
    g.fillStyle = INK; g.beginPath(); g.arc(e.x+ox+Math.cos(a)*er*.4, e.y+oy+Math.sin(a)*er*.4, er*.5, 0, 7); g.fill();
  }
  // ロックの印: 朱のかぎかっこが回る
  if (e.locked > 0){
    const s = e.r + 9, rot = t*4;
    g.save(); g.translate(e.x, e.y); g.rotate(rot);
    g.strokeStyle = SHU; g.lineWidth = 3;
    for (let k=0;k<4;k++){
      g.rotate(Math.PI/2);
      g.beginPath(); g.moveTo(s-8, -s); g.lineTo(s, -s); g.lineTo(s, -s+8); g.stroke();
    }
    g.restore();
    if (e.hp > 1){
      g.fillStyle = SHU; g.font = 'bold 14px serif'; g.textAlign = 'center';
      g.fillText('×' + e.locked, e.x, e.y - e.r - 14);
    }
  }
}
function drawCrane(x, y, t, inv){
  if (inv > 0 && Math.floor(inv*12) % 2) return;
  const f = 0.75 + 0.25*Math.sin(t*14);   // はばたき
  g.save(); g.translate(x, y);
  g.lineJoin = 'round'; g.lineWidth = 2; g.strokeStyle = INK;
  // つばさ
  g.fillStyle = '#f7f4ec';
  g.beginPath(); g.moveTo(0, -4); g.lineTo(-30, -4 - 16*f); g.lineTo(-8, 8); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(0, -4); g.lineTo(30, -4 - 16*f); g.lineTo(8, 8); g.closePath(); g.fill(); g.stroke();
  // からだ
  g.beginPath(); g.moveTo(0, -8); g.lineTo(9, 4); g.lineTo(0, 14); g.lineTo(-9, 4); g.closePath(); g.fill(); g.stroke();
  // くび・あたま(上向き)と しっぽ
  g.beginPath(); g.moveTo(-2, -6); g.lineTo(0, -24); g.lineTo(5, -27); g.lineTo(2, -21); g.lineTo(2, -6); g.closePath(); g.fillStyle = INK; g.fill();
  g.beginPath(); g.moveTo(-2, 12); g.lineTo(0, 24); g.lineTo(2, 12); g.fill();
  // 朱のしるし(当たり判定の位置)
  g.fillStyle = SHU; g.beginPath(); g.arc(0, 3, 3, 0, 7); g.fill();
  g.restore();
}
function drawReticle(t){
  const R = E.reticle(), hold = E.holding && phase === 'play';
  g.save(); g.translate(R.x, R.y);
  g.globalAlpha = hold ? 1 : 0.3;
  g.strokeStyle = hold ? SHU : INK; g.lineWidth = hold ? 2.5 : 1.5;
  g.setLineDash([10, 7]); g.rotate(t*(hold ? 2.2 : 0.6));
  g.beginPath(); g.arc(0, 0, E.RET_R, 0, 7); g.stroke();
  g.setLineDash([]);
  for (let k=0;k<4;k++){ g.rotate(Math.PI/2); g.beginPath(); g.moveTo(E.RET_R - 8, 0); g.lineTo(E.RET_R + 8, 0); g.stroke(); }
  g.restore();
  // 自機から照準へのガイド線
  g.save(); g.globalAlpha = hold ? .35 : .12; g.strokeStyle = hold ? SHU : INK; g.setLineDash([3, 6]); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(E.ship.x, E.ship.y - 30); g.lineTo(R.x, R.y + E.RET_R); g.stroke(); g.restore();
  // ロック中の敵へ細い線
  if (E.locks.length){
    g.save(); g.strokeStyle = SHU; g.globalAlpha = .45; g.lineWidth = 1;
    for (const e of E.locks){ g.beginPath(); g.moveTo(E.ship.x, E.ship.y - 10); g.lineTo(e.x, e.y); g.stroke(); }
    g.restore();
  }
}
function drawBg(dt){
  g.fillStyle = PAPER; g.fillRect(-20, -20, W+40, H+40);
  // 大きな円相(うすい墨)
  g.save(); g.globalAlpha = .07; g.strokeStyle = INK; g.lineWidth = 22; g.lineCap = 'round';
  g.beginPath(); g.arc(W*.72, H*.2, W*.3, -1.2, 4.6); g.stroke(); g.restore();
  // 流れる雲(墨のにじみ)
  for (const c of clouds){
    c.y += c.s*dt*(phase === 'play' ? 3 : 1);
    if (c.y - 40 > H){ c.y = -40; c.x = Math.random()*W; }
    g.fillStyle = `rgba(28,26,23,${c.a})`;
    g.beginPath(); g.ellipse(c.x, c.y, c.w/2, 7, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(c.x + c.w*.18, c.y - 6, c.w/4, 5, 0, 0, 7); g.fill();
  }
}
function drawFx(dt){
  for (const p of fx){
    p.age += dt;
    const k = 1 - p.age/p.life;
    if (p.k === 'ring'){
      const r = p.r + (p.r1 - p.r)*(1 - k*k);
      g.save(); g.globalAlpha = Math.max(0, k); g.strokeStyle = p.col; g.lineWidth = 3*k + 1;
      g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.stroke(); g.restore();
      continue;
    }
    p.vy += (p.fall ? 30 : 520)*dt; p.vx *= 0.99;
    p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
    g.save(); g.globalAlpha = Math.max(0, Math.min(1, k*1.6)); g.translate(p.x, p.y); g.rotate(p.rot);
    if (p.k === 'petal'){ g.fillStyle = SHU; g.beginPath(); g.ellipse(0, 0, p.r, p.r*.55, 0, 0, 7); g.fill(); }
    else { g.fillStyle = INK; g.beginPath(); g.arc(0, 0, p.r*.8, 0, 7); g.fill(); }
    g.restore();
  }
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].age >= fx[i].life) fx.splice(i, 1);
  for (const p of pops){
    p.age += dt;
    g.save(); g.globalAlpha = Math.max(0, 1 - p.age/0.9);
    g.font = `bold ${p.big ? 22 : 15}px serif`; g.textAlign = 'center';
    g.lineWidth = 4; g.strokeStyle = PAPER; g.fillStyle = p.big ? SHU : INK;
    g.strokeText(p.txt, p.x, p.y - 20 - p.age*40); g.fillText(p.txt, p.x, p.y - 20 - p.age*40);
    g.restore();
  }
  for (let i = pops.length - 1; i >= 0; i--) if (pops[i].age >= 0.9) pops.splice(i, 1);
}
function draw(dt, t){
  g.save();
  if (shakeT > 0){ g.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); }
  drawBg(dt);
  if (E){
    if (phase === 'play' || phase === 'ending') drawReticle(t);
    for (const b of E.bullets){
      g.fillStyle = INK; g.beginPath(); g.arc(b.x, b.y, 6, 0, 7); g.fill();
      g.fillStyle = PAPER; g.beginPath(); g.arc(b.x, b.y, 2.6, 0, 7); g.fill();
    }
    for (const e of E.enemies) drawEnemy(e, t);
    // レーザー
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
    for (const L of E.lasers){
      const tr = L.trail; if (tr.length < 2) continue;
      for (let i=1;i<tr.length;i++){
        g.strokeStyle = SHU; g.globalAlpha = i/tr.length; g.lineWidth = 1 + 4*i/tr.length;
        g.beginPath(); g.moveTo(tr[i-1].x, tr[i-1].y); g.lineTo(tr[i].x, tr[i].y); g.stroke();
      }
      if (!L.done){ g.globalAlpha = 1; g.fillStyle = SHU; g.beginPath(); g.arc(L.x, L.y, 4, 0, 7); g.fill(); }
    }
    g.restore();
    if (phase !== 'result' || E.lives > 0) drawCrane(E.ship.x, E.ship.y, t, E.inv);
  } else {
    drawCrane(W/2, H*0.8, t, 0);
  }
  drawFx(dt);
  g.restore();
}
function updateHud(){
  if (!E) { $('hLives').textContent = ''; return; }
  $('hScore').textContent = E.score.toLocaleString();
  $('hTime').textContent = Math.ceil(E.T - E.t);
  $('hLives').textContent = '◆'.repeat(Math.max(0, E.lives)) + '◇'.repeat(Math.max(0, 3 - E.lives));
  const cells = $('gauge').querySelectorAll('i');
  cells.forEach((c, i) => c.classList.toggle('on', i < E.locks.length));
  $('gauge').querySelector('b').textContent = `ロック ${E.locks.length}/${E.MAX_LOCK}`;
}

function loop(ts){
  const dt = Math.min(0.033, (ts - last)/1000 || 0); last = ts;
  const t = ts/1000;
  if (phase === 'play' || phase === 'ending' || phase === 'result'){
    E.step(dt);
    handleEvents();
  }
  if (phase === 'ending'){
    bigBusy -= dt; endTimer -= dt;
    if (endTimer <= 0 && bigBusy <= 0) showResult();
  } else if (bigBusy > 0) bigBusy -= dt;
  shakeT -= dt; if (shakeT <= 0) shake = 0;
  draw(dt, t);
  updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
