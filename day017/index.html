<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>よるの けずりくじ｜Chuppy Games Day 017</title>
<style>
  :root{
    --night:#072c22;
    --night2:#0b3a2c;
    --night3:#04201a;
    --text:#eaf6ee;
    --neon:#ff5d8f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    background:var(--night3);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    padding:14px;overflow:hidden;position:relative;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(ellipse at 50% 14%, rgba(255,93,143,.20) 0%, transparent 52%),
      linear-gradient(180deg,var(--night2) 0%, var(--night) 46%, var(--night3) 100%);
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 12% 18%, rgba(234,246,238,.5), transparent),
      radial-gradient(1.6px 1.6px at 78% 12%, rgba(234,246,238,.42), transparent),
      radial-gradient(1.6px 1.6px at 33% 8%, rgba(255,93,143,.5), transparent),
      radial-gradient(2px 2px at 88% 30%, rgba(234,246,238,.32), transparent),
      radial-gradient(1.4px 1.4px at 58% 22%, rgba(234,246,238,.38), transparent);
    animation:twinkle 4.5s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.45}to{opacity:1}}

  .app{position:relative;z-index:2;width:100%;max-width:390px;display:flex;flex-direction:column;gap:10px}

  header{text-align:center}
  h1{font-size:25px;letter-spacing:2px;color:var(--neon);text-shadow:0 0 14px rgba(255,93,143,.65), 0 2px 0 rgba(0,0,0,.4)}
  .sub{font-size:11px;opacity:.62;margin-top:3px;letter-spacing:.04em;line-height:1.6}

  .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .hud div{background:rgba(234,246,238,.07);border:1.5px solid rgba(234,246,238,.16);border-radius:12px;padding:6px 2px;text-align:center}
  .hud i{display:block;font-style:normal;font-size:9.5px;opacity:.55;letter-spacing:.14em}
  .hud b{display:block;font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums}
  #tTime.low{color:var(--neon);animation:pulse .55s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---- くじ ---- */
  .ticket{
    position:relative;
    background:linear-gradient(160deg,#0f4636,#0a3227);
    border:3px solid var(--neon);
    border-radius:18px;padding:12px;
    box-shadow:0 0 26px rgba(255,93,143,.28), inset 0 0 40px rgba(0,0,0,.35);
    transition:transform .32s cubic-bezier(.3,1.4,.5,1), opacity .32s, border-color .3s, box-shadow .3s;
  }
  /* 大あたりが消えた状態：枠が灰色になる */
  .ticket.dead{border-color:#6d7f77;box-shadow:0 0 10px rgba(0,0,0,.4), inset 0 0 40px rgba(0,0,0,.45)}
  .ticket.out{transform:translateX(-118%) rotate(-9deg);opacity:0}
  .ticket.in{transform:translateX(118%) rotate(9deg);opacity:0}
  .tHead{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.16em;opacity:.6;margin-bottom:8px}
  .tHead b{color:var(--neon);opacity:.95;font-size:11px;transition:color .3s}
  .ticket.dead .tHead b{color:#8fa19a}

  .cells{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .cell{
    position:relative;aspect-ratio:1/1;
    background:radial-gradient(circle at 50% 38%, #14513e, #0a2d23);
    border:2px solid rgba(234,246,238,.14);
    border-radius:10px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:40px;line-height:1;
    transition:border-color .3s, box-shadow .3s;
  }
  .cell span{transform:scale(.8);opacity:.9;transition:transform .42s cubic-bezier(.2,1.7,.4,1), opacity .42s}
  .cell.open span{transform:scale(1.05);opacity:1}
  .cell.hit{border-color:var(--neon);box-shadow:0 0 16px rgba(255,93,143,.55) inset, 0 0 12px rgba(255,93,143,.4)}
  .cell canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .28s}
  .cell.open canvas{opacity:0}

  #pad{position:absolute;inset:0;touch-action:none;cursor:crosshair}
  #pad.off{pointer-events:none}

  .tip{text-align:center;font-size:11.5px;opacity:.55;min-height:16px;letter-spacing:.03em}
  .tip.hot{opacity:1;color:var(--neon);font-weight:bold}

  button.btn{font-family:inherit;font-weight:bold;cursor:pointer;border:none;border-radius:999px;transition:transform .07s, box-shadow .07s, background .25s, color .25s, opacity .25s}
  button.btn:active{transform:translateY(4px)}
  /* 見切りボタン：ふだんは控えめ、大あたりが消えたら光る */
  #btnSkip{
    width:100%;padding:13px;font-size:16px;
    background:rgba(234,246,238,.09);color:rgba(234,246,238,.62);
    box-shadow:0 4px 0 rgba(0,0,0,.28);
  }
  #btnSkip.hot{background:var(--neon);color:#26102a;box-shadow:0 5px 0 #b03562, 0 0 22px rgba(255,93,143,.5)}
  #btnSkip:active{box-shadow:0 0 0 rgba(0,0,0,.28)}
  #btnSound{
    position:fixed;top:11px;right:11px;z-index:60;width:40px;height:40px;font-size:17px;border-radius:50%;
    background:rgba(234,246,238,.1);color:var(--text);border:1.5px solid rgba(234,246,238,.24);box-shadow:none;
  }

  /* ---- 演出 ---- */
  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
  .chip{position:absolute;border-radius:1px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
  .spark{position:absolute;bottom:-20px;animation:shoot 1.3s cubic-bezier(.12,.65,.35,1) forwards}
  @keyframes shoot{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    70%{opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) rotate(640deg);opacity:0}
  }
  .dust{position:absolute;width:5px;height:5px;border-radius:1px;animation:dustGo .62s ease-out forwards}
  @keyframes dustGo{
    0%{transform:translate(0,0) rotate(0);opacity:.95}
    100%{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}
  }

  #flash{position:fixed;inset:0;z-index:93;background:#fff;opacity:0;pointer-events:none}
  #flash.go{animation:flashOut .5s ease-out forwards}
  @keyframes flashOut{0%{opacity:.72}100%{opacity:0}}

  .wiggle{animation:wig .42s ease-in-out 2}
  .wiggle3{animation:wig .42s ease-in-out 3}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.2deg)}75%{transform:rotate(2.2deg)}}

  #toast{
    position:fixed;left:50%;top:15%;transform:translateX(-50%);
    z-index:94;display:none;white-space:nowrap;
    background:rgba(234,246,238,.95);color:#0a3227;
    border-radius:999px;padding:8px 22px;font-size:18px;font-weight:bold;
    box-shadow:0 0 24px rgba(234,246,238,.4);
  }
  #toast.show{display:block;animation:toastIn 1.3s ease-out forwards}
  @keyframes toastIn{
    0%{transform:translateX(-50%) scale(.4);opacity:0}
    18%{transform:translateX(-50%) scale(1.12);opacity:1}
    30%,78%{transform:translateX(-50%) scale(1);opacity:1}
    100%{transform:translateX(-50%) translateY(-26px) scale(.9);opacity:0}
  }

  #banner{position:fixed;inset:0;z-index:95;display:none;align-items:flex-start;justify-content:center;padding-top:13vh;pointer-events:none}
  #banner.show{display:flex}
  .bnr{background:var(--neon);border-radius:22px;padding:19px 34px;text-align:center;box-shadow:0 0 60px rgba(255,93,143,.85);animation:burstIn .5s cubic-bezier(.2,1.8,.4,1)}
  @keyframes burstIn{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
  .bnr .big{font-size:42px;font-weight:bold;color:#fff;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.22)}
  .bnr .small{font-size:14px;font-weight:bold;margin-top:6px;color:#40122a}

  /* ---- 結果 ---- */
  #result{position:fixed;inset:0;z-index:97;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(4,32,26,.93);backdrop-filter:blur(5px)}
  #result.show{display:flex;animation:resIn .3s ease-out}
  @keyframes resIn{from{opacity:0}to{opacity:1}}
  .resBox{text-align:center;max-width:330px;width:100%}
  .resTtl{font-size:29px;font-weight:bold;color:var(--neon);text-shadow:0 0 18px rgba(255,93,143,.6)}
  .resScore{font-size:72px;font-weight:bold;line-height:1;margin:10px 0 2px;font-variant-numeric:tabular-nums}
  .resUnit{font-size:14px;opacity:.6;letter-spacing:.1em}
  .resSub{font-size:13px;opacity:.85;margin-top:16px;line-height:1.9;background:rgba(234,246,238,.07);border-radius:14px;padding:12px 14px}
  .resSub em{font-style:normal;color:var(--neon);font-weight:bold}
  #btnAgain{width:100%;margin-top:18px;padding:17px;font-size:20px;background:var(--neon);color:#26102a;box-shadow:0 5px 0 #b03562, 0 0 22px rgba(255,93,143,.45)}

  @media(max-height:680px){
    h1{font-size:21px}
    .cell{font-size:32px}
    .resScore{font-size:56px}
    #btnSkip{padding:11px;font-size:15px}
  }
</style>
</head>
<body>

<button class="btn" id="btnSound" aria-label="おと">🔇</button>

<div class="app" id="app">
  <header>
    <h1>よるの けずりくじ</h1>
    <p class="sub">1マスずつ こすって けずる ／ 3つ そろえば おおあたり</p>
  </header>

  <div class="hud">
    <div><i>のこり</i><b id="tTime">30</b></div>
    <div><i>とくてん</i><b id="tScore">0</b></div>
    <div><i>けずったまい</i><b id="tCards">0</b></div>
  </div>

  <div class="ticket" id="ticket">
    <div class="tHead"><span>YORU NO KUJI</span><b id="tNo">No.001</b></div>
    <div class="cells" id="cells">
      <div class="cell"><span></span><canvas></canvas></div>
      <div class="cell"><span></span><canvas></canvas></div>
      <div class="cell"><span></span><canvas></canvas></div>
      <div id="pad"></div>
    </div>
  </div>

  <p class="tip" id="tip">ゆびで こすってね</p>
  <button class="btn" id="btnSkip">みきって つぎへ ▸</button>
</div>

<div id="fx"></div>
<div id="flash"></div>
<div id="toast"></div>
<div id="banner"><div class="bnr"><div class="big" id="bnrBig"></div><div class="small" id="bnrSmall"></div></div></div>

<div id="result">
  <div class="resBox">
    <div class="resTtl" id="resTtl">おしまい！</div>
    <div class="resScore" id="resScore">0</div>
    <div class="resUnit">て ん</div>
    <div class="resSub" id="resSub"></div>
    <button class="btn" id="btnAgain">もういちど けずる</button>
  </div>
</div>

<script>
/* ================= 演出エンジン ================= */
const fx      = document.getElementById('fx');
const flashEl = document.getElementById('flash');
const toastEl = document.getElementById('toast');
const bannerEl= document.getElementById('banner');
const appEl   = document.getElementById('app');

const SILVER = ['#e6efea','#c3d2ca','#9fb2a8','#f2f7f4'];
const PARTY  = ['#ff5d8f','#e6efea','#ffd9e5','#c3d2ca','#ff8fb2'];

function makeChip(colors, w, h){
  const c = document.createElement('div');
  c.className = 'chip';
  c.style.width = w + 'px'; c.style.height = h + 'px';
  c.style.background = colors[(Math.random()*colors.length)|0];
  return c;
}
function rain(n, colors){
  for(let i=0;i<n;i++){
    const c = makeChip(colors, 3+Math.random()*5, 6+Math.random()*9);
    c.style.left = (Math.random()*100) + '%';
    c.style.animationDelay = (Math.random()*0.8) + 's';
    c.style.animationDuration = (1.5+Math.random()*1.4) + 's';
    c.style.opacity = 0.55 + Math.random()*0.45;
    fx.appendChild(c);
    setTimeout(()=>c.remove(), 4200);
  }
}
function burst(n, colors){
  for(let i=0;i<n;i++){
    const s = makeChip(colors, 4+Math.random()*5, 7+Math.random()*10);
    s.className = 'spark'; s.style.borderRadius = '1px';
    const fromLeft = i % 2 === 0;
    s.style.left = fromLeft ? '7%' : 'auto';
    s.style.right = fromLeft ? 'auto' : '7%';
    s.style.setProperty('--tx', ((fromLeft?1:-1)*(60+Math.random()*250)) + 'px');
    s.style.setProperty('--ty', (-(210+Math.random()*330)) + 'px');
    s.style.animationDelay = (Math.random()*0.25) + 's';
    fx.appendChild(s);
    setTimeout(()=>s.remove(), 1900);
  }
}
function dust(x, y, n){
  for(let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.style.background = SILVER[(Math.random()*SILVER.length)|0];
    const a = Math.random()*Math.PI*2, r = 18+Math.random()*46;
    d.style.setProperty('--dx', (Math.cos(a)*r) + 'px');
    d.style.setProperty('--dy', (Math.sin(a)*r + 26) + 'px');
    fx.appendChild(d);
    setTimeout(()=>d.remove(), 700);
  }
}
function doFlash(){ flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
function shake(el, cls){
  const c = cls || 'wiggle';
  el.classList.remove('wiggle','wiggle3'); void el.offsetWidth; el.classList.add(c);
  setTimeout(()=>el.classList.remove(c), 1400);
}
function miniCelebrate(text){
  rain(40, SILVER); burst(18, SILVER); shake(appEl,'wiggle');
  toastEl.textContent = text;
  toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1400);
}
/* 大演出：0.5秒間隔で4波 */
function celebrate(bigText, smallText){
  doFlash(); rain(70, PARTY); burst(34, PARTY); shake(appEl,'wiggle3');
  document.getElementById('bnrBig').textContent = bigText;
  document.getElementById('bnrSmall').textContent = smallText || '';
  bannerEl.classList.add('show');
  setTimeout(()=>{ rain(50, SILVER); burst(24, PARTY); }, 500);
  setTimeout(()=>{ doFlash(); rain(50, PARTY); shake(appEl,'wiggle'); }, 1000);
  setTimeout(()=>{ rain(40, SILVER); burst(20, SILVER); }, 1500);
  setTimeout(()=>bannerEl.classList.remove('show'), 2000);
}

/* ================= おと ================= */
let actx=null, master=null, bgmGain=null, sfxGain=null;
let soundOn=false, bgmTimer=null, bgmStep=0, scratchNode=null, scratchGain=null, noiseBuf=null;

function initAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
  bgmGain = actx.createGain(); bgmGain.gain.value = 0.30; bgmGain.connect(master);
  sfxGain = actx.createGain(); sfxGain.gain.value = 1.0;  sfxGain.connect(master);
  const len = actx.sampleRate * 2;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = Math.random()*2-1;
}
function startScratchNoise(){
  if(!actx || !soundOn || scratchNode) return;
  scratchNode = actx.createBufferSource();
  scratchNode.buffer = noiseBuf; scratchNode.loop = true;
  const bp = actx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=0.9;
  scratchGain = actx.createGain(); scratchGain.gain.value = 0;
  scratchNode.connect(bp); bp.connect(scratchGain); scratchGain.connect(sfxGain);
  scratchNode.start();
}
function scratchOn(){ if(!actx||!soundOn) return; startScratchNoise(); if(scratchGain) scratchGain.gain.setTargetAtTime(0.10, actx.currentTime, 0.02); }
function scratchOff(){ if(scratchGain && actx) scratchGain.gain.setTargetAtTime(0, actx.currentTime, 0.05); }
function stopScratchNoise(){
  try{ if(scratchNode){ scratchNode.stop(); scratchNode.disconnect(); } }catch(e){}
  scratchNode=null; scratchGain=null;
}
function tone(freq, dur, type, vol, delay){
  if(!actx || !soundOn) return;
  const t = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.22, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+dur+0.03);
}
function kick(delay){
  if(!actx || !soundOn) return;
  const t = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(52,t+0.13);
  g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.24);
}
function sfxOpen(n){ tone(660 + n*180, 0.08, 'triangle', 0.15); }
function sfxMiss(){ tone(300,0.13,'triangle',0.13); tone(230,0.15,'triangle',0.11,0.09); }
function sfxSmall(){ tone(700,0.1,'square',0.16); tone(1050,0.14,'square',0.16,0.09); }
function sfxSkip(){ tone(420,0.07,'triangle',0.12); tone(330,0.09,'triangle',0.10,0.06); }
function sfxBig(){
  [0,0.09,0.18,0.27,0.38,0.5].forEach((d,i)=>tone([660,880,1100,1320,1760,2200][i],0.2,'square',0.2,d));
  kick(0); kick(0.25); kick(0.5);
}
const BGM_BASS = [98.00,110.00,82.41,87.31];
const BGM_MEL  = [392.00,440.00,329.63,349.23];
function bgmTick(){
  if(!actx || !soundOn) return;
  const bar = (bgmStep>>2) % 4, beat = bgmStep % 4, t = actx.currentTime;
  if(beat===0 || beat===2){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(BGM_BASS[bar],t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.30,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
    o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+0.46);
  }
  if(beat===1 || beat===3){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(BGM_MEL[bar]*(beat===3?1.5:1),t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+0.34);
  }
  if(noiseBuf){
    const s=actx.createBufferSource(); s.buffer=noiseBuf;
    const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7400;
    const g=actx.createGain(); g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    s.connect(hp); hp.connect(g); g.connect(bgmGain); s.start(t); s.stop(t+0.06);
  }
  bgmStep++;
}
function startBgm(){ if(!actx||!soundOn||bgmTimer) return; bgmStep=0; bgmTick(); bgmTimer=setInterval(bgmTick,300); }
function stopBgm(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } stopScratchNoise(); }

const btnSound = document.getElementById('btnSound');
btnSound.addEventListener('click', ()=>{
  initAudio(); if(!actx) return;
  soundOn = !soundOn;
  btnSound.textContent = soundOn ? '🔊' : '🔇';
  if(soundOn){ if(actx.state==='suspended') actx.resume(); if(started && playing) startBgm(); }
  else stopBgm();
});
function silence(){ stopBgm(); if(actx && actx.state==='running'){ try{ actx.suspend(); }catch(e){} } }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) silence(); });
window.addEventListener('pagehide', silence);
window.addEventListener('blur', silence);

/* ================= ゲーム本体 ================= */
const SYMBOLS     = ['🌙','⭐️','🍬','🍀','💎','🔔'];
const TIME_LIMIT  = 30;    // びょう
const CLEAR_RATIO = 0.45;  // 1マスがめくれる削り率
const BRUSH_R     = 24;    // ゆびの太さ(px)
const G           = 14;    // 1マスの削れ判定 14x14
const PT_BIG      = 200;   // 3つそろい
const PT_SMALL    = 10;    // 2つそろい

const cellEls = Array.from(document.querySelectorAll('#cells .cell'));
const pad     = document.getElementById('pad');
const ticket  = document.getElementById('ticket');
const cellsEl = document.getElementById('cells');
const tTime   = document.getElementById('tTime');
const tScore  = document.getElementById('tScore');
const tCards  = document.getElementById('tCards');
const tNo     = document.getElementById('tNo');
const tip     = document.getElementById('tip');
const btnSkip = document.getElementById('btnSkip');
const resultEl= document.getElementById('result');

const cells = cellEls.map(el => ({
  el, span: el.querySelector('span'), cv: el.querySelector('canvas'),
  ctx: el.querySelector('canvas').getContext('2d'),
  grid: null, cleared: 0, open: false, sym: ''
}));

let playing=false, started=false, judging=false;
let timeLeft=TIME_LIMIT, score=0, cards=0, bigWins=0, smallWins=0, skipped=0;
let drawing=false, lastPt=null, timerId=null, dustCd=0;

/* --- 銀箔 --- */
function paintCell(c){
  const r = c.el.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  c.cv.width = Math.round(w*dpr); c.cv.height = Math.round(h*dpr);
  const x = c.ctx;
  x.setTransform(dpr,0,0,dpr,0,0);
  x.globalCompositeOperation = 'source-over';
  x.clearRect(0,0,w,h);

  const g = x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#dfe8e3'); g.addColorStop(0.28,'#a9b9b0');
  g.addColorStop(0.5,'#eef3f0'); g.addColorStop(0.72,'#9aaba2'); g.addColorStop(1,'#cdd9d3');
  x.fillStyle = g; x.fillRect(0,0,w,h);

  x.strokeStyle = 'rgba(255,255,255,0.22)'; x.lineWidth = 1;
  for(let i=-h;i<w;i+=7){ x.beginPath(); x.moveTo(i,h); x.lineTo(i+h,0); x.stroke(); }
  x.strokeStyle = 'rgba(60,80,72,0.10)';
  for(let i=-h;i<w;i+=13){ x.beginPath(); x.moveTo(i,0); x.lineTo(i+h,h); x.stroke(); }

  x.fillStyle = 'rgba(70,92,84,0.30)';
  x.font = 'bold ' + Math.round(h*0.40) + 'px "Hiragino Maru Gothic ProN", sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText('?', w/2, h/2);

  x.globalCompositeOperation = 'destination-out';
  c.grid = new Uint8Array(G*G); c.cleared = 0; c.open = false;
  c.el.classList.remove('open','hit');
}

/* --- 削る --- */
function scratchCell(c, lx, ly){
  const r = c.el.getBoundingClientRect();
  c.ctx.beginPath(); c.ctx.arc(lx, ly, BRUSH_R, 0, Math.PI*2); c.ctx.fill();
  const cw = r.width/G, ch = r.height/G;
  const i0 = Math.max(0, Math.floor((lx-BRUSH_R)/cw)), i1 = Math.min(G-1, Math.floor((lx+BRUSH_R)/cw));
  const j0 = Math.max(0, Math.floor((ly-BRUSH_R)/ch)), j1 = Math.min(G-1, Math.floor((ly+BRUSH_R)/ch));
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const k = j*G+i; if(c.grid[k]) continue;
    const dx = (i+0.5)*cw - lx, dy = (j+0.5)*ch - ly;
    if(dx*dx+dy*dy <= BRUSH_R*BRUSH_R){ c.grid[k]=1; c.cleared++; }
  }
  if(c.cleared/(G*G) >= CLEAR_RATIO) openCell(c);
}

/* 画面座標を、そこにあるマスへ振り分ける */
function scratchAt(px, py){
  for(const c of cells){
    if(c.open) continue;
    const r = c.el.getBoundingClientRect();
    if(px >= r.left && px <= r.right && py >= r.top && py <= r.bottom){
      scratchCell(c, px - r.left, py - r.top);
      return;
    }
  }
}

function openCell(c){
  if(c.open) return;
  c.open = true;
  c.el.classList.add('open');
  sfxOpen(cells.filter(x=>x.open).length);
  evaluate();
}

/* --- そのくじの状態を見る --- */
function openedSyms(){ return cells.filter(c=>c.open).map(c=>c.sym); }
function bestOf(list){
  const cnt = {}; list.forEach(s => cnt[s] = (cnt[s]||0)+1);
  return list.length ? Math.max.apply(null, Object.values(cnt)) : 0;
}
/* 3マス目を見る前に、大あたりの目が残っているか */
function bigStillPossible(){
  const o = openedSyms();
  if(o.length <= 1) return true;
  return bestOf(o) === o.length;   // 開いたものが全部同じならまだ狙える
}

function evaluate(){
  if(judging) return;
  const o = openedSyms();
  if(o.length === 3){ resolve(false); return; }
  if(!bigStillPossible()){
    // 大あたりが消えた：枠を灰色に、ボタンを光らせ、文言も変える
    ticket.classList.add('dead');
    btnSkip.classList.add('hot');
    tip.classList.add('hot');
    tip.textContent = 'おおあたりは きえた。みきる？';
  }
}

/* --- けっか --- */
function resolve(bySkip){
  if(judging) return;
  judging = true; drawing = false; scratchOff();
  pad.classList.add('off');

  const o = openedSyms();
  const best = bestOf(o);
  cards++; tCards.textContent = cards;

  let kind = 'lose';
  if(o.length === 3 && best === 3) kind = 'big';
  else if(best === 2) kind = 'small';

  if(kind === 'big'){
    bigWins++; score += PT_BIG; tScore.textContent = score;
    cells.forEach(c=>c.el.classList.add('hit'));
    tip.classList.remove('hot'); tip.textContent = 'おおあたり！';
    sfxBig(); celebrate('おおあたり！', '3つ そろった！ ＋' + PT_BIG + 'てん');
  } else if(kind === 'small'){
    smallWins++; score += PT_SMALL; tScore.textContent = score;
    const cnt = {}; o.forEach(s=>cnt[s]=(cnt[s]||0)+1);
    const win = Object.keys(cnt).find(k=>cnt[k]===2);
    cells.forEach(c=>{ if(c.open && c.sym===win) c.el.classList.add('hit'); });
    tip.classList.remove('hot'); tip.textContent = 'おしい！ ＋' + PT_SMALL + 'てん';
    sfxSmall(); miniCelebrate('おしい！ ＋' + PT_SMALL);
  } else {
    tip.classList.remove('hot');
    if(bySkip){ skipped++; tip.textContent = 'みきった！ つぎいこう'; sfxSkip(); }
    else { tip.textContent = 'はずれ… つぎいこう'; sfxMiss(); }
  }

  const wait = kind==='big' ? 1900 : (kind==='small' ? 900 : (bySkip ? 250 : 500));
  setTimeout(()=>{ if(playing) nextCard(); }, wait);
}

btnSkip.addEventListener('click', ()=>{
  if(!playing || judging) return;
  if(!started) return;      // 1マスも削っていないうちは押せても意味がないので無視
  resolve(true);
});

/* --- つぎのくじ --- */
function deal(){
  cells.forEach(c=>{
    c.sym = SYMBOLS[(Math.random()*SYMBOLS.length)|0];
    c.span.textContent = c.sym;
  });
}
function nextCard(){
  ticket.classList.add('out');
  setTimeout(()=>{
    deal();
    ticket.classList.remove('out','dead');
    btnSkip.classList.remove('hot');
    ticket.classList.add('in'); void ticket.offsetWidth;
    cells.forEach(paintCell);
    ticket.classList.remove('in');
    tNo.textContent = 'No.' + String(cards+1).padStart(3,'0');
    pad.classList.remove('off');
    judging = false;
    if(playing){ tip.classList.remove('hot'); tip.textContent = '1マスずつ けずってね'; }
  }, 320);
}

/* --- 入力 --- */
function onDown(e){
  if(!playing || judging) return;
  e.preventDefault();
  if(!started) startGame();
  drawing = true;
  lastPt = { x:e.clientX, y:e.clientY };
  scratchAt(e.clientX, e.clientY);
  dust(e.clientX, e.clientY, 6);
  scratchOn();
  try{ pad.setPointerCapture(e.pointerId); }catch(err){}
}
function onMove(e){
  if(!drawing || !playing || judging) return;
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  if(lastPt){
    const dx = x-lastPt.x, dy = y-lastPt.y;
    const steps = Math.max(1, Math.ceil(Math.hypot(dx,dy)/9));
    for(let i=1;i<=steps;i++) scratchAt(lastPt.x + dx*i/steps, lastPt.y + dy*i/steps);
  }
  lastPt = { x, y };
  const now = performance.now();
  if(now - dustCd > 34){ dustCd = now; dust(x, y, 3); }
}
function onUp(){ drawing = false; lastPt = null; scratchOff(); }
pad.addEventListener('pointerdown', onDown);
pad.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

/* --- 時間 --- */
function startGame(){
  started = true;
  if(soundOn) startBgm();
  timerId = setInterval(()=>{
    timeLeft--;
    tTime.textContent = Math.max(0, timeLeft);
    if(timeLeft <= 8) tTime.classList.add('low');
    if(timeLeft <= 0) endGame();
  }, 1000);
}

function endGame(){
  playing = false;
  if(timerId){ clearInterval(timerId); timerId=null; }
  stopBgm(); drawing = false; pad.classList.add('off');

  document.getElementById('resScore').textContent = score;
  document.getElementById('resTtl').textContent =
    bigWins>0 ? 'おおあたり ' + bigWins + 'かい！' : (score>0 ? 'おしかった！' : 'ぜんぶ はずれ…');

  let hint;
  if(bigWins > 0) hint = 'つよい。おおあたりは <em>36まいに1まい</em> だよ';
  else if(skipped >= 3) hint = 'みきりが うまい。そのちょうしで <em>まい数</em> をかせごう';
  else hint = 'ヒント：<em>2つ ちがったら</em> おおあたりは でない。みきって つぎへ';

  document.getElementById('resSub').innerHTML =
    'けずったくじ <em>' + cards + 'まい</em> ／ おおあたり <em>' + bigWins + '</em> ／ おしい <em>' + smallWins +
    '</em> ／ みきり <em>' + skipped + '</em><br>' + hint;

  resultEl.classList.add('show');
}

document.getElementById('btnAgain').addEventListener('click', ()=>{
  resultEl.classList.remove('show');
  reset();
});

function reset(){
  playing=true; started=false; judging=false; drawing=false;
  timeLeft=TIME_LIMIT; score=0; cards=0; bigWins=0; smallWins=0; skipped=0;
  tTime.textContent = TIME_LIMIT; tTime.classList.remove('low');
  tScore.textContent='0'; tCards.textContent='0'; tNo.textContent='No.001';
  tip.classList.remove('hot'); tip.textContent='ゆびで こすってね';
  ticket.classList.remove('dead','out','in');
  btnSkip.classList.remove('hot');
  pad.classList.remove('off');
  deal(); cells.forEach(paintCell);
  if(soundOn && actx && actx.state==='suspended') actx.resume();
}

window.addEventListener('resize', ()=>{
  if(!playing || judging) return;
  cells.forEach(c=>{
    if(c.open) return;
    const saved = c.grid, savedN = c.cleared;
    paintCell(c);
    if(saved){
      c.grid = saved; c.cleared = savedN;
      const r = c.el.getBoundingClientRect();
      const cw = r.width/G, ch = r.height/G;
      for(let j=0;j<G;j++) for(let i=0;i<G;i++){
        if(c.grid[j*G+i]){
          c.ctx.beginPath();
          c.ctx.arc((i+0.5)*cw,(j+0.5)*ch, Math.hypot(cw,ch)*0.62, 0, Math.PI*2);
          c.ctx.fill();
        }
      }
    }
  });
});

reset();
</script>
