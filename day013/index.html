<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>わなげ｜Chuppy Games Day 013</title>
<style>
  :root{
    --sky1:#bfe6f5; --sky2:#eaf6ff; --ground:#e8d9b3;
    --ink:#1c3a52; --accent:#e8432f; --cream:#fff6e4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#8fd3ec;
    color:var(--ink);
    padding:18px;
    overflow:hidden;
    position:relative;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background:linear-gradient(180deg,#7fc9ea 0%,#bfe6f5 45%,#eaf6ff 78%,#f3e6c4 100%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 82% 10%, rgba(255,255,255,.55) 0%, transparent 40%);
  }

  .app{
    position:relative; z-index:2;
    width:100%; max-width:440px;
    background:var(--cream);
    border:5px solid var(--ink);
    border-radius:26px;
    padding:16px 16px 18px;
    box-shadow:10px 10px 0 rgba(20,40,60,.28);
  }

  h1{
    font-size:26px; text-align:center; letter-spacing:3px;
    color:var(--accent);
    -webkit-text-stroke:1.2px var(--ink);
    text-shadow:0 3px 0 #ffd9a8;
    margin-bottom:2px;
  }
  .sub{ text-align:center; font-size:11px; opacity:.62; margin-bottom:10px; font-weight:bold; }

  .hud{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px; }
  .hud-item{
    background:var(--sky2); border:3px solid var(--ink); border-radius:13px;
    padding:5px 12px; text-align:center; min-width:74px;
  }
  .hud-label{ display:block; font-size:8.5px; letter-spacing:.14em; opacity:.6; margin-bottom:1px; }
  .hud-val{ font-weight:bold; font-size:17px; }
  .rings-row{ display:flex; gap:4px; justify-content:center; margin:2px 0 10px; }
  .ring-dot{
    width:15px; height:15px; border-radius:50%;
    border:3px solid var(--ink);
    background:transparent;
    transition:background .25s, opacity .25s, transform .25s;
  }
  .ring-dot.used-hit{ background:var(--accent); }
  .ring-dot.used-miss{ background:#cdd8de; opacity:.55; transform:scale(.82); }

  /* ---- フィールド ---- */
  .field{
    position:relative; height:236px; border-radius:16px; overflow:hidden;
    border:3px solid var(--ink);
    background:linear-gradient(180deg,#8fd3ec 0%,#cdeefa 38%,#f3e9c9 72%,#e8d9b3 100%);
  }
  .cloud{ position:absolute; background:#fff; border-radius:50%; opacity:.85; }
  .torii{ position:absolute; left:50%; top:18%; transform:translateX(-50%); width:96px; height:54px; opacity:.5; }
  .torii .bar{ position:absolute; left:0; right:0; height:7px; background:var(--accent); border-radius:2px; }
  .torii .bar1{ top:0; }
  .torii .bar2{ top:12px; height:5px; }
  .torii .leg{ position:absolute; top:10px; width:7px; height:44px; background:var(--accent); border-radius:2px; }
  .torii .leg1{ left:14px; }
  .torii .leg2{ right:14px; }
  .pine{ position:absolute; bottom:38%; width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-bottom:26px solid #4f8f6e; opacity:.55; }

  .peg{ position:absolute; left:50%; transform:translate(-50%,-100%); text-align:center; }
  .peg .pole{ width:5px; background:var(--ink); margin:0 auto; border-radius:2px; }
  .peg .badge{
    width:30px; height:30px; border-radius:50%; background:var(--cream);
    border:3px solid var(--ink); display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; color:var(--accent); position:relative; z-index:2;
  }
  .peg .ringmark{
    position:absolute; left:50%; top:0; width:40px; height:40px; margin-left:-20px; margin-top:-5px;
    border:5px solid var(--accent); border-radius:50%; opacity:0; transform:scale(1.6) rotate(0deg);
    transition:none; pointer-events:none;
  }
  .peg.landed .ringmark{ opacity:1; transform:scale(1) rotate(-12deg); transition:transform .22s cubic-bezier(.2,1.4,.4,1), opacity .1s; }

  .thrower{
    position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
    width:34px; height:40px;
  }
  .thrower .head{ width:16px; height:16px; border-radius:50%; background:var(--ink); margin:0 auto; }
  .thrower .body{ width:22px; height:20px; background:var(--accent); border-radius:8px 8px 4px 4px; margin:2px auto 0; }

  .ring-fly{
    position:absolute; left:50%; top:88%; width:26px; height:26px; margin-left:-13px; margin-top:-13px;
    border:5px solid var(--accent); border-radius:50%; background:transparent;
    opacity:0; pointer-events:none; z-index:5;
  }
  .dust{
    position:absolute; width:8px; height:8px; border-radius:50%; background:var(--ink); opacity:.5;
    pointer-events:none; z-index:4; animation:dustPop .5s ease-out forwards;
  }
  @keyframes dustPop{ 0%{ transform:translate(0,0) scale(1); opacity:.55; } 100%{ transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; } }

  /* ---- ゲージ ---- */
  .gaugeWrap{ margin-top:12px; }
  .gauge{
    position:relative; height:26px; border:3px solid var(--ink); border-radius:13px;
    background:var(--sky2); overflow:hidden;
  }
  .zone{ position:absolute; top:0; bottom:0; background:var(--accent); }
  .zone.near{ opacity:.22; }
  .zone.mid{ opacity:.48; }
  .zone.far{ opacity:.82; }
  .marker{
    position:absolute; top:-3px; bottom:-3px; width:5px; margin-left:-2.5px;
    background:var(--ink); border-radius:3px; left:0%;
  }
  .gaugeLabels{ display:flex; justify-content:space-between; font-size:8.5px; opacity:.55; margin-top:3px; font-weight:bold; letter-spacing:.06em; }

  button.throwBtn{
    width:100%; margin-top:12px; padding:13px; font-size:17px; font-weight:bold;
    font-family:inherit; color:var(--cream);
    background:var(--accent); border:4px solid var(--ink); border-radius:16px;
    box-shadow:0 6px 0 var(--ink);
    cursor:pointer; transition:transform .06s, box-shadow .06s;
  }
  button.throwBtn:active:not(:disabled){ transform:translateY(6px); box-shadow:0 0 0 var(--ink); }
  button.throwBtn:disabled{ opacity:.5; cursor:default; }

  .muteBtn{
    position:absolute; right:12px; top:12px; z-index:3;
    width:30px; height:30px; border-radius:50%; border:3px solid var(--ink);
    background:var(--cream); font-size:13px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  /* ===== 演出エンジン ===== */
  #fx{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:90; }
  .petal{ position:absolute; top:-30px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); } }
  .spark{ position:absolute; animation:shoot 1.1s cubic-bezier(.12,.65,.35,1) forwards; }
  @keyframes shoot{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:translate(var(--tx),var(--ty)) rotate(500deg); opacity:0; }
  }
  #flashEl{ position:fixed; inset:0; z-index:93; background:#fff; opacity:0; pointer-events:none; }
  #flashEl.go{ animation:flashOut .45s ease-out forwards; }
  @keyframes flashOut{ 0%{ opacity:.7; } 100%{ opacity:0; } }
  .wiggle{ animation:wig .4s ease-in-out 2; }
  @keyframes wig{ 0%,100%{ transform:rotate(0deg); } 25%{ transform:rotate(-2deg); } 75%{ transform:rotate(2deg); } }
  #toastEl{
    position:fixed; left:50%; top:18%; transform:translateX(-50%);
    z-index:94; display:none;
    background:var(--accent); color:#fff;
    border:4px solid var(--ink); border-radius:999px;
    padding:8px 20px; font-size:17px; font-weight:bold;
    box-shadow:6px 6px 0 rgba(20,40,60,.4);
  }
  #toastEl.show{ display:block; animation:toastIn 1.2s ease-out forwards; }
  @keyframes toastIn{
    0%{ transform:translateX(-50%) scale(.4); opacity:0; }
    18%{ transform:translateX(-50%) scale(1.1); opacity:1; }
    30%,80%{ transform:translateX(-50%) scale(1); opacity:1; }
    100%{ transform:translateX(-50%) translateY(-22px) scale(.9); opacity:0; }
  }
  #bannerEl{ position:fixed; inset:0; z-index:95; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #bannerEl.show{ display:flex; }
  .bnr{
    background:var(--cream); border:6px solid var(--ink); border-radius:22px;
    padding:20px 30px; text-align:center;
    box-shadow:12px 12px 0 rgba(20,40,60,.4);
    animation:burstIn .5s cubic-bezier(.2,1.8,.4,1);
  }
  @keyframes burstIn{ 0%{ transform:scale(.3) rotate(-10deg); opacity:0; } 100%{ transform:scale(1) rotate(-3deg); opacity:1; } }
  .bnr .big{ font-size:36px; font-weight:bold; color:var(--accent); -webkit-text-stroke:1.6px var(--ink); line-height:1.15; }
  .bnr .small{ font-size:13px; font-weight:bold; margin-top:6px; }

  /* ---- 結果画面 ---- */
  #resultEl{
    position:fixed; inset:0; z-index:96; display:none; align-items:center; justify-content:center;
    background:rgba(28,58,82,.62); padding:20px;
  }
  #resultEl.show{ display:flex; }
  .resultCard{
    width:100%; max-width:360px; background:var(--cream); border:5px solid var(--ink); border-radius:22px;
    padding:22px 20px; text-align:center; box-shadow:10px 10px 0 rgba(20,40,60,.4);
  }
  .resultCard .tier{ font-size:22px; font-weight:bold; color:var(--accent); -webkit-text-stroke:1px var(--ink); }
  .resultCard .scoreNum{ font-size:52px; font-weight:bold; margin:6px 0; }
  .resultCard .breakdown{ font-size:12px; opacity:.75; line-height:1.9; margin-bottom:10px; }
  .resultCard .hint{ font-size:11.5px; background:var(--sky2); border:2px solid var(--ink); border-radius:10px; padding:8px 10px; margin-bottom:14px; }
  .resultCard button{
    width:100%; padding:12px; font-size:16px; font-weight:bold; font-family:inherit; color:var(--cream);
    background:var(--accent); border:4px solid var(--ink); border-radius:14px; box-shadow:0 5px 0 var(--ink);
    cursor:pointer;
  }
  .resultCard button:active{ transform:translateY(5px); box-shadow:0 0 0 var(--ink); }
</style>
</head>
<body>

<div class="app">
  <button class="muteBtn" id="muteBtn">🔊</button>
  <h1>わ・な・げ</h1>
  <p class="sub">バーが たまに とまる。台をねらって タップ！</p>

  <div class="hud">
    <div class="hud-item"><span class="hud-label">スコア</span><span class="hud-val" id="scoreVal">0</span></div>
    <div class="hud-item"><span class="hud-label">のこり輪</span><span class="hud-val" id="ringsVal">5</span></div>
  </div>
  <div class="rings-row" id="ringsRow"></div>

  <div class="field" id="field">
    <div class="cloud" style="left:8%; top:10%; width:34px; height:14px;"></div>
    <div class="cloud" style="left:14%; top:6%; width:20px; height:12px;"></div>
    <div class="cloud" style="right:10%; top:22%; width:26px; height:11px;"></div>
    <div class="torii"><div class="bar bar1"></div><div class="bar bar2"></div><div class="leg leg1"></div><div class="leg leg2"></div></div>
    <div class="pine" style="left:4%;"></div>
    <div class="pine" style="right:6%; bottom:36%; transform:scale(.8);"></div>

    <div class="peg" id="pegNear" style="top:75.7%;">
      <div class="ringmark"></div>
      <div class="pole" style="height:30px;"></div>
      <div class="badge">10</div>
    </div>
    <div class="peg" id="pegMid" style="top:54.3%; transform:translate(-50%,-100%) scale(.70);">
      <div class="ringmark"></div>
      <div class="pole" style="height:26px;"></div>
      <div class="badge">30</div>
    </div>
    <div class="peg" id="pegFar" style="top:34.8%; transform:translate(-50%,-100%) scale(.55);">
      <div class="ringmark"></div>
      <div class="pole" style="height:22px;"></div>
      <div class="badge">50</div>
    </div>

    <div class="thrower"><div class="head"></div><div class="body"></div></div>
    <div class="ring-fly" id="ringFly"></div>
  </div>

  <div class="gaugeWrap">
    <div class="gauge" id="gauge">
      <div class="zone near" style="left:13%; width:18%;"></div>
      <div class="zone mid" style="left:49%; width:12%;"></div>
      <div class="zone far" style="left:81%; width:8%;"></div>
      <div class="marker" id="marker"></div>
    </div>
    <div class="gaugeLabels"><span>ちかく</span><span>まんなか</span><span>とおく</span></div>
  </div>

  <button class="throwBtn" id="throwBtn">とめる！</button>
</div>

<div id="fx"></div>
<div id="flashEl"></div>
<div id="toastEl"></div>
<div id="bannerEl"><div class="bnr"><div class="big" id="bnrBig"></div><div class="small" id="bnrSmall"></div></div></div>

<div id="resultEl">
  <div class="resultCard">
    <div class="tier" id="tierText">けっか</div>
    <div class="scoreNum" id="finalScore">0</div>
    <div class="breakdown" id="breakdownText"></div>
    <div class="hint" id="hintText" style="display:none;"></div>
    <button id="retryBtn">もういちど</button>
  </div>
</div>

<script>
/* ===== 演出エンジン ===== */
const fx = document.getElementById('fx');
const flashEl = document.getElementById('flashEl');
const toastEl = document.getElementById('toastEl');
const bannerEl = document.getElementById('bannerEl');
const app = document.querySelector('.app');
const PETALS = ['🎊','✨','🎊','🧧','✨'];

function petalRain(n, originXPercent){
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className='petal';
    p.textContent = PETALS[Math.floor(Math.random()*PETALS.length)];
    const left = originXPercent!=null ? Math.min(96,Math.max(4, originXPercent + (Math.random()*30-15))) : Math.random()*100;
    p.style.left = left+'%';
    p.style.fontSize = (14+Math.random()*18)+'px';
    p.style.animationDelay = (Math.random()*0.6)+'s';
    p.style.animationDuration = (1.1+Math.random()*1.0)+'s';
    fx.appendChild(p);
    setTimeout(()=>p.remove(), 3000);
  }
}
function burst(n, originXPercent, originYPercent){
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='spark';
    s.textContent = PETALS[Math.floor(Math.random()*PETALS.length)];
    s.style.left = (originXPercent!=null?originXPercent:50)+'%';
    s.style.top = (originYPercent!=null?originYPercent:50)+'%';
    s.style.fontSize=(14+Math.random()*16)+'px';
    const ang = Math.random()*Math.PI*2;
    const dist = 40+Math.random()*140;
    s.style.setProperty('--tx', Math.cos(ang)*dist+'px');
    s.style.setProperty('--ty', Math.sin(ang)*dist-40+'px');
    s.style.animationDelay=(Math.random()*0.2)+'s';
    fx.appendChild(s);
    setTimeout(()=>s.remove(),1600);
  }
}
function doFlash(){ flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
function shake(el){ el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); setTimeout(()=>el.classList.remove('wiggle'),900); }
function miniCelebrate(text, xPercent, yPercent){
  petalRain(36, xPercent); burst(18, xPercent, yPercent); shake(app);
  toastEl.textContent=text;
  toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'),1300);
}
function celebrate(bigText, smallText){
  doFlash(); shake(app);
  let wave=0;
  const iv=setInterval(()=>{
    petalRain(30); burst(16, 20+Math.random()*60, 30+Math.random()*40);
    wave++; if(wave>=4) clearInterval(iv);
  }, 500);
  petalRain(30); burst(16,50,40);
  document.getElementById('bnrBig').textContent=bigText;
  document.getElementById('bnrSmall').textContent=smallText||'';
  bannerEl.classList.add('show');
  setTimeout(()=>bannerEl.classList.remove('show'),1900);
}

/* ===== サウンド ===== */
let actx=null, muted=false, bgmGain=null, sfxGain=null;
function ensureAudio(){
  if(actx) return;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  bgmGain = actx.createGain(); bgmGain.gain.value=0.0; bgmGain.connect(actx.destination);
  sfxGain = actx.createGain(); sfxGain.gain.value=0.5; sfxGain.connect(actx.destination);
}
function tone(freq, dur, type, gainVal, when){
  if(muted || !actx) return;
  const t0 = actx.currentTime + (when||0);
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gainVal, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(g); g.connect(sfxGain);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxThrow(){ tone(520,0.14,'triangle',0.35,0); tone(680,0.1,'triangle',0.25,0.05); }
function sfxHit(pts){
  const base = pts>=50?880:pts>=30?740:600;
  tone(base,0.16,'square',0.3,0); tone(base*1.5,0.14,'triangle',0.22,0.06);
}
function sfxMiss(){ tone(150,0.22,'sine',0.3,0); }
function sfxWin(){
  [660,880,1040,1320].forEach((f,i)=>tone(f,0.22,'triangle',0.3,i*0.11));
}
let bgmStarted=false, bgmNodes=[];
function startBgm(){
  if(bgmStarted || muted) return;
  ensureAudio();
  bgmGain.gain.linearRampToValueAtTime(0.28, actx.currentTime+0.6);
  bgmStarted = true;
  const notes=[440,494,523,494];
  let i=0;
  bgmNodes.timer = setInterval(()=>{
    if(muted) return;
    const osc=actx.createOscillator(); const g=actx.createGain();
    osc.type='sine'; osc.frequency.value=notes[i%notes.length];
    g.gain.setValueAtTime(0,actx.currentTime);
    g.gain.linearRampToValueAtTime(0.2,actx.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.5);
    osc.connect(g); g.connect(bgmGain);
    osc.start(); osc.stop(actx.currentTime+0.55);
    i++;
  },900);
}
function stopBgm(){
  if(bgmNodes.timer) clearInterval(bgmNodes.timer);
  bgmStarted=false;
  if(bgmGain) bgmGain.gain.setTargetAtTime(0, (actx&&actx.currentTime)||0, 0.1);
  if(actx && actx.state==='running') actx.suspend();
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopBgm(); });
window.addEventListener('pagehide', stopBgm);
window.addEventListener('blur', stopBgm);

document.getElementById('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if(muted){ stopBgm(); } else { ensureAudio(); if(actx.state==='suspended') actx.resume(); startBgm(); }
});

/* ===== ゲーム本体 ===== */
const NEAR_MIN=13, NEAR_MAX=31, NEAR_PTS=10;
const MID_MIN=49, MID_MAX=61, MID_PTS=30;
const FAR_MIN=81, FAR_MAX=89, FAR_PTS=50;
const BIG_THRESHOLD=80;
const TOTAL_RINGS=5;
const PERIOD_MS=1600;

function zoneOf(v){
  if(v>=NEAR_MIN && v<=NEAR_MAX) return {pts:NEAR_PTS, name:'near'};
  if(v>=MID_MIN && v<=MID_MAX) return {pts:MID_PTS, name:'mid'};
  if(v>=FAR_MIN && v<=FAR_MAX) return {pts:FAR_PTS, name:'far'};
  return {pts:0, name:'miss'};
}
function pathTop(p){ return 90 - p*65; }
function pathScale(p){ return 1 - p*0.55; }

let ringsLeft=TOTAL_RINGS, score=0, hits={near:0,mid:0,far:0,miss:0};
let markerRAF=null, markerStart=0, running=false, bigShown=false;
const marker = document.getElementById('marker');
const gauge = document.getElementById('gauge');
const throwBtn = document.getElementById('throwBtn');
const ringFly = document.getElementById('ringFly');
const field = document.getElementById('field');
const ringsRow = document.getElementById('ringsRow');

function initRingsRow(){
  ringsRow.innerHTML='';
  for(let i=0;i<TOTAL_RINGS;i++){
    const d=document.createElement('div');
    d.className='ring-dot';
    d.id='ringdot-'+i;
    ringsRow.appendChild(d);
  }
}
initRingsRow();

function currentMarkerVal(ts){
  const t = ((ts - markerStart) % PERIOD_MS) / PERIOD_MS;
  return t<0.5 ? (t*2*100) : (100-(t-0.5)*2*100);
}
function tickMarker(ts){
  if(!running) return;
  const v = currentMarkerVal(ts);
  marker.style.left = v+'%';
  markerRAF = requestAnimationFrame(tickMarker);
}
function startMarker(){
  running = true;
  markerStart = performance.now();
  markerRAF = requestAnimationFrame(tickMarker);
}
function stopMarker(){
  running = false;
  if(markerRAF) cancelAnimationFrame(markerRAF);
}

function updateHud(){
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('ringsVal').textContent = ringsLeft;
}

function dustAt(xPercent,yPercent){
  for(let i=0;i<7;i++){
    const d=document.createElement('div');
    d.className='dust';
    d.style.left=xPercent+'%'; d.style.top=yPercent+'%';
    const ang=Math.random()*Math.PI*2, dist=14+Math.random()*20;
    d.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    d.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    field.appendChild(d);
    setTimeout(()=>d.remove(),550);
  }
}

function markRingDot(idx, hit){
  const d=document.getElementById('ringdot-'+idx);
  if(!d) return;
  d.classList.add(hit? 'used-hit':'used-miss');
}

function pegElFor(name){
  if(name==='near') return document.getElementById('pegNear');
  if(name==='mid') return document.getElementById('pegMid');
  if(name==='far') return document.getElementById('pegFar');
  return null;
}

function throwRing(){
  if(ringsLeft<=0) return;
  ensureAudio();
  if(actx.state==='suspended') actx.resume();
  startBgm();
  stopMarker();
  throwBtn.disabled = true;
  const v = currentMarkerVal(performance.now());
  const z = zoneOf(v);
  sfxThrow();

  const idx = TOTAL_RINGS - ringsLeft;
  const finalP = Math.min(1, Math.max(0, v/100));
  const dur = 620;
  const t0 = performance.now();
  ringFly.style.opacity = '1';

  function frame(now){
    let t = Math.min(1, (now-t0)/dur);
    const ease = 1-(1-t)*(1-t);
    const p = ease*finalP;
    const top = pathTop(p);
    const scale = pathScale(p);
    const hop = -60 * 4*t*(1-t);
    ringFly.style.top = top+'%';
    ringFly.style.transform = 'translate(-50%,-50%) translateY('+hop+'px) scale('+scale+')';
    if(t<1){ requestAnimationFrame(frame); }
    else { land(z, v, idx); }
  }
  requestAnimationFrame(frame);
}

function land(z, v, idx){
  ringsLeft--;
  const landTop = pathTop(finalPClamp(v));
  if(z.pts>0){
    score += z.pts;
    hits[z.name]++;
    ringFly.style.opacity='0';
    const peg = pegElFor(z.name);
    if(peg){ peg.classList.remove('landed'); void peg.offsetWidth; peg.classList.add('landed'); }
    sfxHit(z.pts);
    markRingDot(idx, true);
    miniCelebrate((z.pts)+'てん！', 50, landTop);
    if(!bigShown && score>=BIG_THRESHOLD){
      bigShown = true;
      sfxWin();
      setTimeout(()=>celebrate('だいせいこう！','わなげマスター！'), 250);
    }
  } else {
    hits.miss++;
    ringFly.style.opacity='0';
    sfxMiss();
    markRingDot(idx, false);
    dustAt(50, landTop);
  }
  updateHud();
  if(ringsLeft<=0){
    setTimeout(showResult, 700);
  } else {
    setTimeout(()=>{ throwBtn.disabled=false; startMarker(); }, 500);
  }
}
function finalPClamp(v){ return Math.min(1,Math.max(0,v/100)); }

throwBtn.addEventListener('click', throwRing);

function showResult(){
  const total = hits.near+hits.mid+hits.far;
  let tier, hint='', showHint=false;
  if(score>=BIG_THRESHOLD){ tier='だいせいこう！'; }
  else if(total>=1){ tier='そこそこ！'; }
  else { tier='ざんねん…'; showHint=true; hint='まずは「ちかく」の台をねらってみよう。バーが端に来たしゅんかんにタップ！'; }
  document.getElementById('tierText').textContent = tier;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('breakdownText').textContent =
    'ちかく×'+hits.near+' まんなか×'+hits.mid+' とおく×'+hits.far+' はずれ×'+hits.miss;
  const hintEl = document.getElementById('hintText');
  if(showHint){ hintEl.style.display='block'; hintEl.textContent=hint; } else { hintEl.style.display='none'; }
  document.getElementById('resultEl').classList.add('show');
}

document.getElementById('retryBtn').addEventListener('click', ()=>{
  ringsLeft=TOTAL_RINGS; score=0; hits={near:0,mid:0,far:0,miss:0}; bigShown=false;
  document.getElementById('resultEl').classList.remove('show');
  initRingsRow();
  updateHud();
  throwBtn.disabled=false;
  startMarker();
});

updateHud();
startMarker();
</script>
