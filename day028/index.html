<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ふえる スライム｜Chuppy Games Day 028</title>
<meta name="description" content="なべの中でスライムが増えていく。タップで割って、小さくして、消す。あふれる前にどこまでもつか。">
<style>
:root{
  --bg:#1d0a22;
  --pot1:#5d1649;
  --pot2:#2b0c2c;
  --cream:#ffe9d8;
  --lime:#b6ff3d;
  --fw:360; --fh:540;
  --sans:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(120% 80% at 50% 0%,#3a0f38 0%,var(--bg) 60%,#120515 100%);
  color:var(--cream);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#stage{
  position:relative;width:min(100vw,calc(100svh * 0.665),440px);
  display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;
}

/* ---- HUD ---- */
#hud{display:flex;align-items:center;gap:9px}
.pill{
  flex:1;background:rgba(255,233,216,.09);border:1px solid rgba(255,233,216,.22);
  border-radius:13px;padding:7px 11px 8px;
}
.pill i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.16em;opacity:.72}
.pill b{display:block;font-size:22px;font-weight:800;line-height:1.15;letter-spacing:.02em}
#scv{color:var(--lime)}
#nabewrap{flex:1.25}
#bar{height:10px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:6px}
#barin{height:100%;width:8%;border-radius:99px;background:var(--cream);transition:width .18s ease}
#barin.hot{background:var(--lime)}
#barin.max{animation:blink .32s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#snd{
  width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid rgba(255,233,216,.22);
  background:rgba(255,233,216,.09);color:var(--cream);font-size:17px;cursor:pointer;
}
#snd.off{opacity:.42}

/* ---- なべ ---- */
#pot{position:relative;width:100%;aspect-ratio:var(--fw)/var(--fh);border-radius:22px;overflow:hidden;
  box-shadow:0 16px 44px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,233,216,.16)}
#cv{display:block;width:100%;height:100%}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#flash{position:absolute;inset:0;pointer-events:none;background:var(--lime);opacity:0}
#flash.on{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
#pot.shake{animation:sh .32s ease-out}
#pot.shakeBig{animation:sh .3s ease-out 3}
@keyframes sh{
  0%{transform:translate(0,0)}20%{transform:translate(-7px,4px)}
  40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}
  80%{transform:translate(3px,3px)}100%{transform:translate(0,0)}
}

/* しずく(小演出の粒) */
.drop{
  position:absolute;left:0;top:0;width:var(--sz);height:var(--sz);border-radius:52% 48% 46% 54%;
  background:var(--c);opacity:0;will-change:transform,opacity;
  animation:drp var(--dur) cubic-bezier(.18,.7,.4,1) forwards;
}
@keyframes drp{
  0%{opacity:1;transform:translate(var(--x),var(--y)) scale(.3)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1.1) rotate(var(--rot))}
}

/* バナー */
#banner{
  position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;
  font-size:30px;font-weight:800;letter-spacing:.06em;opacity:0;
  color:var(--cream);text-shadow:0 0 18px rgba(182,255,61,.9),0 4px 18px rgba(0,0,0,.7);
}
#banner.go{animation:bn .95s cubic-bezier(.2,.9,.3,1)}
@keyframes bn{
  0%{opacity:0;transform:scale(.5)}
  22%{opacity:1;transform:scale(1.14)}
  36%{transform:scale(1)}
  78%{opacity:1}
  100%{opacity:0;transform:scale(1.05) translateY(-16px)}
}
#msg{
  position:absolute;left:0;right:0;top:52%;text-align:center;pointer-events:none;
  font-size:17px;font-weight:700;opacity:0;color:var(--lime);text-shadow:0 2px 10px rgba(0,0,0,.8);
}
#msg.go{animation:bn .8s ease-out}

/* ---- おおいかぶさる画面 ---- */
.veil{
  position:absolute;inset:0;z-index:5;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:13px;padding:26px 22px;text-align:center;
  background:radial-gradient(90% 70% at 50% 40%,rgba(59,15,58,.975),rgba(16,4,19,.995));
  border-radius:22px;
}
.veil.show{display:flex;animation:vin .3s ease-out}
@keyframes vin{from{opacity:0}to{opacity:1}}
.veil h1{font-size:31px;font-weight:800;letter-spacing:.03em;line-height:1.35}
.veil h2{font-size:26px;font-weight:800;letter-spacing:.03em}
.veil p{font-size:13.5px;line-height:1.95;opacity:.9;max-width:19em}
.big{font-size:62px;font-weight:800;color:var(--lime);line-height:1;
  text-shadow:0 0 26px rgba(182,255,61,.55)}
.big small{font-size:17px;margin-left:4px;opacity:.8}
.sub{display:flex;gap:9px}
.sub span{background:rgba(255,233,216,.1);border:1px solid rgba(255,233,216,.2);
  border-radius:12px;padding:8px 14px;font-size:12px}
.sub b{display:block;font-size:19px;margin-top:2px}
.btn{
  margin-top:4px;background:var(--lime);color:#22331a;border:0;border-radius:16px;
  font-family:inherit;font-weight:800;font-size:19px;letter-spacing:.05em;
  padding:16px 44px;cursor:pointer;box-shadow:0 8px 0 #7fb51f,0 14px 26px rgba(0,0,0,.45);
}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #7fb51f,0 8px 16px rgba(0,0,0,.45)}
.how{display:flex;align-items:center;justify-content:center;gap:7px;margin:2px 0 2px}
.how svg{display:block}
.how em{font-style:normal;font-size:19px;opacity:.55}
.hint{font-size:12.5px;opacity:.82;line-height:1.85;max-width:20em}
.hint b{color:var(--lime)}
footer{text-align:center;font-size:10px;letter-spacing:.14em;opacity:.4}
</style>
</head>
<body>
<div id="stage">

  <div id="hud">
    <div class="pill" id="nabewrap">
      <i>なべの スライム</i>
      <b><span id="cnt">2</span> / 26</b>
      <div id="bar"><div id="barin"></div></div>
    </div>
    <div class="pill"><i>スコア</i><b id="scv">0</b></div>
    <button id="snd" aria-label="音">🔊</button>
  </div>

  <div id="pot">
    <canvas id="cv"></canvas>
    <div id="fx"></div>
    <div id="flash"></div>
    <div id="banner"></div>
    <div id="msg"></div>

    <div class="veil show" id="title">
      <h1>ふえる<br>スライム</h1>
      <div class="how">
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#7fd11a"/><circle cx="12" cy="14" r="2.2" fill="#2b0c2c"/><circle cx="22" cy="14" r="2.2" fill="#2b0c2c"/></svg>
        <em>▸</em>
        <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#a8f03a"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#a8f03a"/></svg>
        <em>▸</em>
        <svg width="17" height="17" viewBox="0 0 17 17"><circle cx="8.5" cy="8.5" r="7.5" fill="#d9ff7a"/></svg>
        <svg width="17" height="17" viewBox="0 0 17 17"><circle cx="8.5" cy="8.5" r="7.5" fill="#d9ff7a"/></svg>
        <em>▸</em>
        <svg width="17" height="17" viewBox="0 0 17 17"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="#ffe9d8" stroke-width="1.6" stroke-dasharray="2.4 2.6"/></svg>
      </div>
      <p>タップすると スライムが 2つに わかれる。<br>いちばん小さいのを タップすると きえる。<br><b style="color:var(--lime)">なべが あふれるまえに どこまで。</b></p>
      <button class="btn" id="start">はじめる</button>
    </div>

    <div class="veil" id="over">
      <h2 id="ovt">なべが あふれた！</h2>
      <div class="big"><span id="fsc">0</span><small>てん</small></div>
      <div class="sub">
        <span>けした<b id="fk">0</b></span>
        <span>もった<b id="ft">0秒</b></span>
        <span>さいだいれんさ<b id="fc">0</b></span>
      </div>
      <p class="hint" id="fh"></p>
      <button class="btn" id="again">もういちど</button>
    </div>
  </div>

  <footer>CHUPPY GAMES / DAY 028</footer>
</div>

<script>
"use strict";
/* ================= ばん(なべ)の大きさ ================= */
const FW = 360, FH = 540;
const TIER = { 3:{r:46, sp:90,  c:"#7fd11a", e:1},
               2:{r:31, sp:130, c:"#a8f03a", e:1},
               1:{r:21, sp:172, c:"#d9ff7a", e:0} };
const PAD   = 13;      // タップの あたり判定の のりしろ
const LIMIT = 26;      // これだけ たまると あふれる
const SP0   = 3.9;     // さいしょの わく間隔(秒)
const SPMIN = 1.0;     // いちばん みじかい わく間隔
const SPDEC = 0.045;   // 1秒ごとに みじかくなる量
const COMBO_WIN = 2.4, COMBO_N = 3;   // 小演出:3匹を2.4秒以内
const BIG_WIN   = 3.0, BIG_N   = 6;   // 大演出:6匹を3.0秒以内

/* ================= 部品 ================= */
const $ = id => document.getElementById(id);
const cv=$("cv"), fx=$("fx"), pot=$("pot"), flash=$("flash"),
      banner=$("banner"), msg=$("msg"), barin=$("barin"),
      cntEl=$("cnt"), scvEl=$("scv"), titleEl=$("title"), overEl=$("over");
const ctx = cv.getContext("2d");

let SC = 1;
function fit(){
  const b = pot.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width  = Math.round(b.width*dpr);
  cv.height = Math.round(b.height*dpr);
  SC = cv.width / FW;
}
addEventListener("resize", fit);

/* ================= 状態 ================= */
let phase = "title";      // title / play / over
let slimes = [], puffs = [];
let t=0, nextSpawn=0, score=0, kills=0, combo=0, maxCombo=0;
let killLog = [], bigDone=false, smallDone=false, seed=1;

function rnd(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; }
function rr(a,b){ return a + rnd()*(b-a); }

function makeSlime(tier, x, y, ang){
  const T = TIER[tier];
  return { tier, r:T.r, x, y,
           vx:Math.cos(ang)*T.sp, vy:Math.sin(ang)*T.sp,
           ph:rnd()*6.28, sq:0, sqx:0, pop:0, born:t };
}

function reset(){
  slimes = []; puffs = []; fx.innerHTML = "";
  t=0; nextSpawn=SP0; score=0; kills=0; combo=0; maxCombo=0;
  killLog=[]; bigDone=false; smallDone=false;
  seed = (Date.now() % 100000) + 7;
  for(let i=0;i<2;i++) slimes.push(makeSlime(3, rr(70,FW-70), rr(70,FH-70), rnd()*6.28));
  refreshHud();
}

function refreshHud(){
  cntEl.textContent = slimes.length;
  scvEl.textContent = score;
  const p = slimes.length / LIMIT;
  barin.style.width = Math.min(100, p*100) + "%";
  barin.classList.toggle("hot", p >= 0.62);
  barin.classList.toggle("max", p >= 0.85);
}

/* ================= 音 ================= */
let AC=null, mg=null, sg=null, bgmOn=true, bgmTimer=null, beat=0;
function audio(){
  if(AC) return AC;
  const C = window.AudioContext || window.webkitAudioContext;
  if(!C) return null;
  AC = new C();
  mg = AC.createGain(); mg.gain.value = 0.30; mg.connect(AC.destination); // BGM
  sg = AC.createGain(); sg.gain.value = 0.85; sg.connect(AC.destination); // 効果音
  return AC;
}
function tone(f, type, dur, vol, dest){
  if(!AC || !bgmOn) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f, AC.currentTime);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g); g.connect(dest||sg); o.start(); o.stop(AC.currentTime+dur);
}
function slide(f1, f2, type, dur, vol){
  if(!AC || !bgmOn) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g); g.connect(sg); o.start(); o.stop(AC.currentTime+dur);
}
const BASS=[110,110,146.83,164.81], ARP=[440,554.37,659.25,554.37,493.88,659.25,587.33,493.88];
function startBgm(){
  stopBgm();
  if(!AC || !bgmOn) return;
  bgmTimer = setInterval(()=>{
    if(!AC || !bgmOn) return;
    tone(BASS[(beat>>3)%4], "triangle", 0.22, 0.30, mg);
    tone(ARP[beat%8], "square", 0.13, 0.10, mg);
    if(beat%4===0) tone(78,"sine",0.15,0.34,mg);
    if(beat%4===2) tone(7400,"square",0.02,0.05,mg);
    beat++;
  }, 168);
}
function stopBgm(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
function hush(){ stopBgm(); if(AC && AC.state==="running") AC.suspend(); }
addEventListener("visibilitychange", ()=>{
  if(document.hidden){ hush(); }
  else if(phase==="play" && bgmOn && AC){ AC.resume(); startBgm(); }
});
addEventListener("pagehide", hush);
addEventListener("blur", hush);

$("snd").onclick = e=>{
  e.stopPropagation();
  bgmOn = !bgmOn;
  $("snd").classList.toggle("off", !bgmOn);
  $("snd").textContent = bgmOn ? "🔊" : "🔇";
  if(!bgmOn) stopBgm(); else if(phase==="play"){ audio(); if(AC.state==="suspended") AC.resume(); startBgm(); }
};

/* ================= しずく(DOM の粒) ================= */
function drop(x, y, n, color, power){
  const b = pot.getBoundingClientRect();
  const k = b.width / FW;
  for(let i=0;i<n;i++){
    const a = rnd()*6.28, d = power*(0.35+rnd()*0.9);
    const el = document.createElement("i");
    el.className = "drop";
    el.style.setProperty("--x", (x*k)+"px");
    el.style.setProperty("--y", (y*k)+"px");
    el.style.setProperty("--dx", (Math.cos(a)*d*k)+"px");
    el.style.setProperty("--dy", (Math.sin(a)*d*k + 40*k)+"px");
    el.style.setProperty("--sz", (rr(5,13)*k)+"px");
    el.style.setProperty("--rot", Math.round(rr(-260,260))+"deg");
    el.style.setProperty("--dur", rr(0.55,1.05).toFixed(2)+"s");
    el.style.setProperty("--c", color);
    el.addEventListener("animationend", ()=>el.remove());
    fx.appendChild(el);
  }
}
function shake(big){ pot.classList.remove("shake","shakeBig"); void pot.offsetWidth;
  pot.classList.add(big ? "shakeBig" : "shake"); }
function light(){ flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on"); }
function say(el, text){ el.textContent = text; el.classList.remove("go"); void el.offsetWidth; el.classList.add("go"); }

/* 小演出 */
function fxSmall(n){
  smallDone = true;
  drop(rr(90,FW-90), rr(120,FH-120), 30+Math.floor(rnd()*20), "#d9ff7a", 150);
  say(msg, "れんさ " + n + "！");
  shake(false);
  slide(660, 1320, "square", 0.16, 0.16);
}
/* 大演出:0.5秒間隔で4波 */
function fxBig(){
  bigDone = true;
  say(banner, "だいれんさ！！");
  for(let w=0; w<4; w++){
    setTimeout(()=>{
      drop(rr(60,FW-60), rr(80,FH-80), 44, w%2 ? "#ffe9d8" : "#b6ff3d", 210);
      if(w===0 || w===2) light();
      if(w<3) shake(w===0);
      tone([523.25,659.25,783.99,1046.5][w], "square", 0.2, 0.2);
    }, w*500);
  }
}

/* ================= タップ ================= */
function fieldPos(ev){
  const b = cv.getBoundingClientRect();
  return { x:(ev.clientX-b.left)/b.width*FW, y:(ev.clientY-b.top)/b.height*FH };
}
cv.addEventListener("pointerdown", ev=>{
  if(phase!=="play") return;
  ev.preventDefault();
  const p = fieldPos(ev);
  let best=-1, bd=1e9;
  for(let i=0;i<slimes.length;i++){
    const s = slimes[i];
    const d = Math.hypot(s.x-p.x, s.y-p.y);
    /* ★ここが あたり判定。ゆびと中心の きょり d が、半径+のりしろ より ちいさければ当たり */
    if(d < s.r + PAD && d < bd){ bd=d; best=i; }
  }
  if(best<0) return;
  hitSlime(best);
});

function hitSlime(i){
  const s = slimes[i];
  if(s.tier === 1){
    slimes.splice(i,1);
    kills++;
    killLog.push(t);
    while(killLog.length && t - killLog[0] > 8) killLog.shift();
    // れんさ = 直近 COMBO_WIN 秒に けした数
    combo = 0;
    for(const k of killLog) if(t - k <= COMBO_WIN) combo++;
    if(combo>maxCombo) maxCombo = combo;
    score += 10 + (combo-1)*5;
    drop(s.x, s.y, 14, "#d9ff7a", 90);
    slide(880, 220, "sine", 0.18, 0.22);
    // 大演出: 6匹を3.0秒以内 / 小演出: 3匹を2.4秒以内(そのチェーンで1回だけ)
    const n6 = killLog.length>=BIG_N && (t - killLog[killLog.length-BIG_N]) <= BIG_WIN;
    if(n6){ fxBig(); score += 120; killLog = []; combo = 0; }
    else if(combo === COMBO_N){ fxSmall(combo); score += 30; }
  }else{
    const nt = s.tier-1, T = TIER[nt];
    const a = rnd()*6.28;
    slimes.splice(i,1);
    for(const sgn of [1,-1]){
      const ns = makeSlime(nt,
        Math.min(FW-T.r, Math.max(T.r, s.x + Math.cos(a)*sgn*T.r*1.05)),
        Math.min(FH-T.r, Math.max(T.r, s.y + Math.sin(a)*sgn*T.r*1.05)),
        a + (sgn>0 ? 0 : Math.PI));
      ns.pop = 0.26;
      slimes.push(ns);
    }
    drop(s.x, s.y, 9, TIER[s.tier].c, 70);
    tone(s.tier===3 ? 196 : 262, "square", 0.09, 0.16);
  }
  refreshHud();
  if(slimes.length >= LIMIT) gameOver();
}

/* ================= あふれ ================= */
function gameOver(){
  phase = "over";
  stopBgm();
  for(let w=0;w<3;w++) setTimeout(()=>{
    drop(rr(40,FW-40), FH-40, 34, w%2?"#b6ff3d":"#ffe9d8", 190);
    if(w===0) shake(true);
  }, w*180);
  slide(300, 60, "sawtooth", 0.9, 0.3);
  $("fsc").textContent = score;
  $("fk").textContent  = kills;
  $("ft").textContent  = Math.floor(t) + "秒";
  $("fc").textContent  = maxCombo;
  let h;
  if(kills < 8)        h = "大きいのを われば われるほど、なべの数は <b>ふえる</b>。小さいのを けしきると 1匹ぶん へるよ。";
  else if(!smallDone)  h = "小さいのを つづけて3匹けすと <b>れんさ</b>。まとめて けすと 点が のびる。";
  else if(!bigDone)    h = "小さいのを 6匹つづけて けすと <b>だいれんさ</b>。わざと 小さいのを ためてみて。";
  else                 h = "だいれんさ まで いった！ つぎは <b>60秒</b> をめざそう。";
  $("fh").innerHTML = h;
  setTimeout(()=>overEl.classList.add("show"), 700);
}

/* ================= ループ ================= */
let last = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last)/1000 || 0);
  last = now;

  if(phase === "play"){
    t += dt;
    // わいてくる
    while(t >= nextSpawn && slimes.length < LIMIT){
      const s = makeSlime(3, rr(70,FW-70), rr(70,FH-70), rnd()*6.28);
      s.pop = 0.34;
      slimes.push(s);
      puffs.push({x:s.x, y:s.y, r:0, life:0.5});
      tone(150, "sine", 0.14, 0.2);
      nextSpawn += Math.max(SPMIN, SP0 - nextSpawn*SPDEC);
      refreshHud();
      if(slimes.length >= LIMIT){ gameOver(); break; }
    }
    // うごき
    for(const s of slimes){
      s.x += s.vx*dt; s.y += s.vy*dt;
      if(s.x < s.r){ s.x = s.r; s.vx = Math.abs(s.vx); s.sqx = 1; }
      if(s.x > FW-s.r){ s.x = FW-s.r; s.vx = -Math.abs(s.vx); s.sqx = 1; }
      if(s.y < s.r){ s.y = s.r; s.vy = Math.abs(s.vy); s.sq = 1; }
      if(s.y > FH-s.r){ s.y = FH-s.r; s.vy = -Math.abs(s.vy); s.sq = 1; }
      s.ph += dt*3.4;
      s.sq  = Math.max(0, s.sq - dt*4.5);
      s.sqx = Math.max(0, s.sqx - dt*4.5);
      s.pop = Math.max(0, s.pop - dt);
    }
    for(let i=puffs.length-1;i>=0;i--){
      puffs[i].life -= dt; puffs[i].r += dt*170;
      if(puffs[i].life<=0) puffs.splice(i,1);
    }
  }
  draw();
}

function blob(s){
  const w = 1 + s.sqx*0.22 - s.sq*0.16;
  const h = 1 - s.sqx*0.18 + s.sq*0.26;
  const grow = s.pop>0 ? (1 - s.pop*1.1) : 1;
  ctx.save();
  ctx.translate(s.x*SC, s.y*SC);
  ctx.scale(w*grow, h*grow);
  const R = s.r*SC;

  ctx.beginPath();
  for(let k=0;k<=30;k++){
    const a = k/30*Math.PI*2;
    const rad = R * (1 + Math.sin(a*3 + s.ph)*0.035 + Math.sin(a*2 - s.ph*0.7)*0.028);
    const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
    k ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(-R*0.3,-R*0.4,R*0.1, 0,0,R*1.15);
  g.addColorStop(0, "#f2ffd0");
  g.addColorStop(0.34, TIER[s.tier].c);
  g.addColorStop(1, "#4e8f0e");
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(1, R*0.055);
  ctx.strokeStyle = "rgba(35,70,8,.45)"; ctx.stroke();

  // つや
  ctx.beginPath();
  ctx.ellipse(-R*0.34, -R*0.42, R*0.24, R*0.15, -0.5, 0, 6.283);
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fill();

  // め(大・中だけ)
  if(TIER[s.tier].e){
    const ex = R*0.30, ey = -R*0.05, er = R*0.115;
    ctx.fillStyle = "#2b0c2c";
    ctx.beginPath(); ctx.arc(-ex, ey, er, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc( ex, ey, er, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(-ex+er*0.4, ey-er*0.4, er*0.35, 0, 6.283);
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fill();
    ctx.beginPath(); ctx.arc( ex+er*0.4, ey-er*0.4, er*0.35, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function draw(){
  const W = cv.width, H = cv.height;
  const g = ctx.createRadialGradient(W*0.5,H*0.34,0, W*0.5,H*0.5,H*0.78);
  g.addColorStop(0, "#5d1649"); g.addColorStop(0.62, "#3a0e33"); g.addColorStop(1, "#220a24");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // なべの中の ゆらぎ
  ctx.save();
  ctx.globalAlpha = 0.10; ctx.strokeStyle = "#ffe9d8"; ctx.lineWidth = 1.4*SC;
  for(let i=0;i<4;i++){
    const yy = H*(0.2+i*0.2) + Math.sin(t*0.7+i)*8*SC;
    ctx.beginPath();
    for(let x=0;x<=W;x+=12*SC) ctx.lineTo(x, yy + Math.sin(x/(46*SC)+t*1.1+i)*5*SC);
    ctx.stroke();
  }
  ctx.restore();

  // わいた あと の わ
  for(const p of puffs){
    ctx.beginPath(); ctx.arc(p.x*SC, p.y*SC, p.r*SC, 0, 6.283);
    ctx.strokeStyle = "rgba(255,233,216," + (p.life*0.6) + ")";
    ctx.lineWidth = 3*SC; ctx.stroke();
  }

  // かげ → スライム
  for(const s of slimes){
    ctx.beginPath();
    ctx.ellipse(s.x*SC, (s.y+s.r*0.62)*SC, s.r*0.9*SC, s.r*0.34*SC, 0, 0, 6.283);
    ctx.fillStyle = "rgba(15,4,18,.30)"; ctx.fill();
  }
  for(const s of slimes) blob(s);
}

/* ================= はじめる ================= */
function begin(){
  titleEl.classList.remove("show");
  overEl.classList.remove("show");
  reset();
  phase = "play";
  audio();
  if(AC && AC.state === "suspended") AC.resume();
  beat = 0; startBgm();
}
$("start").onclick = begin;
$("again").onclick = begin;

addEventListener("load", fit);
fit();
reset();
requestAnimationFrame(loop);
</script>
</body>
