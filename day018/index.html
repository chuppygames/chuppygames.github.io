<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>くずてつマグネット</title>
<style>
  :root{
    --base:#e0a83f;
    --base2:#b97f2c;
    --paper:#fdf3df;
    --ink:#2b1d0f;
    --dim:rgba(43,29,15,0.55);
    --accent:#e8432f;
    --iron:#dfe2e0;
    --iron2:#8b9088;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--base2); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh; overflow:hidden;
  }
  .app{ width:100%; max-width:460px; height:100vh; height:100dvh; max-height:920px; position:relative; }
  .stage{ position:absolute; inset:0; }
  canvas{ width:100%; height:100%; display:block; touch-action:none; }

  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:6; }
  .flash.go{ animation:flashOut .5s ease-out forwards; }
  @keyframes flashOut{ 0%{opacity:.72} 100%{opacity:0} }

  .shakeit{ animation:shk .4s ease-in-out; }
  @keyframes shk{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-6px,3px)}
    40%{transform:translate(6px,-4px)}
    60%{transform:translate(-5px,-2px)}
    80%{transform:translate(4px,3px)}
  }

  /* ---------- HUD ---------- */
  .hud{
    position:absolute; left:0; right:0; top:0; z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;
    display:flex; flex-direction:column; gap:9px; pointer-events:none;
  }
  .hudtop{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .scorechip{
    font-size:13px; font-weight:800; letter-spacing:.04em;
    border:2px solid var(--ink); border-radius:999px; padding:5px 15px;
    background:var(--paper); display:flex; align-items:center; gap:6px;
  }
  .scorechip b{ font-size:17px; }
  .combochip{
    font-size:11.5px; font-weight:800; letter-spacing:.03em;
    border:2px solid var(--accent); border-radius:999px; padding:4px 12px;
    background:var(--paper); color:var(--accent);
    opacity:0; transform:scale(.7); transition:opacity .18s, transform .18s;
  }
  .combochip.show{ opacity:1; transform:scale(1); }
  .timerBar{ height:10px; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--paper); }
  .timerFill{ height:100%; width:100%; background:var(--ink); transition:width .1s linear; }
  .timerFill.warn{ background:var(--accent); }

  .soundBtn{
    position:absolute; right:14px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); z-index:5;
    width:42px; height:42px; border-radius:50%; border:2px solid var(--ink);
    background:var(--paper); font-size:18px; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- popup / banner ---------- */
  .pop{
    position:absolute; z-index:7; font-weight:800; font-size:15px; pointer-events:none;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
    animation:popup .7s ease-out forwards;
  }
  @keyframes popup{
    0%{ transform:translate(-50%,-50%) scale(.6); opacity:0; }
    22%{ transform:translate(-50%,-90%) scale(1.08); opacity:1; }
    100%{ transform:translate(-50%,-160%) scale(1); opacity:0; }
  }
  .toast{
    position:absolute; left:50%; top:16%; transform:translateX(-50%) scale(.5);
    z-index:8; background:var(--paper); color:var(--ink);
    border:3px solid var(--ink); border-radius:999px; padding:8px 20px;
    font-size:15px; font-weight:800; opacity:0; pointer-events:none;
  }
  .toast.show{ animation:toastIn 1.1s ease-out forwards; }
  @keyframes toastIn{
    0%{ transform:translateX(-50%) scale(.4); opacity:0; }
    20%{ transform:translateX(-50%) scale(1.08); opacity:1; }
    35%,78%{ transform:translateX(-50%) scale(1); opacity:1; }
    100%{ transform:translateX(-50%) translateY(-18px) scale(.92); opacity:0; }
  }
  .banner{
    position:absolute; inset:0; z-index:9; display:none; align-items:center; justify-content:center; pointer-events:none;
  }
  .banner.show{ display:flex; }
  .bnrbox{
    background:var(--accent); border:5px solid var(--ink); border-radius:22px;
    padding:22px 30px; text-align:center; color:var(--paper);
    box-shadow:10px 10px 0 rgba(43,29,15,.4);
    animation:burstIn .48s cubic-bezier(.2,1.8,.4,1);
  }
  @keyframes burstIn{ 0%{transform:scale(.3) rotate(-10deg); opacity:0} 100%{transform:scale(1) rotate(-2deg); opacity:1} }
  .bnrbox .big{ font-size:26px; font-weight:800; line-height:1.3; }
  .bnrbox .small{ font-size:12.5px; font-weight:700; margin-top:6px; opacity:.9; }

  /* ---------- overlay panels ---------- */
  .overlay{
    position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:rgba(43,29,15,.55); padding:22px;
  }
  .overlay.hidden{ display:none; }
  .panel{
    background:var(--paper); border:4px solid var(--ink); border-radius:22px;
    padding:26px 22px; text-align:center; max-width:340px; width:100%;
    box-shadow:8px 8px 0 rgba(43,29,15,.35);
  }
  .panel h1{ font-size:21px; line-height:1.5; margin-bottom:12px; }
  .panel h2{ font-size:20px; margin-bottom:10px; }
  .panel p{ font-size:13px; line-height:1.9; color:var(--dim); text-align:left; }
  .panel .hint{ font-size:11.5px; color:var(--accent); font-weight:700; margin-top:10px; }
  .bigscore{ font-size:44px; font-weight:800; margin:8px 0 2px; }
  .subscore{ font-size:12px; color:var(--dim); margin-bottom:10px; }
  .btn{
    margin-top:18px; width:100%; padding:14px; border-radius:14px;
    border:3px solid var(--ink); background:var(--accent); color:var(--paper);
    font-size:15px; font-weight:800; font-family:inherit;
    box-shadow:0 5px 0 var(--ink);
  }
  .btn:active{ transform:translateY(5px); box-shadow:0 0 0 var(--ink); }
  .btn.sub{ background:var(--paper); color:var(--ink); box-shadow:0 5px 0 var(--dim); margin-top:10px; }
  .btn.sub:active{ box-shadow:0 0 0 var(--dim); }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="flash" id="flash"></div>
    <div class="banner" id="banner"><div class="bnrbox"><div class="big" id="bnrBig"></div><div class="small" id="bnrSmall"></div></div></div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="hud">
    <div class="hudtop">
      <div class="scorechip">スコア <b id="scoreHud">0</b></div>
      <div class="combochip" id="comboChip">コンボ x0</div>
    </div>
    <div class="timerBar"><div class="timerFill" id="timerFill"></div></div>
  </div>

  <button class="soundBtn" id="soundBtn">🔊</button>

  <div class="overlay" id="startScreen">
    <div class="panel">
      <h1>くずてつを<br>じしゃくで あつめよう</h1>
      <p>
        ゆびで がめんを おさえると 磁石が ひかる(ON)。<br>
        はなすと OFF になるよ。<br><br>
        ひかっているあいだ、近くの <b style="color:var(--ink)">銀いろの てつくず</b> を吸いよせる。<br>
        <b style="color:var(--accent)">くろい 地雷</b> も磁石にはくっつくから、近づけると げんてん。<br><br>
        連続キャッチで とくべつな えんしゅつが出るよ。<br>
        せいげん時間は 22びょう。
      </p>
      <button class="btn" id="startBtn">はじめる</button>
    </div>
  </div>

  <div class="overlay hidden" id="resultScreen">
    <div class="panel">
      <h2 id="resultTitle">けっか</h2>
      <div class="bigscore" id="resultScore">0</div>
      <div class="subscore" id="resultSub"></div>
      <p id="resultText" style="text-align:center"></p>
      <div class="hint" id="resultHint" style="display:none"></div>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ==================================================================
   バランス定数 — モンテカルロ 10万試行 x 3スキル帯で検証済み(別スクリプト)

   コンボ = 地雷を吸着させずに連続でくず鉄をキャッチした数。
   3コンボごとに小演出、9コンボで大演出。地雷を吸着すると0にリセット。
   モデル: 22秒間、平均0.725秒おきにアイテム出現(てつ55%/地雷20%/くず25%)。
   キャッチ成否と地雷の誤吸着は腕前ごとの確率で近似。

     小演出(3連続)到達率: 苦手 73.9% / ふつう 99.8% / 上手い 100.0%
     大演出(9連続)到達率: 苦手  2.1% / ふつう  35.9% / 上手い  87.2%
     平均スコア          : 苦手 23.9   / ふつう  76.8   / 上手い 127.1
   小演出は50%以上、大演出はふつう帯で25〜40%の目標を満たす。
   ここを触ったらバランス確認スクリプトで再検証すること。
================================================================== */
const DURATION   = 22;      // 秒
const SPAWN_MIN  = 0.5, SPAWN_MAX = 0.95;
const P_IRON     = 0.55, P_MINE = 0.20;   // 残り0.25がくず(無反応)
const COMBO_SMALL= 3, COMBO_BIG = 9;

const G          = 560;     // 重力 px/s^2
const PULL_R     = 78;      // 磁石の吸引半径
const CATCH_D    = 28;      // キャッチ判定距離
const PULL_ACC   = 1500;    // 吸引の最大加速度

/* ================= キャンバス ================= */
const LW = 390, LH = 760;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  const rect = cv.getBoundingClientRect();
  cv.width = Math.round(rect.width*dpr);
  cv.height = Math.round(rect.height*dpr);
  scale = Math.min(rect.width/LW, rect.height/LH);
  offX = (rect.width - LW*scale)/2;
  offY = (rect.height - LH*scale)/2;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,100));

/* ================= 音 ================= */
let actx=null, master=null, sfxG=null, bgmG=null, soundOn=true, bgmTimer=null, bgmStep=0;
function ensureAudio(){
  if (actx) return;
  const AC = window.AudioContext||window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = soundOn?1:0; master.connect(actx.destination);
  sfxG = actx.createGain(); sfxG.gain.value = 0.75; sfxG.connect(master);
  bgmG = actx.createGain(); bgmG.gain.value = 0.28; bgmG.connect(master);
}
function tone(freq, dur, type, node, vol, delay){
  if (!actx) return;
  const t0 = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol==null?0.4:vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(node||sfxG);
  o.start(t0); o.stop(t0+dur+0.03);
}
function sfxOn(){ tone(90,0.09,'square',sfxG,0.16); }
function sfxCatch(){ tone(720,0.09,'triangle',sfxG,0.28); tone(1080,0.1,'triangle',sfxG,0.16,0.05); }
function sfxSmall(){ [660,880,1046].forEach((f,i)=>tone(f,0.16,'square',sfxG,0.22,i*0.06)); }
function sfxBig(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.28,'square',sfxG,0.3,i*0.07)); }
function sfxMine(){ [300,220,150].forEach((f,i)=>tone(f,0.26,'sawtooth',sfxG,0.26,i*0.11)); }
function sfxFinish(){ [392,494,587].forEach((f,i)=>tone(f,0.24,'triangle',sfxG,0.24,i*0.09)); }
const HUM = [70,72,70,68];
function startBgm(){
  if (!actx || bgmTimer) return;
  bgmStep = 0;
  bgmTimer = setInterval(()=>{
    if (!soundOn || !actx) return;
    tone(HUM[bgmStep%HUM.length], 0.5, 'sawtooth', bgmG, 0.10);
    bgmStep++;
  }, 500);
}
function stopBgm(){ if (bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
function silence(){ stopBgm(); if (actx && actx.state==='running') actx.suspend(); }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) silence(); });
window.addEventListener('pagehide', silence);
window.addEventListener('blur', silence);

const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', ()=>{
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  if (master) master.gain.value = soundOn?1:0;
});

/* ================= エフェクト ================= */
const app = document.getElementById('app');
const flash = document.getElementById('flash');
const toast = document.getElementById('toast');
const banner = document.getElementById('banner');
const bnrBig = document.getElementById('bnrBig');
const bnrSmall = document.getElementById('bnrSmall');
const stageEl = document.querySelector('.stage');

function shakeApp(){ app.classList.remove('shakeit'); void app.offsetWidth; app.classList.add('shakeit'); }
function doFlash(){ flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }

function popupText(text, x, y, color){
  const p = document.createElement('div');
  p.className = 'pop'; p.textContent = text; p.style.color = color;
  const rect = cv.getBoundingClientRect();
  p.style.left = (rect.left - stageEl.getBoundingClientRect().left + offX + x*scale) + 'px';
  p.style.top  = (rect.top  - stageEl.getBoundingClientRect().top  + offY + y*scale) + 'px';
  stageEl.appendChild(p);
  setTimeout(()=>p.remove(), 750);
}

function showToast(text){
  toast.textContent = text;
  toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1200);
}

function smallCelebrate(text){
  showToast(text); shakeApp(); sfxSmall();
  spawnBurst(magnet.x, magnet.y, 16, false);
}

function bigCelebrate(big, small){
  sfxBig();
  // 0.5秒間隔で4波かさねる(光2回・ゆれ3回)
  doFlash(); shakeApp(); spawnBurst(magnet.x, magnet.y, 34, true);
  setTimeout(()=>{ shakeApp(); spawnBurst(magnet.x, magnet.y, 20, true); }, 500);
  setTimeout(()=>{ doFlash(); shakeApp(); spawnBurst(magnet.x, magnet.y, 20, true); }, 1000);
  setTimeout(()=>{ spawnBurst(magnet.x, magnet.y, 14, true); }, 1500);
  bnrBig.textContent = big; bnrSmall.textContent = small||'';
  banner.classList.add('show');
  setTimeout(()=>banner.classList.remove('show'), 1900);
}

function mineHitFX(){
  shakeApp(); doFlash(); sfxMine();
  spawnBurst(magnet.x, magnet.y, 18, false, true);
}

/* ================= ゲーム状態 ================= */
let state = 'start'; // start | playing | result
let items = [];
let particles = [];
let score = 0, combo = 0, elapsed = 0, nextSpawnAt = 0;
let ironCaught = 0, mineHits = 0;

const magnet = { x: LW/2, y: LH*0.55, on:false };

function spawnItem(){
  const r = Math.random();
  let type;
  if (r < P_IRON) type = 'iron';
  else if (r < P_IRON+P_MINE) type = 'mine';
  else type = 'junk';
  items.push({
    type,
    variant: Math.floor(Math.random()*2),
    x: 28 + Math.random()*(LW-56),
    y: -24,
    vx: (Math.random()-0.5)*16,
    vy: 34 + Math.random()*36,
    rot: Math.random()*Math.PI*2,
    rotSpeed: (Math.random()-0.5)*2.2,
    phase: Math.random()*Math.PI*2,
  });
}

function spawnBurst(x, y, n, gold, mine){
  for (let i=0;i<n;i++){
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*260,
      vy: -120 - Math.random()*220,
      life: 0.6 + Math.random()*0.5,
      age: 0,
      r: 2 + Math.random()*3,
      mine: !!mine,
      gold: !!gold,
    });
  }
}

/* ================= 入力 ================= */
function toLogical(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  return {
    x: (clientX - rect.left - offX) / scale,
    y: (clientY - rect.top  - offY) / scale,
  };
}
function clampMagnet(){
  magnet.x = Math.max(20, Math.min(LW-20, magnet.x));
  magnet.y = Math.max(30, Math.min(LH-30, magnet.y));
}
function onDown(e){
  ensureAudio();
  if (actx && actx.state==='suspended') actx.resume();
  if (state !== 'playing') return;
  const p = toLogical(e.clientX, e.clientY);
  magnet.x = p.x; magnet.y = p.y; clampMagnet();
  magnet.on = true;
  sfxOn();
  e.preventDefault();
}
function onMove(e){
  if (state !== 'playing' || !magnet.on) return;
  const p = toLogical(e.clientX, e.clientY);
  magnet.x = p.x; magnet.y = p.y; clampMagnet();
  e.preventDefault();
}
function onUp(){ magnet.on = false; }
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('pointerleave', onUp);

/* ================= キャッチ処理 ================= */
const comboChip = document.getElementById('comboChip');
const scoreHud = document.getElementById('scoreHud');

function updateHud(){
  scoreHud.textContent = score;
  if (combo>0){
    comboChip.textContent = 'コンボ x'+combo;
    comboChip.classList.add('show');
  } else {
    comboChip.classList.remove('show');
  }
}

function handleCatch(item){
  if (item.type === 'iron'){
    score += 10; combo++; ironCaught++;
    popupText('+10', item.x, item.y, 'var(--ink)');
    sfxCatch();
    if (combo % COMBO_BIG === 0){
      bigCelebrate(combo+'れんちゃく！', 'てつくず職人 まであと少し');
    } else if (combo % COMBO_SMALL === 0){
      smallCelebrate(combo+'れんちゃく！');
    } else {
      spawnBurst(item.x, item.y, 8, false);
    }
  } else if (item.type === 'mine'){
    score = Math.max(0, score-15); combo = 0; mineHits++;
    popupText('-15', item.x, item.y, 'var(--accent)');
    mineHitFX();
  }
  updateHud();
}

/* ================= ループ ================= */
let lastT = 0;
function frame(now){
  if (!lastT) lastT = now;
  let dt = (now-lastT)/1000; lastT = now;
  dt = Math.min(dt, 0.033);

  if (state === 'playing') update(dt);
  draw();
  requestAnimationFrame(frame);
}

function update(dt){
  elapsed += dt;

  if (elapsed >= nextSpawnAt){
    spawnItem();
    nextSpawnAt = elapsed + SPAWN_MIN + Math.random()*(SPAWN_MAX-SPAWN_MIN);
  }

  for (let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.vy += G*dt;
    it.vx += Math.sin(elapsed*2.2+it.phase)*10*dt;
    it.vx *= 0.995;

    if (magnet.on && it.type !== 'junk'){
      const dx = magnet.x-it.x, dy = magnet.y-it.y;
      const dist = Math.hypot(dx,dy);
      if (dist < PULL_R && dist > 0.001){
        const f = 1 - dist/PULL_R;
        it.vx += (dx/dist)*PULL_ACC*f*dt;
        it.vy += (dy/dist)*PULL_ACC*f*dt;
      }
      if (dist < CATCH_D){
        handleCatch(it);
        items.splice(i,1);
        continue;
      }
    }

    it.x += it.vx*dt;
    it.y += it.vy*dt;
    it.rot += it.rotSpeed*dt;

    if (it.y > LH+40) items.splice(i,1);
  }

  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.age += dt;
    if (p.age > p.life){ particles.splice(i,1); continue; }
    p.vy += 420*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }

  const timeLeft = Math.max(0, DURATION-elapsed);
  const fill = document.getElementById('timerFill');
  fill.style.width = (timeLeft/DURATION*100)+'%';
  fill.classList.toggle('warn', timeLeft < 5);

  if (elapsed >= DURATION) finishGame();
}

/* ================= 描画 ================= */
function drawMagnet(){
  const pulse = magnet.on ? 1+Math.sin(elapsed*10)*0.05 : 1;
  const col = magnet.on ? '#e8432f' : '#a9998a';

  // U字の磁石本体
  ctx.save();
  ctx.translate(magnet.x, magnet.y);
  ctx.scale(pulse, pulse);
  if (magnet.on){ ctx.shadowColor='rgba(232,67,47,0.85)'; ctx.shadowBlur=22; }
  ctx.strokeStyle = col; ctx.lineWidth = 13; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-17, -22);
  ctx.lineTo(-17, 8);
  ctx.arc(0, 8, 17, Math.PI, 0, false);
  ctx.lineTo(17, -22);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#dfe2e0';
  ctx.fillRect(-22, -30, 10, 12);
  ctx.fillRect(12, -30, 10, 12);
  ctx.restore();
}

function drawIron(it){
  ctx.save();
  ctx.translate(it.x, it.y); ctx.rotate(it.rot);
  ctx.strokeStyle = '#5f645d'; ctx.lineWidth = 2;
  if (it.variant === 0){
    // 六角ナット
    ctx.fillStyle = '#dfe2e0';
    ctx.beginPath();
    for (let i=0;i<6;i++){
      const a = Math.PI/3*i;
      const px = Math.cos(a)*12, py = Math.sin(a)*12;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b8bcb6';
    ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
  } else {
    // ボルト
    ctx.fillStyle = '#dfe2e0';
    ctx.fillRect(-6,-13,12,20); ctx.strokeRect(-6,-13,12,20);
    ctx.beginPath(); ctx.arc(0,-16,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawMine(it){
  ctx.save();
  ctx.translate(it.x, it.y);
  const glow = 0.35 + Math.sin(elapsed*6+it.phase)*0.15;
  ctx.fillStyle = 'rgba(232,67,47,'+glow+')';
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#20160e';
  ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#e8432f'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(4,-12); ctx.quadraticCurveTo(14,-20,10,-26); ctx.stroke();
  ctx.fillStyle = '#ffb23c';
  ctx.beginPath(); ctx.arc(10,-26,2.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawJunk(it){
  ctx.save();
  ctx.translate(it.x, it.y); ctx.rotate(it.rot);
  if (it.variant === 0){
    ctx.fillStyle = '#8a5a2e';
    ctx.beginPath();
    ctx.moveTo(-9,-5); ctx.lineTo(7,-8); ctx.lineTo(10,4); ctx.lineTo(-6,8);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = '#f2e6c8';
    ctx.beginPath();
    ctx.moveTo(-8,-6); ctx.lineTo(8,-4); ctx.lineTo(6,7); ctx.lineTo(-7,5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawGround(){
  const g = ctx.createLinearGradient(0,0,0,LH);
  g.addColorStop(0,'#eec46c');
  g.addColorStop(0.55,'#dba244');
  g.addColorStop(1,'#a97328');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,LW,LH);
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.arc(LW-56,66,46,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(43,29,15,0.06)';
  for (let i=0;i<6;i++){
    ctx.beginPath();
    ctx.ellipse(30+i*66, LH-24, 30, 8, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function draw(){
  ctx.clearRect(0,0,LW,LH);
  drawGround();
  for (const it of items){
    if (it.type==='iron') drawIron(it);
    else if (it.type==='mine') drawMine(it);
    else drawJunk(it);
  }
  drawMagnet();
  for (const p of particles){
    const a = 1 - p.age/p.life;
    ctx.fillStyle = p.mine ? 'rgba(232,67,47,'+a+')' : (p.gold ? 'rgba(255,178,60,'+a+')' : 'rgba(223,226,224,'+a+')');
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
}

/* ================= 画面遷移 ================= */
const startScreen = document.getElementById('startScreen');
const resultScreen = document.getElementById('resultScreen');

function startGame(){
  items = []; particles = [];
  score = 0; combo = 0; elapsed = 0; nextSpawnAt = 0.4;
  ironCaught = 0; mineHits = 0;
  magnet.on = false; magnet.x = LW/2; magnet.y = LH*0.55;
  updateHud();
  document.getElementById('timerFill').classList.remove('warn');
  document.getElementById('timerFill').style.width = '100%';
  startScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  state = 'playing';
  startBgm();
}

function finishGame(){
  state = 'result';
  stopBgm();
  sfxFinish();
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultSub').textContent = 'てつくず '+ironCaught+'本 ／ 地雷 '+mineHits+'回';

  let title, text, hint = '';
  if (score >= 120){
    title = 'たつじん！';
    text = 'すごい集中力。ベテランのくずてつ職人だ。';
  } else if (score >= 60){
    title = 'なかなか！';
    text = 'いい感じに集められた。もっと連続を狙ってみて。';
  } else {
    title = 'もう少し！';
    text = '黒い地雷にじしゃくを近づけすぎたかも。';
    hint = 'コツ: 銀色だけを追いかけて、黒いのは指をはなして避けよう';
  }
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultText').textContent = text;
  const hintEl = document.getElementById('resultHint');
  if (hint){ hintEl.textContent = hint; hintEl.style.display='block'; }
  else hintEl.style.display='none';

  resultScreen.classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

resize();
requestAnimationFrame(frame);
})();
</script>
